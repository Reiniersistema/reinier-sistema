<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransGestión - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0047AB; /* Azul cobalto */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .logo-circle {
            background-color: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo-text {
            color: black;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: -2px;
        }

        .brand-name {
            color: black;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.2);
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-circle">
            <span class="logo-text">RF</span>
        </div>
        
        <div class="brand-name">TransGestión</div>

        <div class="login-card">
            <div class="input-group">
                <input type="tel" id="telefono" placeholder="Número de teléfono" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <button onclick="login()">Iniciar Sesión</button>
        </div>
    </div>

    <script>
        async function login() {
            const telefono = document.getElementById('telefono').value;
            const password = document.getElementById('password').value;

        }
    </script>
</body>
</html>

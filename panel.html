<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primario: #121212;
            --dorado: #d4af37;
            --blanco: #ffffff;
            --gris-oscuro: #1e1e1e;
        }

        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            background: var(--primario); color: var(--blanco);
            overflow-x: hidden;
        }

        /* BARRA LATERAL DESLIZANTE */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 1000; top: 0; left: 0;
            background-color: var(--gris-oscuro);
            overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid var(--dorado);
        }

        .sidebar a {
            padding: 12px 24px; text-decoration: none;
            font-size: 15px; color: #818181;
            display: block; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .sidebar a:hover { color: var(--dorado); background: rgba(212, 175, 55, 0.1); }

        .sidebar .closebtn {
            position: absolute; top: 10px; right: 25px;
            font-size: 36px; margin-left: 50px; color: var(--dorado);
        }

        /* CONTENIDO PRINCIPAL */
        #main { transition: margin-left .5s; padding: 20px; }

        .header-panel { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: var(--dorado); }

        .logo-txt { font-family: 'Playfair Display', serif; font-size: 24px; }

        /* TABLAS Y GRÁFICAS */
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        
        @media(min-width: 768px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }

        .card {
            background: var(--gris-oscuro); padding: 20px;
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
        }

        .card h3 { margin-top: 0; color: var(--dorado); font-size: 16px; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { text-align: left; color: #818181; padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 12px 10px; border-bottom: 1px solid #222; }

    </style>
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="panel.html" style="color: var(--dorado); font-weight: bold;">Panel de Control</a>
        <a href="crear-viaje.html">Crear Viajes</a>
        <a href="mis-viajes.html">Mis Viajes</a>
        <a href="choferes.html">Choferes</a>
        <a href="pagos-pendientes.html">Pagos Pendientes</a>
        <a href="pagos-aprobar.html">Pagos por Aprobar</a>
        <a href="tarjetas.html">Tarjetas</a>
        <a href="transferencias.html">Transferencias</a>
        <a href="colaboracion.html">Colaboración</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="economia.html">Economía</a>
        <a href="clientes.html">Clientes</a>
        <hr style="border: 0.5px solid #333; margin: 20px;">
        <a href="#" onclick="cerrarSesion()" style="color: #ff4d4d;">Cerrar Sesión</a>
    </div>

    <div id="main">
        <div class="header-panel">
            <button class="openbtn" onclick="openNav()">&#9776;</button>
            <div class="logo-txt">RF <span style="font-size: 14px; color: var(--dorado);">TransGestión</span></div>
        </div>

        <h2 style="font-weight: 300;">Bienvenido, <span id="user-name" style="font-weight: 700; color: var(--dorado);">...</span></h2>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Viajes Recientes</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Estado</th>
                            <th>Precio</th>
                            <th>Origen</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-recientes">
                        </tbody>
                </table>
            </div>

            <div class="card">
                <h3>Viajes Diarios</h3>
                <canvas id="graficaViajes"></canvas>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Funciones del Menú
        function openNav() { document.getElementById("mySidebar").style.width = "280px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

        const usuario = JSON.parse(localStorage.getItem('usuario_activo'));
        if (!usuario) window.location.href = "index.html";
        document.getElementById('user-name').innerText = usuario.nombre;

        async function cargarDatosPanel() {
            // Limpiar la tabla antes de cargar para evitar duplicados
            const tbody = document.getElementById('tabla-recientes');
            tbody.innerHTML = ""; 

            // 1. Cargar últimos 5 viajes
            // Hemos simplificado la consulta para asegurar que traiga los datos sin errores de relación
            const { data: viajes, error } = await supabaseClient
                .from('viajes')
                .select('precio, origen, chofer_id')
                .order('created_at', { ascending: false })
                .limit(5);

            if (error) {
                console.error("Error cargando datos:", error);
                tbody.innerHTML = "<tr><td colspan='3'>Error al cargar datos</td></tr>";
                return;
            }

            if (viajes && viajes.length > 0) {
                viajes.forEach(v => {
                    tbody.innerHTML += `<tr>
                        <td>${v.chofer_id ? 'Asignado' : 'Pendiente'}</td>
                        <td>$${v.precio}</td>
                        <td>${v.origen}</td>
                    </tr>`;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='3'>No hay viajes registrados</td></tr>";
            }

            // 2. Configurar Gráfica
            const ctx = document.getElementById('graficaViajes').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'],
                    datasets: [{
                        label: 'Viajes',
                        data: [12, 19, 3, 5, 2, 3, 10],
                        borderColor: '#d4af37',
                        tension: 0.4
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario_activo');
            window.location.href = "index.html";
        }

        cargarDatosPanel();
    </script>
</body>
</html>

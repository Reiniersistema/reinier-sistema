<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .btn-menu { background: white; padding: 1.5rem; border-radius: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s; border-bottom: 4px solid #e2e8f0; }
        .btn-menu:active { transform: scale(0.95); border-bottom-width: 0; margin-top: 4px; }
        .btn-menu i { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .stats-card { background: #1e5bb9; border-radius: 2.5rem; padding: 1.5rem; color: white; margin-bottom: 1.5rem; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 flex justify-between items-center bg-white shadow-sm sticky top-0 z-50">
        <div>
            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Bienvenido,</p>
            <h1 class="text-xl font-black italic uppercase tracking-tighter text-[#1e5bb9]">CONGO MUSUNDI</h1>
        </div>
        <button onclick="cerrarSesion()" class="w-10 h-10 bg-slate-100 rounded-full text-slate-400 flex items-center justify-center">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        
        <div class="stats-card shadow-xl shadow-blue-200">
            <div class="flex justify-between items-start mb-4">
                <p class="text-[10px] font-black uppercase opacity-70 tracking-widest">Resumen del Día</p>
                <i class="fas fa-chart-line opacity-50"></i>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p id="total_viajes" class="text-3xl font-black">0</p>
                    <p class="text-[9px] font-bold uppercase opacity-70">Viajes Realizados</p>
                </div>
                <div class="text-right">
                    <p id="total_fondo" class="text-3xl font-black">$0</p>
                    <p class="text-[9px] font-bold uppercase opacity-70">Recaudación App</p>
                </div>
            </div>
        </div>

        <div class="menu-grid">
            <a href="crear-viaje.html" class="btn-menu text-blue-600">
                <i class="fas fa-plus-circle"></i>
                <span class="text-[10px] font-black uppercase">Nuevo Viaje</span>
            </a>
            
            <a href="mis-viajes.html" class="btn-menu text-orange-500">
                <i class="fas fa-route"></i>
                <span class="text-[10px] font-black uppercase">Viajes Activos</span>
            </a>

            <a href="choferes.html" class="btn-menu text-slate-700">
                <i class="fas fa-users"></i>
                <span class="text-[10px] font-black uppercase">Gestión Choferes</span>
            </a>

            <a href="filtrar_viajes.html" class="btn-menu text-purple-600">
                <i class="fas fa-history"></i>
                <span class="text-[10px] font-black uppercase">Historial</span>
            </a>

            <a href="#" class="btn-menu text-green-500 opacity-50">
                <i class="fas fa-wallet"></i>
                <span class="text-[10px] font-black uppercase">Caja Central</span>
            </a>

            <a href="#" class="btn-menu text-slate-400 opacity-50">
                <i class="fas fa-cog"></i>
                <span class="text-[10px] font-black uppercase">Ajustes</span>
            </a>
        </div>

        <div class="mt-8 bg-white p-4 rounded-3xl border border-dashed border-slate-300">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <p class="text-[10px] font-black text-slate-500 uppercase">Estado del Servidor: Online</p>
            </div>
        </div>

    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        window.onload = function() {
            if(localStorage.getItem('auth_congo') !== 'true') {
                window.location.href = 'index.html';
            }
            cargarEstadisticas();
        }

        async function cargarEstadisticas() {
            // Contar viajes de hoy
            const hoy = new Date().toISOString().split('T')[0];
            const { count: viajesHoy } = await supabaseClient
                .from('viajes')
                .select('*', { count: 'exact', head: true })
                .gte('created_at', hoy);
            
            document.getElementById('total_viajes').innerText = viajesHoy || 0;

            // Calcular recaudación total (basado en fondos de choferes)
            const { data: choferes } = await supabaseClient
                .from('choferes')
                .select('fondo_actual');
            
            const total = choferes.reduce((acc, c) => acc + (c.fondo_actual || 0), 0);
            document.getElementById('total_fondo').innerText = "$" + total.toFixed(0);
        }

        function cerrarSesion() {
            localStorage.removeItem('auth_congo');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

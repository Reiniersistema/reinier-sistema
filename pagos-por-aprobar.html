<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos por Aprobar - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #28a745; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }

        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 10px; color: var(--dorado); font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 13px; }

        .puntos { color: var(--dorado); font-weight: bold; font-size: 22px; cursor: pointer; text-align: center; width: 30px; }

        /* Menú de Opciones (Dropdown) */
        .opciones-menu { display: none; position: absolute; background: #252525; border: 1px solid var(--dorado); border-radius: 8px; z-index: 100; min-width: 120px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .opciones-menu button { display: block; width: 100%; padding: 12px; background: none; border: none; color: white; text-align: left; cursor: pointer; font-family: 'Montserrat'; font-size: 12px; }
        .opciones-menu button:hover { background: #333; color: var(--dorado); }

        /* Modal para Ver Detalles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; }
        .modal-content { background: var(--gris); margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; border: 1px solid var(--dorado); }
        .info-foto { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; border: 2px solid var(--dorado); margin-bottom: 15px; }
        .detail-row { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .detail-label { color: var(--dorado); font-size: 10px; text-transform: uppercase; display: block; }
    </style>
</head>
<body>

<div class="header">
    <h2>Pagos por Aprobar</h2>
</div>

<div class="tabla-contenedor">
    <table>
        <thead>
            <tr>
                <th>Chófer</th>
                <th>Teléfono</th>
                <th>Fondo Inicial</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="lista-aprobar">
            </tbody>
    </table>
</div>

<div id="menuFlotante" class="opciones-menu">
    <button onclick="verDetalles()">Ver</button>
    <button onclick="aprobarChofer()" style="color: var(--verde);">Aprobar</button>
    <button onclick="eliminarChofer()" style="color: var(--rojo);">Eliminar</button>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" id="detalleContenido">
        </div>
</div>

<script src="config.js"></script>
<script>
    let choferSeleccionado = null;

    async function cargarPendientes() {
        // Buscamos choferes cuyo estado sea 'pendiente' o que no hayan sido aprobados
        const { data, error } = await supabaseClient
            .from('choferes')
            .select('*')
            .eq('aprobado', false) // Asumiendo que tienes una columna booleana 'aprobado'
            .order('created_at', { ascending: false });

        const tbody = document.getElementById('lista-aprobar');
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px;">No hay registros pendientes de aprobación.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(c => `
            <tr>
                <td><b>${c.nombre} ${c.apellido || ''}</b></td>
                <td>${c.telefono}</td>
                <td style="color:var(--dorado)">$${c.fondo_actual}</td>
                <td class="puntos" onclick="mostrarMenu(event, ${JSON.stringify(c).replace(/"/g, '&quot;')})">⋮</td>
            </tr>
        `).join('');
    }

    function mostrarMenu(event, chofer) {
        choferSeleccionado = chofer;
        const menu = document.getElementById('menuFlotante');
        menu.style.display = 'block';
        menu.style.left = (event.pageX - 100) + 'px';
        menu.style.top = (event.pageY) + 'px';
        
        // Cerrar menú al hacer clic fuera
        document.addEventListener('click', function closeMenu(e) {
            if (!event.target.classList.contains('puntos')) {
                menu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
            }
        });
    }

    function verDetalles() {
        const c = choferSeleccionado;
        const modal = document.getElementById('modalVer');
        const contenido = document.getElementById('detalleContenido');
        
        contenido.innerHTML = `
            <img src="${c.foto_chofer || 'https://via.placeholder.com/300'}" class="info-foto">
            <div class="detail-row"><span class="detail-label">Nombre Completo</span>${c.nombre} ${c.apellido || ''}</div>
            <div class="detail-row"><span class="detail-label">Teléfono</span>${c.telefono}</div>
            <div class="detail-row"><span class="detail-label">Fondo</span>$${c.fondo_actual}</div>
            <div class="detail-row"><span class="detail-label">Licencia Operativa</span>${c.tiene_licencia_operativa ? 'SÍ' : 'NO'}</div>
            <div class="detail-row"><span class="detail-label">Vehículo</span>${c.marca_carro} ${c.modelo_carro} (${c.color_carro})</div>
            <button onclick="cerrarModal()" style="width:100%; padding:12px; background:var(--dorado); border:none; border-radius:8px; margin-top:15px; font-weight:bold; cursor:pointer;">CERRAR</button>
        `;
        modal.style.display = 'block';
    }

    async function aprobarChofer() {
        if (confirm(`¿Autorizar a ${choferSeleccionado.nombre} para realizar viajes?`)) {
            const { error } = await supabaseClient
                .from('choferes')
                .update({ aprobado: true }) // Cambia el estado a aprobado
                .eq('id', choferSeleccionado.id);

            if (!error) {
                alert("Chófer aprobado correctamente.");
                cargarPendientes();
            } else {
                alert("Error al aprobar: " + error.message);
            }
        }
    }

    async function eliminarChofer() {
        if (confirm(`¿Estás seguro de ELIMINAR a ${choferSeleccionado.nombre}? Esta acción no se puede deshacer.`)) {
            const { error } = await supabaseClient
                .from('choferes')
                .delete()
                .eq('id', choferSeleccionado.id);

            if (!error) {
                alert("Chófer eliminado de la base de datos.");
                cargarPendientes();
            } else {
                alert("Error al eliminar: " + error.message);
            }
        }
    }

    function cerrarModal() { document.getElementById('modalVer').style.display = 'none'; }

    cargarPendientes();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 16px; text-transform: uppercase; margin: 0; }

        .search-box { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; margin-bottom: 20px; box-sizing: border-box; font-family: 'Montserrat'; }

        /* Tabla de Clientes */
        .tabla-container { background: var(--gris); border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #252525; color: var(--dorado); padding: 15px; text-align: left; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        tr:active { background: #222; }

        /* Listado de Viajes en Modal */
        .viaje-card { background: #000; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid var(--dorado); cursor: pointer; }
        .viaje-card:active { background: #111; transform: scale(0.98); }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .modal-content { background: var(--gris); max-width: 450px; margin: 20px auto; border-radius: 20px; padding: 25px; border: 1px solid var(--dorado); }

        .btn-accion { width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; font-family: 'Montserrat'; }
        .btn-edit { background: var(--azul); color: white; }
        .btn-del { background: var(--rojo); color: white; }
        .btn-close { background: none; color: #888; }
        
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        label { font-size: 11px; color: var(--dorado); text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2>CLIENTES REGISTRADOS</h2>
</div>

<input type="text" id="buscador" class="search-box" placeholder="Buscar teléfono..." onkeyup="filtrar()">

<div class="tabla-container">
    <table>
        <thead>
            <tr><th>Teléfono</th><th style="text-align:right;">Viajes</th></tr>
        </thead>
        <tbody id="lista-clientes"></tbody>
    </table>
</div>

<div id="modalHistorial" class="modal">
    <div class="modal-content">
        <h3 id="h-titulo" style="color:var(--dorado); margin-top:0;"></h3>
        <div id="contenedor-viajes"></div>
        <button class="btn-accion btn-close" onclick="cerrar('modalHistorial')">VOLVER</button>
    </div>
</div>

<div id="modalDetalleViaje" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--dorado); text-align:center; margin-top:0;">DATOS DEL VIAJE</h3>
        
        <div id="form-viaje">
            <label>Origen</label>
            <input type="text" id="v-origen">
            <label>Paradas Intermedias</label>
            <input type="text" id="v-paradas">
            <label>Destino</label>
            <input type="text" id="v-destino">
            <label>Precio (CUP)</label>
            <input type="number" id="v-precio">
            <label>Usuario que registró</label>
            <input type="text" id="v-usuario" disabled>
            <label>Fecha y Hora</label>
            <input type="text" id="v-fecha" disabled>
        </div>

        <button class="btn-accion btn-edit" onclick="actualizarViaje()">GUARDAR CAMBIOS</button>
        <button class="btn-accion btn-del" onclick="eliminarViaje()">ELIMINAR VIAJE</button>
        <button class="btn-accion btn-close" onclick="cerrar('modalDetalleViaje')">CANCELAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    let todosLosViajes = [];
    let clientesData = {};
    let viajeSeleccionado = null;

    async function cargar() {
        const { data } = await supabaseClient.from('viajes').select('*').order('created_at', {ascending: false});
        todosLosViajes = data || [];
        procesar();
    }

    function procesar() {
        clientesData = {};
        todosLosViajes.forEach(v => {
            const tel = v.cliente_telefono || "S/N";
            clientesData[tel] = (clientesData[tel] || 0) + 1;
        });
        dibujar(clientesData);
    }

    function dibujar(datos) {
        const lista = document.getElementById('lista-clientes');
        lista.innerHTML = Object.keys(datos).map(tel => `
            <tr onclick="abrirHistorial('${tel}')">
                <td><b>${tel}</b></td>
                <td style="text-align:right;">${datos[tel]}</td>
            </tr>
        `).join('');
    }

    function filtrar() {
        const buscar = document.getElementById('buscador').value;
        const filtrados = {};
        Object.keys(clientesData).forEach(tel => {
            if(tel.includes(buscar)) filtrados[tel] = clientesData[tel];
        });
        dibujar(filtrados);
    }

    // Al tocar un cliente, vemos todos sus viajes
    function abrirHistorial(tel) {
        document.getElementById('h-titulo').innerText = "Viajes: " + tel;
        const viajesCli = todosLosViajes.filter(v => v.cliente_telefono === tel);
        const cont = document.getElementById('contenedor-viajes');
        
        cont.innerHTML = viajesCli.map(v => `
            <div class="viaje-card" onclick="abrirPlanillaViaje(${v.id})">
                <div style="font-size:11px; color:#888;">${v.fecha} - ${v.hora}</div>
                <div style="font-weight:bold; margin:5px 0;">${v.origen} → ${v.destino}</div>
                <div style="color:var(--dorado); font-size:13px;">$${v.precio} CUP</div>
            </div>
        `).join('');
        document.getElementById('modalHistorial').style.display = 'block';
    }

    // Al tocar un viaje específico, abrimos la planilla para editar/eliminar
    function abrirPlanillaViaje(id) {
        viajeSeleccionado = todosLosViajes.find(v => v.id === id);
        
        document.getElementById('v-origen').value = viajeSeleccionado.origen;
        document.getElementById('v-paradas').value = viajeSeleccionado.paradas_intermedias || "";
        document.getElementById('v-destino').value = viajeSeleccionado.destino;
        document.getElementById('v-precio').value = viajeSeleccionado.precio;
        document.getElementById('v-usuario').value = viajeSeleccionado.usuario_nombre || "Sistema";
        document.getElementById('v-fecha').value = `${viajeSeleccionado.fecha} ${viajeSeleccionado.hora}`;
        
        document.getElementById('modalDetalleViaje').style.display = 'block';
    }

    async function actualizarViaje() {
        const nuevosDatos = {
            origen: document.getElementById('v-origen').value,
            paradas_intermedias: document.getElementById('v-paradas').value,
            destino: document.getElementById('v-destino').value,
            precio: document.getElementById('v-precio').value
        };

        const { error } = await supabaseClient.from('viajes').update(nuevosDatos).eq('id', viajeSeleccionado.id);
        if(!error) location.reload();
    }

    async function eliminarViaje() {
        const pass = prompt("Contraseña de administrador para eliminar viaje:");
        if(pass === "admin123") {
            await supabaseClient.from('viajes').delete().eq('id', viajeSeleccionado.id);
            location.reload();
        }
    }

    function cerrar(id) { document.getElementById(id).style.display = 'none'; }
    cargar();
</script>
</body>
</html>

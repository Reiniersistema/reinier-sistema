<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clientes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 30px; -webkit-tap-highlight-color: transparent; }
        
        /* ESTILOS DEL MENÚ UNIVERSAL */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 3000; top: 0; left: 0;
            background-color: #1e1e1e;
            overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid #d4af37;
        }
        .sidebar a {
            padding: 12px 24px; text-decoration: none;
            font-size: 15px; color: #818181;
            display: block; transition: 0.3s;
            text-transform: uppercase;
        }
        .sidebar a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #d4af37; }

        .header-nav-universal { 
            display: flex; align-items: center; gap: 15px; 
            padding: 15px; background: #121212; 
            border-bottom: 1px solid #d4af37; margin-bottom: 20px;
        }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }

        /* Estilos propios de la página */
        .contenedor-principal { padding: 0 15px; }
        .header-titulo { border-bottom: 1px solid var(--dorado); padding-bottom: 10px; margin-bottom: 20px; }
        h2 { color: var(--dorado); font-size: 16px; margin: 0; text-transform: uppercase; }

        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; }

        .card-lista { background: var(--gris); border-radius: 15px; border: 1px solid #333; width: 100%; border-collapse: collapse; overflow: hidden; }
        .card-lista td { padding: 15px; border-bottom: 1px solid #2a2a2a; font-size: 15px; }
        .card-lista tr:active { background: #252525; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 4000; overflow-y: auto; }
        .modal-content { background: var(--gris); max-width: 450px; margin: 15px auto; border-radius: 20px; padding: 20px; border: 1px solid var(--dorado); }

        .viaje-item { background: #000; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid var(--dorado); cursor: pointer; display: block; }
        .viaje-item * { pointer-events: none; }

        label { color: var(--dorado); font-size: 11px; text-transform: uppercase; display: block; margin: 12px 0 5px 0; font-weight: bold; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #000; color: white; box-sizing: border-box; font-size: 15px; font-family: 'Montserrat'; }
        input:disabled { color: #888; border-color: #222; }

        .btn { width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; border: none; margin-top: 12px; cursor: pointer; font-family: 'Montserrat'; font-size: 14px; }
        .btn-edit { background: var(--azul); color: white; }
        .btn-del { background: var(--rojo); color: white; }
        .btn-back { background: none; color: #888; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <div class="header-titulo"><h2>CLIENTES REGISTRADOS</h2></div>

    <input type="text" id="buscador" class="search-box" placeholder="Buscar número de teléfono..." oninput="filtrar()">

    <table class="card-lista">
        <tbody id="lista-clientes"></tbody>
    </table>
</div>

<div id="modalGlobal" class="modal">
    <div class="modal-content">
        <div id="vista-historial">
            <h3 id="historial-titulo" style="color:var(--dorado); margin-top:0;">HISTORIAL</h3>
            <div id="contenedor-viajes"></div>
            <button class="btn btn-back" onclick="cerrar()">CERRAR</button>
        </div>

        <div id="vista-planilla" style="display:none;">
            <h3 style="color:var(--dorado); text-align:center; margin-top:0;">PLANILLA DE VIAJE</h3>
            <label>Origen</label><input type="text" id="inp-origen">
            <label>Paradas Intermedias</label><input type="text" id="inp-paradas">
            <label>Destino</label><input type="text" id="inp-destino">
            <label>Precio (CUP)</label><input type="number" id="inp-precio">
            <label>Fecha y Hora</label><input type="text" id="inp-fecha" disabled>
            <label>Usuario que registró</label><input type="text" id="inp-user" disabled>
            
            <button class="btn btn-edit" onclick="actualizarViaje()">GUARDAR CAMBIOS</button>
            <button class="btn btn-del" onclick="eliminarViaje()">ELIMINAR VIAJE</button>
            <button class="btn btn-back" onclick="volverAlHistorial()">← VOLVER AL LISTADO</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
    let viajesCache = [];
    let viajeActualId = null;

    async function cargar() {
        const { data } = await supabaseClient.from('viajes').select('*').order('created_at', {ascending: false});
        viajesCache = data || [];
        renderizarClientes(viajesCache);
    }

    function renderizarClientes(lista) {
        const conteo = {};
        lista.forEach(v => {
            const t = v.cliente_telefono || "S/N";
            conteo[t] = (conteo[t] || 0) + 1;
        });
        const tbody = document.getElementById('lista-clientes');
        tbody.innerHTML = Object.keys(conteo).map(tel => `
            <tr onclick="mostrarHistorial('${tel}')">
                <td><b>${tel}</b></td>
                <td style="text-align:right; color:var(--dorado)">${conteo[tel]} viajes</td>
            </tr>
        `).join('');
    }

    function mostrarHistorial(tel) {
        document.getElementById('historial-titulo').innerText = "Viajes de " + tel;
        const misViajes = viajesCache.filter(v => v.cliente_telefono === tel);
        const cont = document.getElementById('contenedor-viajes');
        cont.innerHTML = "";
        misViajes.forEach(v => {
            const f = new Date(v.created_at);
            const fLegible = f.toLocaleDateString();
            const hLegible = f.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement('div');
            div.className = 'viaje-item';
            div.innerHTML = `
                <div style="font-size:11px; color:#888;">${fLegible} - ${hLegible}</div>
                <div style="font-weight:bold; margin:4px 0;">${v.origen} → ${v.destino}</div>
                <div style="color:var(--dorado); font-size:13px;">$${v.precio} CUP</div>
            `;
            div.addEventListener('click', () => abrirPlanilla(v.id));
            cont.appendChild(div);
        });
        document.getElementById('vista-historial').style.display = 'block';
        document.getElementById('vista-planilla').style.display = 'none';
        document.getElementById('modalGlobal').style.display = 'block';
    }

    function abrirPlanilla(id) {
        const v = viajesCache.find(x => x.id == id);
        if(!v) return;
        viajeActualId = id;

        const fechaObj = new Date(v.created_at);
        const fechaPlanilla = fechaObj.toLocaleDateString() + " " + fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        document.getElementById('inp-origen').value = v.origen;
        document.getElementById('inp-paradas').value = v.paradas_intermedias || "";
        document.getElementById('inp-destino').value = v.destino;
        document.getElementById('inp-precio').value = v.precio;
        document.getElementById('inp-fecha').value = fechaPlanilla;

        const datosSesion = JSON.parse(localStorage.getItem('usuario_activo'));
        const nombreParaMostrar = (v.usuario_nombre && v.usuario_nombre !== "undefined") ? v.usuario_nombre : (datosSesion ? datosSesion.nombre : "Admin");
        
        document.getElementById('inp-user').value = nombreParaMostrar;

        document.getElementById('vista-historial').style.display = 'none';
        document.getElementById('vista-planilla').style.display = 'block';
    }

    function filtrar() {
        const query = document.getElementById('buscador').value.toLowerCase();
        const filtrados = viajesCache.filter(v => (v.cliente_telefono || "").includes(query));
        renderizarClientes(filtrados);
    }

    function volverAlHistorial() {
        document.getElementById('vista-planilla').style.display = 'none';
        document.getElementById('vista-historial').style.display = 'block';
    }

    async function actualizarViaje() {
        const upd = {
            origen: document.getElementById('inp-origen').value,
            paradas_intermedias: document.getElementById('inp-paradas').value,
            destino: document.getElementById('inp-destino').value,
            precio: document.getElementById('inp-precio').value
        };
        await supabaseClient.from('viajes').update(upd).eq('id', viajeActualId);
        location.reload();
    }

    async function eliminarViaje() {
        if(confirm("¿Eliminar viaje?")) {
            await supabaseClient.from('viajes').delete().eq('id', viajeActualId);
            location.reload();
        }
    }

    function cerrar() { document.getElementById('modalGlobal').style.display = 'none'; }
    cargar();
</script>
</body>
</html>

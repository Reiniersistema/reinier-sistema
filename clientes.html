<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clientes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 16px; text-transform: uppercase; margin: 0; }

        .search-box { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; margin-bottom: 20px; box-sizing: border-box; }

        /* Tabla Principal */
        .tabla-container { background: var(--gris); border-radius: 15px; border: 1px solid #333; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px; border-bottom: 1px solid #2a2a2a; font-size: 15px; }
        tr:active { background: #252525; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .modal-content { background: var(--gris); max-width: 450px; margin: 10px auto; border-radius: 20px; padding: 25px; border: 1px solid var(--dorado); position: relative; }

        /* Tarjetas de Viaje */
        .viaje-card { background: #000; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid var(--dorado); }
        .viaje-card:active { background: #1a1a1a; }

        /* Inputs y Botones */
        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; }
        label { font-size: 11px; color: var(--dorado); text-transform: uppercase; display: block; margin-bottom: 4px; }

        .btn { width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; font-family: 'Montserrat'; }
        .btn-edit { background: var(--azul); color: white; }
        .btn-del { background: var(--rojo); color: white; }
        .btn-close { background: none; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <h2>CLIENTES</h2>
</div>

<input type="text" id="buscador" class="search-box" placeholder="Buscar teléfono..." onkeyup="filtrar()">

<div class="tabla-container">
    <table>
        <tbody id="lista-clientes"></tbody>
    </table>
</div>

<div id="modalUnico" class="modal">
    <div class="modal-content">
        <div id="vista-lista">
            <h3 id="titulo-cliente" style="color:var(--dorado); margin-top:0;">VIAJES</h3>
            <div id="cont-viajes"></div>
            <button class="btn btn-close" onclick="cerrar()">CERRAR</button>
        </div>

        <div id="vista-edicion" style="display:none;">
            <h3 style="color:var(--dorado); text-align:center; margin-top:0;">DETALLE DEL VIAJE</h3>
            <label>Origen</label><input type="text" id="e-origen">
            <label>Paradas</label><input type="text" id="e-paradas">
            <label>Destino</label><input type="text" id="e-destino">
            <label>Precio (CUP)</label><input type="number" id="e-precio">
            
            <button class="btn btn-edit" onclick="actualizar()">GUARDAR CAMBIOS</button>
            <button class="btn btn-del" onclick="eliminar()">ELIMINAR VIAJE</button>
            <button class="btn btn-close" onclick="volverALista()">← VOLVER ATRÁS</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
    let todosLosViajes = [];
    let viajeSeleccionado = null;
    let telActual = "";

    async function cargar() {
        const { data } = await supabaseClient.from('viajes').select('*').order('created_at', {ascending: false});
        todosLosViajes = data || [];
        mostrarClientes(todosLosViajes);
    }

    function mostrarClientes(viajes) {
        const counts = {};
        viajes.forEach(v => { counts[v.cliente_telefono] = (counts[v.cliente_telefono] || 0) + 1; });
        
        document.getElementById('lista-clientes').innerHTML = Object.keys(counts).map(tel => `
            <tr onclick="abrirHistorial('${tel}')">
                <td><b>${tel}</b></td>
                <td style="text-align:right; color:var(--dorado)">${counts[tel]} viajes</td>
            </tr>
        `).join('');
    }

    function abrirHistorial(tel) {
        telActual = tel;
        document.getElementById('titulo-cliente').innerText = "Historial: " + tel;
        const filtrados = todosLosViajes.filter(v => v.cliente_telefono === tel);
        
        document.getElementById('cont-viajes').innerHTML = filtrados.map(v => `
            <div class="viaje-card" onclick="irAEdicion(${v.id})">
                <div style="font-size:11px; color:#888;">${v.fecha} - ${v.hora}</div>
                <div style="font-weight:bold; margin:5px 0;">${v.origen} → ${v.destino}</div>
                <div style="color:var(--dorado); font-size:13px;">$${v.precio} CUP</div>
            </div>
        `).join('');

        document.getElementById('vista-lista').style.display = 'block';
        document.getElementById('vista-edicion').style.display = 'none';
        document.getElementById('modalUnico').style.display = 'block';
    }

    function irAEdicion(id) {
        viajeSeleccionado = todosLosViajes.find(v => v.id == id);
        if(!viajeSeleccionado) return;

        document.getElementById('e-origen').value = viajeSeleccionado.origen;
        document.getElementById('e-paradas').value = viajeSeleccionado.paradas_intermedias || "";
        document.getElementById('e-destino').value = viajeSeleccionado.destino;
        document.getElementById('e-precio').value = viajeSeleccionado.precio;

        document.getElementById('vista-lista').style.display = 'none';
        document.getElementById('vista-edicion').style.display = 'block';
    }

    function volverALista() {
        document.getElementById('vista-edicion').style.display = 'none';
        document.getElementById('vista-lista').style.display = 'block';
    }

    async function actualizar() {
        const datos = {
            origen: document.getElementById('e-origen').value,
            paradas_intermedias: document.getElementById('e-paradas').value,
            destino: document.getElementById('e-destino').value,
            precio: document.getElementById('e-precio').value
        };
        await supabaseClient.from('viajes').update(datos).eq('id', viajeSeleccionado.id);
        location.reload();
    }

    async function eliminar() {
        if(confirm("¿Eliminar este viaje permanentemente?")) {
            await supabaseClient.from('viajes').delete().eq('id', viajeSeleccionado.id);
            location.reload();
        }
    }

    function filtrar() {
        const val = document.getElementById('buscador').value;
        const f = todosLosViajes.filter(v => v.cliente_telefono.includes(val));
        mostrarClientes(f);
    }

    function cerrar() { document.getElementById('modalUnico').style.display = 'none'; }
    cargar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #28a745; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        /* Buscador / Filtro */
        .filtro-container { display: none; margin-bottom: 15px; }
        .filtro-container input { width: 100%; padding: 12px; background: var(--gris); border: 1px solid var(--dorado); color: white; border-radius: 8px; box-sizing: border-box; }

        /* Tabla Principal */
        .tabla-contenedor { overflow-x: auto; background: var(--gris); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px; color: var(--dorado); font-size: 12px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 14px; }
        .puntos { cursor: pointer; color: var(--dorado); font-weight: bold; font-size: 20px; text-align: center; }

        /* Modales */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { background: var(--gris); margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; border: 1px solid var(--dorado); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--dorado); font-size: 11px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        
        /* Vista Detallada "Ver" */
        .foto-grande { width: 100%; height: 250px; border-radius: 15px; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-card { background: #000; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .stat-card span { display: block; font-size: 10px; color: var(--dorado); }
        .stat-card b { font-size: 16px; }

        /* Pestañas en el detalle */
        .tabs { display: flex; gap: 5px; margin-top: 20px; overflow-x: auto; }
        .tab-btn { background: #333; border: none; color: white; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 11px; white-space: nowrap; flex: 1; }
        .tab-btn.active { background: var(--dorado); color: black; }
        .tab-content { display: none; padding-top: 15px; }
        .tab-content.active { display: block; }

        .btn-accion { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
        .whatsapp { background: #25d366; color: white; }
        .eliminar { background: var(--rojo); color: white; }
    </style>
</head>
<body>

<div class="header">
    <button class="btn-add" onclick="abrirModal('modalRegistro')"><span>+</span> AÑADIR CHÓFER</button>
    <div onclick="toggleFiltro()" style="cursor:pointer; font-size: 24px;">⏳</div>
</div>

<div id="filtroArea" class="filtro-container">
    <input type="text" id="busqueda" placeholder="Buscar por nombre o teléfono..." onkeyup="filtrar()">
</div>

<div class="tabla-contenedor">
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Lic.</th>
                <th>Fondo</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="lista-choferes"></tbody>
    </table>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); margin-top:0;">Nuevo Chófer</h2>
        <div class="form-group">
            <label>Foto del Chófer</label>
            <input type="file" id="reg-foto-chofer" accept="image/*">
        </div>
        <div class="form-group"><label>Nombre</label><input type="text" id="reg-nom"></div>
        <div class="form-group"><label>Apellido</label><input type="text" id="reg-ape"></div>
        <div class="form-group"><label>Teléfono</label><input type="tel" id="reg-tel"></div>
        
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <label><input type="checkbox" id="reg-lic"> Lic. Operativa</label>
            <label><input type="checkbox" id="reg-libre"> Libre de Fondo</label>
        </div>

        <div class="form-group">
            <label>Foto del Carro</label>
            <input type="file" id="reg-foto-carro" accept="image/*">
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <label><input type="checkbox" id="reg-aire"> Aire Acond.</label>
        </div>
        <div class="form-group">
            <label>Datos del Auto (Marca, Modelo, Color)</label>
            <input type="text" id="reg-auto-info" placeholder="Ej: Hyundai Elantra Blanco">
        </div>

        <button class="btn-add" style="width:100%; justify-content:center;" onclick="guardarNuevoChofer()">GUARDAR CHÓFER</button>
        <button onclick="cerrarModal('modalRegistro')" style="width:100%; background:none; color:#888; border:none; margin-top:10px;">Cancelar</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div id="detalle-chofer" class="modal-content">
        </div>
</div>

<script src="config.js"></script>
<script>
    let choferSeleccionado = null;

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleFiltro() { 
        const f = document.getElementById('filtroArea');
        f.style.display = f.style.display === 'block' ? 'none' : 'block';
    }

    // --- CARGAR LISTA ---
    async function cargarChoferes() {
        const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre');
        const lista = document.getElementById('lista-choferes');
        lista.innerHTML = "";
        data.forEach(c => {
            lista.innerHTML += `
                <tr>
                    <td><b>${c.nombre}</b></td>
                    <td>${c.telefono}</td>
                    <td>${c.tiene_lice ? '✅' : '❌'}</td>
                    <td style="color:var(--dorado)">$${c.fondo_actu}</td>
                    <td class="puntos" onclick="verChofer('${c.id}')">⋮</td>
                </tr>
            `;
        });
    }

    // --- SUBIR FOTO ---
    async function subirImagen(file, carpeta, nombre) {
        if(!file) return null;
        const ext = file.name.split('.').pop();
        const path = `${carpeta}/${nombre}.${ext}`;
        const { data, error } = await supabaseClient.storage.from('imagenes_sistema').upload(path, file, { upsert: true });
        if(error) return null;
        const { data: urlData } = supabaseClient.storage.from('imagenes_sistema').getPublicUrl(path);
        return urlData.publicUrl;
    }

    // --- GUARDAR NUEVO ---
    async function guardarNuevoChofer() {
        const tel = document.getElementById('reg-tel').value;
        const nom = document.getElementById('reg-nom').value;
        if(!tel || !nom) return alert("Nombre y Teléfono son obligatorios");

        const fotoChofer = await subirImagen(document.getElementById('reg-foto-chofer').files[0], 'choferes', tel);
        const fotoCarro = await subirImagen(document.getElementById('reg-foto-carro').files[0], 'carros', tel);

        const { error } = await supabaseClient.from('choferes').insert([{
            nombre: nom,
            apellido: document.getElementById('reg-ape').value,
            telefono: tel,
            foto_chofer: fotoChofer,
            foto_carro: fotoCarro,
            tiene_lice: document.getElementById('reg-lic').checked,
            re_de_fon: document.getElementById('reg-libre').checked,
            tiene_aire: document.getElementById('reg-aire').checked,
            auto_desc: document.getElementById('reg-auto-info').value, // Asegúrate de tener esta columna o cámbiala
            fondo_actu: 0
        }]);

        if(!error) {
            alert("Chófer añadido correctamente");
            location.reload();
        } else {
            alert("Error: " + error.message);
        }
    }

    // --- VER DETALLE ---
    async function verChofer(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferSeleccionado = c;
        
        const content = document.getElementById('detalle-chofer');
        content.innerHTML = `
            <img src="${c.foto_chofer || 'https://via.placeholder.com/300'}" class="foto-grande">
            <h2 style="margin:0;">${c.nombre} ${c.apellido}</h2>
            <p style="color:var(--dorado); margin:5px 0;">● Trabajar sin créditos: ${c.re_de_fon ? 'SÍ' : 'NO'}</p>
            
            <div class="stats-grid">
                <div class="stat-card"><span>FONDO ACTUAL</span><b>$${c.fondo_actu}</b></div>
                <div class="stat-card"><span>VIAJES HOY</span><b>0</b></div>
                <div class="stat-card"><span>VIAJES MES</span><b>0</b></div>
                <div class="stat-card"><span>TOTAL</span><b>0</b></div>
            </div>

            <button class="btn-accion" style="background:var(--dorado); color:black;">FILTRAR VIAJES</button>
            <button class="btn-accion whatsapp" onclick="window.open('https://wa.me/${c.telefono}')">WHATSAPP</button>
            <button class="btn-accion eliminar" onclick="eliminarChofer('${c.id}')">ELIMINAR</button>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'info')">INFORMACIÓN</button>
                <button class="tab-btn" onclick="switchTab(event, 'auto')">AUTO</button>
                <button class="tab-btn" onclick="switchTab(event, 'fondo')">FONDO</button>
            </div>

            <div id="info" class="tab-content active">
                <p><b>Teléfono:</b> ${c.telefono}</p>
                <p><b>Nombre completo:</b> ${c.nombre} ${c.apellido}</p>
            </div>

            <div id="auto" class="tab-content">
                <img src="${c.foto_carro || 'https://via.placeholder.com/300'}" style="width:100%; border-radius:10px;">
                <p><b>Descripción:</b> ${c.auto_desc || 'No especificada'}</p>
                <p><b>Aire:</b> ${c.tiene_aire ? 'Sí' : 'No'} | <b>Lic:</b> ${c.tiene_lice ? 'Sí' : 'No'}</p>
            </div>

            <div id="fondo" class="tab-content">
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button class="tab-btn" style="background:var(--verde)" onclick="modalMovimiento('agregar')">AGREGAR</button>
                    <button class="tab-btn" style="background:var(--rojo)" onclick="modalMovimiento('retirar')">RETIRAR</button>
                </div>
                <button class="btn-accion" style="font-size:10px;" onclick="rectificarFondos('${c.id}')">RECTIFICAR FONDO</button>
                <div style="font-size:11px; color:#888;">Historial reciente:</div>
                <div id="historial-lista">Cargando...</div>
            </div>

            <button onclick="cerrarModal('modalVer')" style="width:100%; background:none; color:#888; border:none; margin-top:20px;">Cerrar</button>
        `;
        abrirModal('modalVer');
        cargarHistorial(c.id);
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    async function cargarHistorial(choferId) {
        const { data } = await supabaseClient.from('historial_fondos').select('*').eq('chofer_id', choferId).order('fecha', {ascending:false});
        const hLista = document.getElementById('historial-lista');
        hLista.innerHTML = data.length ? "" : "Sin movimientos";
        data.forEach(h => {
            hLista.innerHTML += `<div style="border-bottom:1px solid #333; padding:5px 0;">
                <span style="color:var(--dorado)">${h.metodo}</span>: $${h.saldo} | <small>${h.fecha.split('T')[0]}</small><br>
                <small>Ant: $${h.fondo_anterior} | Act: $${h.activo}</small>
            </div>`;
        });
    }

    async function modalMovimiento(tipo) {
        const cant = prompt(`Cantidad a ${tipo}:`);
        if(!cant || isNaN(cant)) return;
        
        const metodo = tipo === 'agregar' ? prompt("Método (Efectivo/Transferencia):", "Efectivo") : "Retiro";
        const gestor = localStorage.getItem('usuario_nombre') || "Admin"; // Usa el nombre guardado al login
        
        const nuevoFondo = tipo === 'agregar' ? parseFloat(choferSeleccionado.fondo_actu) + parseFloat(cant) : parseFloat(choferSeleccionado.fondo_actu) - parseFloat(cant);

        // 1. Guardar en Historial
        await supabaseClient.from('historial_fondos').insert([{
            chofer_id: choferSeleccionado.id,
            usuario: gestor,
            metodo: metodo,
            saldo: parseFloat(cant),
            fondo_anterior: choferSeleccionado.fondo_actu,
            activo: nuevoFondo
        }]);

        // 2. Actualizar Chofer
        await supabaseClient.from('choferes').update({ fondo_actu: nuevoFondo }).eq('id', choferSeleccionado.id);
        
        alert("Operación realizada");
        verChofer(choferSeleccionado.id);
    }

    async function eliminarChofer(id) {
        if(confirm("¿Seguro que quieres eliminar este chófer? Se borrará todo su historial.")){
            await supabaseClient.from('choferes').delete().eq('id', id);
            location.reload();
        }
    }

    function filtrar() {
        const text = document.getElementById('busqueda').value.toLowerCase();
        const rows = document.querySelectorAll('#lista-choferes tr');
        rows.forEach(r => {
            r.style.display = r.innerText.toLowerCase().includes(text) ? '' : 'none';
        });
    }

    cargarChoferes();
</script>
</body>
</html>

<script>
    // 1. Corregido: Función para abrir formulario de añadir nuevo chófer
    async function abrirFormularioNuevo() {
        document.getElementById('contenidoModal').innerHTML = `
            <h2 style="font-family:'Playfair Display'; color:var(--dorado);">NUEVO CHÓFER</h2>
            <label>Foto Chófer</label>
            <input type="file" id="new-foto-chofer" accept="image/*">
            <label>Nombre</label>
            <input type="text" id="new-nombre">
            <label>Apellido</label>
            <input type="text" id="new-apellido">
            <label>Teléfono</label>
            <input type="tel" id="new-telefono">
            <label>Fondo Inicial</label>
            <input type="number" id="new-fondo" value="0">
            
            <div style="margin:15px 0;">
                <label style="display:block; margin-bottom:10px;">
                    <input type="checkbox" id="new-licencia"> TIENE LICENCIA OPERATIVA
                </label>
                <label style="display:block; margin-bottom:10px;">
                    <input type="checkbox" id="new-aire"> TIENE AIRE ACONDICIONADO
                </label>
                <label style="display:block;">
                    <input type="checkbox" id="new-libre"> TRABAJAR SIN FONDO (AUTORIZADO)
                </label>
            </div>

            <label>Foto Carro</label>
            <input type="file" id="new-foto-carro" accept="image/*">
            <label>Marca Carro</label>
            <input type="text" id="new-marca">
            <label>Modelo Carro</label>
            <input type="text" id="new-modelo">
            <label>Color Carro</label>
            <input type="text" id="new-color">

            <button class="btn-action btn-gold" onclick="guardarNuevoChofer()">GUARDAR CHÓFER</button>
        `;
        document.getElementById('modalDetalle').style.display = 'block';
    }

    // 2. Corregido: Ajuste de tarjeta para móviles (Responsive)
    function renderizarGrid(lista) {
        const contenedor = document.getElementById('lista-choferes');
        contenedor.innerHTML = "";
        lista.forEach(c => {
            contenedor.innerHTML += `
                <div class="card-chofer" onclick="verDetalle('${c.id}')" style="padding: 12px; margin-bottom: 10px;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${c.foto_chofer || ''}" style="width:55px; height:55px; border-radius:50%; object-fit:cover; border:2px solid var(--dorado);">
                        <div style="flex:1;">
                            <h3 style="margin:0; font-size:14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.nombre} ${c.apellido}</h3>
                            <p style="margin:2px 0; font-size:12px; color:#aaa;">📞 ${c.telefono}</p>
                            <span style="font-size:10px; color:var(--dorado); background:rgba(212,175,55,0.1); padding:2px 6px; border-radius:4px;">
                                ${c.tiene_licencia_operativa ? 'CON LICENCIA' : 'SIN LICENCIA'}
                            </span>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:14px; font-weight:bold; color:var(--dorado);">$${c.fondo_actual.toFixed(2)}</div>
                        </div>
                    </div>
                </div>`;
        });
    }

    // 3, 4 y 5. Corregido: Detalle con check de Moto/Auto, conteo de viajes y función Editar
    async function verDetalle(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferActual = c;
        
        // 4. Lógica de conteo de viajes (Simulada para el ejemplo, conectar con tabla 'viajes')
        const vHoy = 0; const vMes = 0; const vTotal = 0; 

        document.getElementById('contenidoModal').innerHTML = `
            <img src="${c.foto_chofer}" style="width:120px; height:120px; border-radius:50%; display:block; margin:auto; object-fit:cover; border:3px solid var(--dorado);">
            
            <div style="text-align:center; margin:15px 0;">
                <h3 style="margin:0; font-size:18px;">${c.nombre} ${c.apellido}</h3>
                
                <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px; align-items:center; font-size:12px;">
                    <label><input type="checkbox" ${c.libre_de_fondo ? 'checked' : ''} onchange="updateField('${c.id}', 'libre_de_fondo', this.checked)"> TRABAJAR CON FONDO (AUTORIZADO)</label>
                    <label><input type="checkbox" ${c.tipo_vehiculo === 'Auto' ? 'checked' : ''} onchange="updateField('${c.id}', 'tipo_vehiculo', this.checked ? 'Auto' : 'Moto')"> VEHÍCULO: AUTO</label>
                    <label><input type="checkbox" ${c.tipo_vehiculo === 'Moto' ? 'checked' : ''} onchange="updateField('${c.id}', 'tipo_vehiculo', this.checked ? 'Moto' : 'Auto')"> VEHÍCULO: MOTO</label>
                </div>

                <div style="display:flex; justify-content:space-around; margin-top:15px; background:#000; padding:10px; border-radius:8px; border:1px solid #333;">
                    <div style="text-align:center;"><div style="color:var(--dorado); font-weight:bold;">${vHoy}</div><div style="font-size:9px;">VIAJES HOY</div></div>
                    <div style="text-align:center;"><div style="color:var(--dorado); font-weight:bold;">${vMes}</div><div style="font-size:9px;">VIAJES MES</div></div>
                    <div style="text-align:center;"><div style="color:var(--dorado); font-weight:bold;">${vTotal}</div><div style="font-size:9px;">TOTAL</div></div>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-action btn-gold" onclick="abrirEditorChofer()">EDITAR DATOS</button>
                <a href="https://wa.me/${c.telefono}" target="_blank" class="btn-action" style="background:#25d366; color:white; text-decoration:none; text-align:center; line-height:1.2;">WHATSAPP</a>
            </div>

            <div class="sub-menu" style="margin-top:15px; display:flex; gap:5px;">
                <button class="btn-toggle active" onclick="verSeccion('info')">INFO</button>
                <button class="btn-toggle" onclick="verSeccion('auto')">AUTO</button>
                <button class="btn-toggle" onclick="verSeccion('fondo')">FONDO</button>
            </div>
            
            <div id="sec-info" class="sec" style="padding-top:10px;">
                <p style="font-size:13px;"><b>Teléfono:</b> ${c.telefono}</p>
                <p style="font-size:13px;"><b>Fondo Actual:</b> $${c.fondo_actual}</p>
            </div>
            `;
        document.getElementById('modalDetalle').style.display = 'block';
    }

    // 5. Función para editar todos los datos
    async function abrirEditorChofer() {
        const c = choferActual;
        document.getElementById('contenidoModal').innerHTML = `
            <h3>EDITAR CHÓFER</h3>
            <label>Nombre</label>
            <input type="text" id="edit-nombre" value="${c.nombre}">
            <label>Apellido</label>
            <input type="text" id="edit-apellido" value="${c.apellido}">
            <label>Teléfono</label>
            <input type="tel" id="edit-telefono" value="${c.telefono}">
            <label>Marca Carro</label>
            <input type="text" id="edit-marca" value="${c.marca_carro || ''}">
            <label>Modelo Carro</label>
            <input type="text" id="edit-modelo" value="${c.modelo_carro || ''}">
            
            <div style="margin:15px 0;">
                <label><input type="checkbox" id="edit-licencia" ${c.tiene_licencia_operativa ? 'checked' : ''}> LICENCIA OPERATIVA</label><br><br>
                <label><input type="checkbox" id="edit-aire" ${c.tiene_aire_acondicionado ? 'checked' : ''}> AIRE ACONDICIONADO</label>
            </div>

            <button class="btn-action btn-gold" onclick="actualizarDatosChofer('${c.id}')">GUARDAR CAMBIOS</button>
            <button class="btn-action btn-red" onclick="verDetalle('${c.id}')">CANCELAR</button>
        `;
    }

    async function updateField(id, campo, valor) {
        await supabaseClient.from('choferes').update({ [campo]: valor }).eq('id', id);
    }
</script>

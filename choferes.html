<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choferes - RF TransGestión</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --dorado:#d4af37; --oscuro:#121212; --gris:#1e1e1e; }
body { margin:0; font-family:'Montserrat',sans-serif; background:var(--oscuro); color:white; padding-bottom:50px; }
.header-nav-universal { display:flex; align-items:center; gap:15px; padding:15px; background:var(--oscuro); border-bottom:1px solid var(--dorado); margin-bottom:20px; }
.openbtn { font-size:25px; cursor:pointer; background:none; border:none; color:var(--dorado); }
.logo-txt-universal { font-family:'Playfair Display', serif; font-size:20px; color:white; }
.contenedor-principal { padding:0 15px; }
h2 { color:var(--dorado); text-align:center; text-transform:uppercase; margin-bottom:15px; }
.tabla-contenedor { overflow-x:auto; background:var(--gris); border-radius:15px; padding:10px; box-shadow:0 4px 15px rgba(0,0,0,0.5); }
table { width:100%; border-collapse:collapse; min-width:700px; }
th, td { padding:12px; font-size:13px; border-bottom:1px solid #222; text-align:left; }
th { color:var(--dorado); text-transform:uppercase; font-size:12px; }
.estado-bloqueado { color:#ff4444; font-weight:bold; }
.estado-libre { color:#44ff44; font-weight:bold; }
.btn-action { background:var(--dorado); border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; color:black; transition:0.3s; }
.btn-action:hover { opacity:0.9; }
.busqueda { display:flex; gap:10px; margin-bottom:15px; }
.busqueda input { flex:1; padding:8px; border-radius:6px; border:1px solid #333; background:#000; color:white; }
.embudo { font-size:18px; cursor:pointer; background:#333; border:none; color:white; padding:8px 12px; border-radius:6px; }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); overflow-y:auto; padding:20px; z-index:4000; }
.modal-content { max-width:800px; margin:auto; background:#1e1e1e; border-radius:12px; padding:20px; }
.modal img { max-width:100%; border-radius:10px; display:block; margin-bottom:10px; }
.row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.row button { flex:1; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="contenedor-principal">
    <h2>Choferes</h2>

    <div class="row">
        <button class="btn-action" onclick="abrirModalAgregar()">➕ Añadir Chofer</button>
        <button class="embudo" onclick="toggleFiltro()">🔽 Filtrar</button>
    </div>

    <div id="filtro" class="hidden row">
        <input type="text" id="filtro-nombre" placeholder="Filtrar por nombre">
        <input type="text" id="filtro-tel" placeholder="Filtrar por teléfono">
        <button class="btn-action" onclick="aplicarFiltro()">Aplicar</button>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Lic Operativa</th>
                    <th>Fondo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-choferes">
                <tr><td colspan="5" style="text-align:center; padding:20px;">Cargando choferes...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL VER / AGREGAR CHOFER -->
<div id="modalChofer" class="modal">
    <div class="modal-content">
        <button onclick="cerrarModal()" style="background:red;color:white;border:none;padding:10px;width:100%;border-radius:8px;margin-bottom:15px;">Cerrar</button>
        <div id="modal-body"></div>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
let choferes = [];
let choferSeleccionado = null;

async function cargarChoferes() {
    const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre', {ascending:true});
    if(error) return alert(error.message);
    choferes = data;
    mostrarTabla(data);
}
function mostrarTabla(data) {
    const tbody = document.getElementById('tabla-choferes');
    if(data.length===0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay choferes</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(c=>{
        const estado = (c.fondo_actual<150 && !c.libre_de_fondo)?'Bloqueado':'Libre';
        const clase = (estado==='Bloqueado')?'estado-bloqueado':'estado-libre';
        return `<tr>
            <td>${c.nombre} ${c.apellido||''}</td>
            <td>${c.telefono}</td>
            <td>${c.tiene_licencia_operativa?'Sí':'No'}</td>
            <td>$${c.fondo_actual}</td>
            <td>
                <button onclick="verChofer(${c.id})">Ver</button>
                <button onclick="eliminarChofer(${c.id})">Eliminar</button>
            </td>
        </tr>`;
    }).join('');
}

function toggleFiltro() {
    document.getElementById('filtro').classList.toggle('hidden');
}

function aplicarFiltro() {
    const nombre = document.getElementById('filtro-nombre').value.toLowerCase();
    const tel = document.getElementById('filtro-tel').value;
    const filtrados = choferes.filter(c=>c.nombre.toLowerCase().includes(nombre) && c.telefono.includes(tel));
    mostrarTabla(filtrados);
}

function cerrarModal() {
    document.getElementById('modalChofer').style.display='none';
    document.getElementById('modal-body').innerHTML='';
}

function abrirModalAgregar() {
    choferSeleccionado = null;
    const html = `
        <h3>Agregar Nuevo Chofer</h3>
        <div class="row">
            <label>Foto del chofer</label>
            <input type="file" id="foto-chofer" accept="image/*">
        </div>
        <div class="row">
            <input type="text" id="nombre" placeholder="Nombre">
            <input type="text" id="apellido" placeholder="Apellido">
        </div>
        <div class="row">
            <input type="text" id="telefono" placeholder="Teléfono">
        </div>
        <div class="row">
            <label><input type="checkbox" id="lic_operativa"> Lic Operativa</label>
            <label><input type="checkbox" id="libre_fondo"> Libre de fondo</label>
        </div>
        <div class="row">
            <input type="number" id="fondo" placeholder="Fondo inicial">
        </div>
        <div class="row">
            <label>Foto del auto</label>
            <input type="file" id="foto-auto" accept="image/*">
        </div>
        <div class="row">
            <label><input type="checkbox" id="aire"> Aire acondicionado</label>
        </div>
        <button class="btn-action" onclick="guardarChofer()">Guardar</button>
    `;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modalChofer').style.display='block';
}

async function guardarChofer() {
    const nombre = document.getElementById('nombre').value;
    const apellido = document.getElementById('apellido').value;
    const telefono = document.getElementById('telefono').value;
    const lic = document.getElementById('lic_operativa').checked;
    const libreFondo = document.getElementById('libre_fondo').checked;
    const fondo = parseFloat(document.getElementById('fondo').value)||0;

    const fotoChofer = document.getElementById('foto-chofer').files[0];
    const fotoAuto = document.getElementById('foto-auto').files[0];

    // Subir fotos a Supabase Storage y obtener URL
    let urlChofer='', urlAuto='';
    if(fotoChofer) {
        const { data, error } = await supabaseClient.storage.from('choferes').upload(`fotos/${telefono}-${Date.now()}`, fotoChofer);
        if(!error) urlChofer = supabaseClient.storage.from('choferes').getPublicUrl(data.path).publicUrl;
    }
    if(fotoAuto) {
        const { data, error } = await supabaseClient.storage.from('choferes').upload(`autos/${telefono}-${Date.now()}`, fotoAuto);
        if(!error) urlAuto = supabaseClient.storage.from('choferes').getPublicUrl(data.path).publicUrl;
    }

    const { error } = await supabaseClient.from('choferes').insert([{
        nombre, apellido, telefono, tiene_licencia_operativa:lic, libre_de_fondo:libreFondo,
        fondo_actual:fondo, foto:urlChofer, foto_auto:urlAuto, aire:document.getElementById('aire').checked
    }]);
    if(error) return alert(error.message);
    cerrarModal();
    cargarChoferes();
}

async function eliminarChofer(id) {
    if(!confirm('¿Eliminar este chofer?')) return;
    await supabaseClient.from('choferes').delete().eq('id', id);
    cargarChoferes();
}

async function verChofer(id) {
    choferSeleccionado = choferes.find(c=>c.id===id);
    if(!choferSeleccionado) return;

    let html = `<h3>Chofer: ${choferSeleccionado.nombre} ${choferSeleccionado.apellido||''}</h3>
        <img src="${choferSeleccionado.foto||''}" alt="Foto Chofer">
        <div>Trabajar sin créditos: ${choferSeleccionado.libre_de_fondo?'Sí':'No'}</div>
        <div>Grupo: ${choferSeleccionado.grupo||'N/A'}</div>
        <div>Fondo actual: $${choferSeleccionado.fondo_actual}</div>
        <div>Viajes de hoy: 0</div>
        <div>Viajes del mes: 0</div>
        <div>Viajes total: 0</div>
        <div class="row">
            <button class="btn-action" onclick="alert('Filtrar viajes')">Filtrar viajes</button>
            <button class="btn-action" onclick="window.open('https://wa.me/${choferSeleccionado.telefono}','_blank')">WhatsApp</button>
            <button class="btn-action" onclick="eliminarChofer(${choferSeleccionado.id})">Eliminar</button>
        </div>`;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modalChofer').style.display='block';
}

cargarChoferes();
</script>
</body>
</html>

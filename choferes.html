<script>
    let choferSel = null;
    const userActivo = JSON.parse(localStorage.getItem('usuario_activo')) || {nombre: 'Admin'};

    // CARGAR LISTA INICIAL
    async function cargarChoferes() {
        const { data } = await supabaseClient.from('choferes').select('*').order('nombre');
        const tbody = document.getElementById('lista-choferes');
        tbody.innerHTML = data.map(c => `
            <tr onclick="verChofer('${c.id}')">
                <td><b>${c.nombre} ${c.apellido}</b></td>
                <td>${c.telefono}</td>
                <td>${c.tiene_licencia_operativa ? '✅' : '❌'}</td>
                <td style="color:var(--dorado); font-weight:bold;">$${c.fondo_actual}</td>
            </tr>
        `).join('');
    }

    // VER DETALLE (Punto 2: Contadores recuperados)
    async function verChofer(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferSel = c;

        const hoy = new Date().toISOString().split('T')[0];
        const mesIni = hoy.substring(0, 7) + "-01";

        // Consultas de conteo reales
        const { count: vH } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', id).gte('created_at', hoy);
        const { count: vM } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', id).gte('created_at', mesIni);
        const { count: vT } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', id);

        document.getElementById('detalle-chofer-content').innerHTML = `
            <img src="${c.foto_chofer || ''}" class="foto-detalle">
            <h2 style="margin:0;">${c.nombre} ${c.apellido}</h2>
            <p style="color:var(--dorado); font-size:11px; margin-bottom:15px;">● TRABAJAR SIN CRÉDITOS: ${c.libre_de_fondo ? 'SÍ' : 'NO'}</p>

            <div class="stats-grid">
                <div class="stat-item"><span>Fondo</span><b>$${c.fondo_actual}</b></div>
                <div class="stat-item"><span>Hoy</span><b>${vH || 0}</b></div>
                <div class="stat-item"><span>Mes</span><b>${vM || 0}</b></div>
                <div class="stat-item"><span>Total</span><b>${vT || 0}</b></div>
            </div>

            <button class="btn-full btn-verde" onclick="window.open('https://wa.me/${c.telefono}')">WHATSAPP</button>
            
            <div style="display:flex; gap:10px;">
                <button class="btn-full btn-azul" onclick="abrirEditar()">EDITAR</button>
                <button class="btn-full btn-rojo" onclick="confirmarEliminar('${c.id}')">ELIMINAR</button>
            </div>

            <div class="tabs-nav">
                <button class="tab-btn active" onclick="showTab('info')">Info</button>
                <button class="tab-btn" onclick="showTab('auto')">Auto</button>
                <button class="tab-btn" onclick="showTab('fondo')">Fondo</button>
            </div>

            <div id="tab-info" class="tab-pane active">
                <div style="padding:10px; background:#000; border-radius:10px;">
                    <p><b>Teléfono:</b> ${c.telefono}</p>
                    <p><b>Registro:</b> ${new Date(c.created_at).toLocaleDateString()}</p>
                </div>
            </div>

            <div id="tab-auto" class="tab-pane">
                <img src="${c.foto_carro || ''}" style="width:100%; border-radius:10px; margin-bottom:10px;">
                <p><b>Vehículo:</b> ${c.marca_carro} ${c.modelo_carro} (${c.color_carro})</p>
                <p><b>Aire:</b> ${c.tiene_aire_acondicionado ? 'SÍ' : 'NO'} | <b>Licencia:</b> ${c.tiene_licencia_operativa ? 'SÍ' : 'NO'}</p>
            </div>

            <div id="tab-fondo" class="tab-pane">
                <div style="display:flex; gap:5px;"><button class="btn-verde" style="flex:1; border:none; padding:12px; border-radius:8px;" onclick="abrirOp('add')">AGREGAR</button><button class="btn-rojo" style="flex:1; border:none; padding:12px; border-radius:8px;" onclick="abrirOp('sub')">RETIRAR</button></div>
                <div id="op-box" style="display:none; margin-top:15px; background:#000; padding:15px; border-radius:10px; border:1px solid var(--dorado);">
                    <select id="op-metodo" onchange="checkMetodo(this.value)" style="width:100%; padding:12px; background:#111; color:#fff; border:1px solid #333; margin-bottom:10px;"><option value="Efectivo">Efectivo</option><option value="Transferencia">Transferencia</option></select>
                    <div id="box-tarjeta" style="display:none; margin-bottom:10px;"><select id="op-tarjeta" style="width:100%; padding:12px; background:#111; color:#fff; border:1px solid #333;"></select></div>
                    <input type="number" id="op-cant" placeholder="Cantidad $" style="width:100%; padding:12px; background:#111; color:#fff; border:1px solid #333; border-radius:8px;">
                    <button class="btn-full btn-verde" style="margin-top:15px" onclick="procesarFondo()">PROCESAR</button>
                </div>
                <div class="historial-container"><table class="tabla-fondos"><thead><tr><th>USR</th><th>MET</th><th>SALDO</th><th>FONDO</th><th>ACTIVO</th></tr></thead><tbody id="hist-body"></tbody></table></div>
            </div>
            <button class="btn-full btn-gris" onclick="cerrarModal('modalVer')" style="margin-top:20px">CERRAR</button>
        `;
        abrirModal('modalVer');
        cargarHistorial(id);
        cargarTarjetas();
    }

    // PUNTO 1: EDICIÓN COMPLETA
    function abrirEditar() {
        const c = choferSel;
        document.getElementById('form-editar').innerHTML = `
            <div class="form-group"><label>Nombre</label><input type="text" id="edit-nom" value="${c.nombre}"></div>
            <div class="form-group"><label>Apellido</label><input type="text" id="edit-ape" value="${c.apellido}"></div>
            <div class="form-group"><label>Teléfono</label><input type="tel" id="edit-tel" value="${c.telefono}"></div>
            <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
            <div class="form-group"><label>Marca Carro</label><input type="text" id="edit-marca" value="${c.marca_carro}"></div>
            <div class="form-group"><label>Modelo Carro</label><input type="text" id="edit-modelo" value="${c.modelo_carro}"></div>
            <div class="form-group"><label>Color Carro</label><input type="text" id="edit-color" value="${c.color_carro}"></div>
            <div style="background:#000; padding:15px; border-radius:10px; margin-top:10px;">
                <label style="display:block; margin-bottom:10px;"><input type="checkbox" id="edit-lic" ${c.tiene_licencia_operativa ? 'checked' : ''}> Licencia Operativa</label>
                <label style="display:block; margin-bottom:10px;"><input type="checkbox" id="edit-aire" ${c.tiene_aire_acondicionado ? 'checked' : ''}> Aire Acondicionado</label>
                <label style="display:block; color:var(--dorado)"><input type="checkbox" id="edit-libre" ${c.libre_de_fondo ? 'checked' : ''}> TRABAJAR SIN CRÉDITOS</label>
            </div>
        `;
        abrirModal('modalEditar');
    }

    async function actualizarDatosChofer() {
        const upd = {
            nombre: document.getElementById('edit-nom').value,
            apellido: document.getElementById('edit-ape').value,
            telefono: document.getElementById('edit-tel').value,
            marca_carro: document.getElementById('edit-marca').value,
            modelo_carro: document.getElementById('edit-modelo').value,
            color_carro: document.getElementById('edit-color').value,
            tiene_licencia_operativa: document.getElementById('edit-lic').checked,
            tiene_aire_acondicionado: document.getElementById('edit-aire').checked,
            libre_de_fondo: document.getElementById('edit-libre').checked
        };
        const { error } = await supabaseClient.from('choferes').update(upd).eq('id', choferSel.id);
        if(!error) { 
            alert("✅ Datos actualizados correctamente"); 
            cerrarModal('modalEditar');
            verChofer(choferSel.id); // Refresca la vista
            cargarChoferes(); // Refresca la lista de atrás
        }
    }

    // PUNTO 3: ELIMINAR REAL
    async function confirmarEliminar(id) {
        if(confirm("⚠️ ¿Estás seguro de eliminar a este chófer? Esta acción no se puede deshacer.")) {
            const { error } = await supabaseClient.from('choferes').delete().eq('id', id);
            if(!error) {
                alert("🗑️ Chófer eliminado");
                location.reload();
            } else {
                alert("Error al eliminar: " + error.message);
            }
        }
    }

    // (Otras funciones de apoyo se mantienen...)
</script>

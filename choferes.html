<script>
        let currentChofer = null;
        let modoFondo = 'agregar';

        // ... (cargarChoferes, verChofer, etc., se mantienen igual) ...

        // --- CÓDIGO ACTUALIZADO PARA MOVIMIENTOS DE FONDO ---
        async function procesarFondo() {
            const cant = parseFloat(document.getElementById('f_cantidad').value);
            if (!cant || cant <= 0) return alert("Ingrese una cantidad válida");

            const variacion = modoFondo === 'agregar' ? cant : -cant;
            const nuevoSaldo = currentChofer.fondo_actual + variacion;

            // 1. Actualizar saldo del chofer
            const { error: errChofer } = await supabaseClient
                .from('choferes')
                .update({ fondo_actual: nuevoSaldo })
                .eq('id', currentChofer.id);

            if (!errChofer) {
                // 2. Insertar registro en movimientos_fondo
                await supabaseClient.from('movimientos_fondo').insert([{
                    chofer_tel: currentChofer.telefono,
                    usuario: "Administrador", // Puedes cambiarlo por el usuario logueado
                    metodo: modoFondo === 'agregar' ? "Recarga" : "Retiro",
                    saldo_movedo: cant,
                    fondo_anterior: currentChofer.fondo_actual,
                    activo_nuevo: nuevoSaldo
                }]);

                alert("✅ Operación realizada con éxito.");
                location.reload(); 
            } else {
                alert("Error al actualizar fondo: " + errChofer.message);
            }
        }
        
        // ... (resto de funciones como eliminarChofer se mantienen igual) ...
    </script>

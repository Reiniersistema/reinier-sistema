<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #28a745; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 10px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        /* Ajuste de Tabla para Móvil */
        .tabla-contenedor { background: var(--gris); border-radius: 10px; overflow: hidden; width: 100%; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; } /* Fixed ayuda a que no se desborde */
        th { text-align: left; padding: 10px 5px; color: var(--dorado); font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 12px 5px; border-bottom: 1px solid #222; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Anchos específicos para que quepa todo */
        .col-nom { width: 35%; }
        .col-tel { width: 30%; }
        .col-lic { width: 10%; text-align: center; }
        .col-fon { width: 20%; text-align: right; color: var(--dorado); }
        .col-opc { width: 5%; text-align: center; }

        /* Modales y otros estilos se mantienen similares pero optimizados */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { background: var(--gris); margin: 5% auto; padding: 15px; width: 92%; border-radius: 15px; border: 1px solid var(--dorado); box-sizing: border-box; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; color: var(--dorado); font-size: 10px; }
        .form-group input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        
        .foto-grande { width: 100%; height: 200px; border-radius: 12px; object-fit: cover; border: 1px solid var(--dorado); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .stat-card { background: #000; padding: 8px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .stat-card span { display: block; font-size: 9px; color: var(--dorado); }
        
        .tab-btn { background: #333; border: none; color: white; padding: 8px; border-radius: 5px; font-size: 10px; flex: 1; }
        .tab-btn.active { background: var(--dorado); color: black; }
        .btn-accion { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <button class="btn-add" onclick="abrirModal('modalRegistro')">+ AÑADIR CHÓFER</button>
    <div onclick="toggleFiltro()" style="cursor:pointer; font-size: 22px;">⏳</div>
</div>

<div id="filtroArea" style="display:none; margin-bottom:15px;">
    <input type="text" id="busqueda" placeholder="Buscar..." onkeyup="filtrar()" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--dorado); background:var(--gris); color:white;">
</div>

<div class="tabla-contenedor">
    <table>
        <thead>
            <tr>
                <th class="col-nom">Nombre</th>
                <th class="col-tel">Tel</th>
                <th class="col-lic">L.</th>
                <th class="col-fon">Fondo</th>
                <th class="col-opc"></th>
            </tr>
        </thead>
        <tbody id="lista-choferes"></tbody>
    </table>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); margin:0 0 15px 0; font-size:18px;">Nuevo Chófer</h2>
        <div class="form-group"><label>Foto Chófer</label><input type="file" id="reg-foto-chofer"></div>
        <div class="form-group"><input type="text" id="reg-nom" placeholder="Nombre"></div>
        <div class="form-group"><input type="text" id="reg-ape" placeholder="Apellido"></div>
        <div class="form-group"><input type="tel" id="reg-tel" placeholder="Teléfono"></div>
        <div style="font-size:12px; margin-bottom:10px;">
            <label><input type="checkbox" id="reg-lic"> Licencia</label> &nbsp;
            <label><input type="checkbox" id="reg-libre"> Libre Fondo</label>
        </div>
        <div class="form-group"><label>Foto Carro</label><input type="file" id="reg-foto-carro"></div>
        <div class="form-group"><input type="text" id="reg-marca" placeholder="Marca Auto"></div>
        <button class="btn-add" style="width:100%" onclick="guardarNuevoChofer()">GUARDAR</button>
        <button onclick="cerrarModal('modalRegistro')" style="width:100%; background:none; color:#888; border:none; margin-top:10px;">Cerrar</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div id="detalle-chofer" class="modal-content"></div>
</div>

<script src="config.js"></script>
<script>
    let choferSeleccionado = null;

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleFiltro() { 
        const f = document.getElementById('filtroArea');
        f.style.display = f.style.display === 'none' ? 'block' : 'none';
    }

    async function cargarChoferes() {
        const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre');
        const lista = document.getElementById('lista-choferes');
        lista.innerHTML = "";
        data.forEach(c => {
            lista.innerHTML += `
                <tr>
                    <td class="col-nom"><b>${c.nombre}</b></td>
                    <td class="col-tel">${c.telefono}</td>
                    <td class="col-lic">${c.tiene_licencia_operativa ? '✅' : '❌'}</td>
                    <td class="col-fon">$${c.fondo_actual}</td>
                    <td class="col-opc" onclick="verChofer('${c.id}')" style="color:var(--dorado)">⋮</td>
                </tr>
            `;
        });
    }

    async function verChofer(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferSeleccionado = c;
        const content = document.getElementById('detalle-chofer');
        content.innerHTML = `
            <img src="${c.foto_chofer || ''}" class="foto-grande">
            <h2 style="margin:10px 0 5px 0;">${c.nombre} ${c.apellido}</h2>
            <div class="stats-grid">
                <div class="stat-card"><span>FONDO</span><b>$${c.fondo_actual}</b></div>
                <div class="stat-card"><span>LIBRE</span><b>${c.libre_de_fondo ? 'SÍ' : 'NO'}</b></div>
            </div>
            <button class="btn-accion" style="background:var(--verde); color:white;" onclick="operacionFondo('agregar')">AGREGAR FONDO</button>
            <button class="btn-accion" style="background:var(--rojo); color:white;" onclick="operacionFondo('retirar')">RETIRAR FONDO</button>
            <button onclick="cerrarModal('modalVer')" style="width:100%; background:none; color:#888; border:none; margin-top:10px;">Cerrar</button>
        `;
        abrirModal('modalVer');
    }

    // --- FUNCIÓN DE FONDO CORREGIDA ---
    async function operacionFondo(tipo) {
        const cantidad = prompt(`Ingrese cantidad a ${tipo}:`);
        if (!cantidad || isNaN(cantidad)) return;

        const monto = parseFloat(cantidad);
        const metodo = prompt("Método (Efectivo/Transferencia):", "Efectivo");
        const usuarioLogueado = localStorage.getItem('usuario_nombre') || "Admin"; 
        
        const fondoAnterior = parseFloat(choferSeleccionado.fondo_actual);
        const nuevoFondo = tipo === 'agregar' ? fondoAnterior + monto : fondoAnterior - monto;

        // 1. Insertar en tabla historial_fondos
        const { error: errorHistorial } = await supabaseClient.from('historial_fondos').insert([{
            chofer_id: choferSeleccionado.id,
            usuario: usuarioLogueado,
            metodo: metodo,
            saldo: monto,
            fondo_anterior: fondoAnterior,
            activo: nuevoFondo,
            fecha: new Date().toISOString()
        }]);

        if (errorHistorial) {
            alert("Error en historial: " + errorHistorial.message);
            return;
        }

        // 2. Actualizar tabla choferes
        const { error: errorChofer } = await supabaseClient.from('choferes')
            .update({ fondo_actual: nuevoFondo })
            .eq('id', choferSeleccionado.id);

        if (!errorChofer) {
            alert(`Fondo ${tipo === 'agregar' ? 'añadido' : 'retirado'} con éxito.`);
            location.reload();
        } else {
            alert("Error actualizando fondo: " + errorChofer.message);
        }
    }

    async function guardarNuevoChofer() {
        const tel = document.getElementById('reg-tel').value;
        const nom = document.getElementById('reg-nom').value;
        if(!tel || !nom) return alert("Nombre y Teléfono obligatorios");

        const { error } = await supabaseClient.from('choferes').insert([{
            nombre: nom,
            apellido: document.getElementById('reg-ape').value,
            telefono: tel,
            tiene_licencia_operativa: document.getElementById('reg-lic').checked,
            libre_de_fondo: document.getElementById('reg-libre').checked,
            marca_carro: document.getElementById('reg-marca').value,
            fondo_actual: 0
        }]);

        if(!error) { alert("Guardado"); location.reload(); }
        else { alert("Error: " + error.message); }
    }

    function filtrar() {
        const text = document.getElementById('busqueda').value.toLowerCase();
        const rows = document.querySelectorAll('#lista-choferes tr');
        rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(text) ? '' : 'none');
    }

    cargarChoferes();
</script>
</body>
</html>

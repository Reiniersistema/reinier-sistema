<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-full { display: none; position: fixed; inset: 0; background: white; z-index: 100; overflow-y: auto; }
        .modal-full.active { display: block; }
        .tab-btn.active { border-bottom: 4px solid #1e5bb9; color: #1e5bb9; }
        .card-chofer { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 0.75rem; border-bottom: 4px solid #e2e8f0; transition: 0.2s; }
        .card-chofer:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-20">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter">Gestión de Choferes</h1>
        <button onclick="window.location.href='nuevo-chofer.html'" class="text-xl px-2">
            <i class="fas fa-user-plus"></i>
        </button>
    </header>

    <main class="p-4 max-w-4xl mx-auto" id="listaChoferes">
        <div class="text-center py-20 text-slate-400 font-bold italic">Cargando choferes...</div>
    </main>

    <div id="modalVer" class="modal-full">
        <header class="bg-slate-800 text-white p-4 flex justify-between items-center">
            <button onclick="cerrarModal()" class="text-xl"><i class="fas fa-times"></i></button>
            <h2 id="det_nombre_titulo" class="font-black uppercase italic">Detalles del Chófer</h2>
            <div class="w-6"></div>
        </header>

        <div class="p-4 space-y-6">
            <div class="text-center">
                <img id="det_foto" src="https://via.placeholder.com/300" class="w-48 h-48 mx-auto rounded-[2.5rem] object-cover shadow-2xl border-4 border-blue-50">
                <h3 id="det_nombre_full" class="text-2xl font-black mt-4 uppercase text-slate-800">...</h3>
                
                <div class="flex justify-center gap-4 mt-2">
                    <label class="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500">
                        <input type="checkbox" id="det_sin_credito" class="w-4 h-4"> Trabajar sin créditos
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-blue-50 p-4 rounded-3xl"><p class="text-[10px] font-black text-blue-400 uppercase">Fondo Actual</p><p id="det_fondo" class="text-xl font-black text-blue-700">$0</p></div>
                <div class="bg-slate-50 p-4 rounded-3xl"><p class="text-[10px] font-black text-slate-400 uppercase">Viajes Hoy</p><p id="det_hoy" class="text-xl font-black text-slate-700">0</p></div>
            </div>

            <div class="flex border-b gap-6 overflow-x-auto scrollbar-hide px-2">
                <button onclick="showTab('info')" class="tab-btn active pb-2 font-black text-[11px] uppercase flex-shrink-0 tracking-widest">Información</button>
                <button onclick="showTab('auto')" class="tab-btn pb-2 font-black text-[11px] uppercase flex-shrink-0 tracking-widest">Vehículo</button>
                <button onclick="showTab('fondo')" class="tab-btn pb-2 font-black text-[11px] uppercase flex-shrink-0 tracking-widest">Historial Fondo</button>
            </div>

            <div id="tab_info" class="tab-content space-y-4">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Teléfono</p>
                    <p id="edit_tel" class="font-bold text-slate-700">...</p>
                </div>
            </div>

            </div>
    </div>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        window.onload = cargarChoferes;

        async function cargarChoferes() {
            const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre');
            const lista = document.getElementById('listaChoferes');
            
            if (error) {
                lista.innerHTML = `<div class="p-4 bg-red-100 text-red-600 rounded-xl text-sm font-bold">Error: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                lista.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-slate-400 font-bold italic">No hay choferes registrados.</p>
                        <button onclick="window.location.href='nuevo-chofer.html'" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-full font-black uppercase text-xs">Agregar el Primero</button>
                    </div>`;
                return;
            }

            lista.innerHTML = data.map(c => `
                <div class="card-chofer flex justify-between items-center" onclick="verChofer('${c.id}')">
                    <div>
                        <p class="text-sm font-black text-slate-800 uppercase tracking-tighter">${c.nombre}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${c.telefono} • LIC: ${c.lic_operativa ? 'SI' : 'NO'}</p>
                        <p class="text-xs font-black text-blue-600 mt-1">FONDO: $${c.fondo_actual}</p>
                    </div>
                    <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                </div>
            `).join('');
        }

        async function verChofer(id) {
            const { data } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
            if(!data) return;
            
            document.getElementById('det_nombre_titulo').innerText = data.nombre;
            document.getElementById('det_nombre_full').innerText = data.nombre;
            document.getElementById('det_fondo').innerText = `$${data.fondo_actual}`;
            document.getElementById('edit_tel').innerText = data.telefono;
            document.getElementById('modalVer').classList.add('active');
        }

        function cerrarModal() { document.getElementById('modalVer').classList.remove('active'); }
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab_' + tab)?.classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>

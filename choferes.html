<style>
    /* Estilo para el botón de filtro con reloj de arena */
    .btn-filtro-flotante {
        position: fixed;
        top: 85px;
        right: 20px;
        background: var(--dorado);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        z-index: 100;
        cursor: pointer;
        border: none;
    }

    /* Estilo para la X del menú a la derecha */
    .closebtn {
        position: absolute;
        top: 15px;
        right: 25px; /* Movido a la derecha */
        font-size: 36px;
        color: var(--dorado);
        background: none;
        border: none;
        cursor: pointer;
    }

    /* Etiquetas de estado en la tarjeta principal */
    .badge-status {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: bold;
        margin-right: 5px;
        background: rgba(212, 175, 55, 0.2);
        color: var(--dorado);
        border: 1px solid var(--dorado);
    }
</style>

<div class="contenedor-principal">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">Nuestros Choferes</h2>
    </div>
    
    <button class="btn-filtro-flotante" onclick="abrirFiltros()">⏳</button>
    
    <button id="btn-nuevo-chofer" class="btn-action btn-gold" onclick="abrirFormularioNuevo()" style="margin: 20px 0;">+ AÑADIR NUEVO CHÓFER</button>
    
    <div id="lista-choferes" class="choferes-grid"></div>
</div>

<div id="mySidebar" class="sidebar">
    <button class="closebtn" onclick="closeNav()">×</button>
    </div>

<script>
    // 1. APLICAR PERMISOS (Botón Editar y Añadir)
    function aplicarPermisosInterfaz(rol, container) {
        if (rol === 'gestor') {
            const btnNuevo = document.getElementById('btn-nuevo-chofer');
            if (btnNuevo) btnNuevo.style.display = 'none';
            
            const btnEditar = container.querySelector('.btn-editar-datos');
            if (btnEditar) btnEditar.style.display = 'none';
        }
    }

    // 2. CONTADORES DE VIAJES REALES
    async function obtenerEstadisticasViajes(choferId) {
        const hoy = new Date().toISOString().split('T')[0];
        const inicioMes = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();

        const { count: total } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', choferId);
        const { count: hoyCount } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', choferId).gte('created_at', hoy);
        const { count: mesCount } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', choferId).gte('created_at', inicioMes);

        return { hoy: hoyCount || 0, mes: mesCount || 0, total: total || 0 };
    }

    // 3. VISTA DETALLE ACTUALIZADA
    async function verDetalle(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        const stats = await obtenerEstadisticasViajes(id);
        const user = JSON.parse(localStorage.getItem('usuario_activo'));
        
        const modal = document.getElementById('contenidoModal');
        modal.innerHTML = `
            <img src="${c.foto_chofer}" style="width:120px; height:120px; border-radius:50%; display:block; margin:auto; object-fit:cover; border:2px solid var(--dorado);">
            
            <div style="text-align:center; margin-top:10px;">
                <h3 style="margin:0;">${c.nombre} ${c.apellido}</h3>
                
                <div style="margin: 10px 0;">
                    ${c.libre_de_fondo ? '<span class="badge-status">SIN FONDO</span>' : ''}
                    ${c.tipo_vehiculo === 'Moto' ? '<span class="badge-status">MOTO</span>' : ''}
                    ${c.tipo_vehiculo === 'Auto' ? '<span class="badge-status">AUTO</span>' : ''}
                </div>

                <div style="color:var(--dorado); font-size:24px; font-weight:bold; margin:10px 0;">
                    $${c.fondo_actual.toFixed(2)}
                </div>
            </div>

            <div class="stats-viajes">
                <div class="stat-item"><span class="stat-val">${stats.hoy}</span><span class="stat-lbl">Hoy</span></div>
                <div class="stat-item"><span class="stat-val">${stats.mes}</span><span class="stat-lbl">Mes</span></div>
                <div class="stat-item"><span class="stat-val">${stats.total}</span><span class="stat-lbl">Total</span></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-action btn-gold btn-editar-datos" onclick="abrirEditorChofer()">EDITAR DATOS</button>
                <a href="https://wa.me/${c.telefono}" target="_blank" class="btn-action btn-green" style="text-decoration:none; text-align:center; background:#25d366; color:white;">WHATSAPP</a>
            </div>

            `;
        
        aplicarPermisosInterfaz(user.rol, modal);
        document.getElementById('modalDetalle').style.display = 'block';
        cargarHistorialCompleto(id);
    }

    // 4. EDITOR CON LOS CHECKS (Aquí es donde se cambian)
    function abrirEditorChofer() {
        const c = choferActual;
        document.getElementById('contenidoModal').innerHTML = `
            <h3 style="color:var(--dorado); text-align:center;">EDITAR CHÓFER</h3>
            <label>Nombre</label><input type="text" id="edit-nombre" value="${c.nombre}">
            <label>Teléfono</label><input type="tel" id="edit-telefono" value="${c.telefono}">
            
            <div style="background:#000; padding:15px; border-radius:10px; margin-bottom:15px;">
                <label style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="edit-sin-fondo" ${c.libre_de_fondo ? 'checked' : ''}> TRABAJAR SIN FONDO
                </label>
                <label style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                    <input type="radio" name="tipo" id="edit-moto" ${c.tipo_vehiculo === 'Moto' ? 'checked' : ''}> MOTO
                </label>
                <label style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                    <input type="radio" name="tipo" id="edit-auto" ${c.tipo_vehiculo === 'Auto' ? 'checked' : ''}> AUTO
                </label>
            </div>

            <button class="btn-action btn-gold" onclick="guardarCambiosFull('${c.id}')">CONFIRMAR CAMBIOS</button>
            <button class="btn-action btn-red" onclick="verDetalle('${c.id}')">CANCELAR</button>
        `;
    }

    async function guardarCambiosFull(id) {
        const updates = {
            nombre: document.getElementById('edit-nombre').value,
            telefono: document.getElementById('edit-telefono').value,
            libre_de_fondo: document.getElementById('edit-sin-fondo').checked,
            tipo_vehiculo: document.getElementById('edit-moto').checked ? 'Moto' : 'Auto'
        };
        
        const { error } = await supabaseClient.from('choferes').update(updates).eq('id', id);
        if(!error) {
            alert("Actualizado correctamente");
            verDetalle(id);
            cargarChoferes();
        }
    }

    // 5. HISTORIAL COMPLETO (Incluyendo descuentos por viajes)
    async function cargarHistorialCompleto(choferId) {
        // Traemos historial de fondos + viajes del chofer para ver descuentos
        const { data: historial } = await supabaseClient
            .from('historial_fondos')
            .select('*')
            .eq('chofer_id', choferId)
            .order('created_at', { ascending: false });

        let html = `<table style="width:100%; font-size:12px; border-collapse:collapse;">
            <tr style="color:var(--dorado); border-bottom:1px solid #444;">
                <th align="left">Metodo</th>
                <th align="right">Saldo</th>
                <th align="right">Activo</th>
                <th align="center">Fecha</th>
            </tr>`;

        historial.forEach(h => {
            html += `<tr style="border-bottom:1px solid #222;">
                <td>${h.metodo}</td>
                <td align="right" style="color:${h.saldo < 0 ? '#ff4d4d' : '#25d366'}">${h.saldo.toFixed(2)}</td>
                <td align="right">$${h.activo.toFixed(2)}</td>
                <td align="center">${new Date(h.created_at).toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'})}</td>
            </tr>`;
        });
        html += `</table>`;
        document.getElementById('tabla-historial').innerHTML = html;
    }
</script>

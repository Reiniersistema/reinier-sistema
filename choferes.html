<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #25d366; --rojo: #ff4d4d; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* HEADER Y NAVEGACIÓN */
        .header-nav-universal { display: flex; align-items: center; gap: 15px; padding: 15px; background: #121212; border-bottom: 1px solid var(--dorado); margin-bottom: 20px; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: var(--dorado); }

        .contenedor-principal { padding: 0 15px; }
        .header-acciones { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-embudo { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--dorado); }
        
        #filtroArea { display: none; margin-bottom: 15px; }
        #filtroArea input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--dorado); background: var(--gris); color: white; box-sizing: border-box; }

        /* TABLA PRINCIPAL */
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { text-align: left; padding: 12px 8px; color: var(--dorado); font-size: 10px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 15px 8px; border-bottom: 1px solid #222; font-size: 13px; }
        .puntos { color: var(--dorado); font-weight: bold; font-size: 22px; cursor: pointer; text-align: center; width: 40px; position: relative; }

        /* MENÚ CONTEXTUAL 3 PUNTOS */
        .menu-contextual { display: none; position: absolute; right: 10px; background: white; color: black; border-radius: 8px; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); width: 120px; }
        .menu-contextual div { padding: 10px; font-size: 13px; border-bottom: 1px solid #eee; cursor: pointer; }
        .menu-contextual div:last-child { border: none; color: var(--rojo); }

        /* MODALES */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); overflow-y: auto; }
        .modal-content { background: var(--gris); margin: 2% auto; padding: 20px; width: 95%; max-width: 600px; border-radius: 15px; border: 1px solid var(--dorado); box-sizing: border-box; position: relative; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--dorado); font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        .form-group input:focus { border-color: var(--dorado); }

        /* VISTA DETALLE CHOFER */
        .foto-detalle { width: 100%; height: 350px; object-fit: cover; border-radius: 12px; border: 2px solid var(--dorado); margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-item { background: #000; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .stat-item span { display: block; font-size: 9px; color: var(--dorado); margin-bottom: 5px; text-transform: uppercase; }
        .stat-item b { font-size: 16px; }

        /* PESTAÑAS (TABS) */
        .tabs-nav { display: flex; background: #000; padding: 5px; border-radius: 10px; margin: 15px 0; gap: 5px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; background: none; color: #888; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; min-width: 90px; }
        .tab-btn.active { background: var(--dorado); color: black; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* TABLA DE FONDOS */
        .tabla-fondos { width: 100%; font-size: 10px; margin-top: 10px; }
        .tabla-fondos th { padding: 8px 4px; border-bottom: 1px solid var(--dorado); }
        .tabla-fondos td { padding: 8px 4px; font-size: 11px; }

        .btn-full { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .btn-verde { background: var(--verde); color: white; }
        .btn-rojo { background: var(--rojo); color: white; }
        .btn-azul { background: var(--azul); color: white; }
        .btn-gris { background: #333; color: white; }
        
        .radio-group { display: flex; gap: 20px; align-items: center; margin: 10px 0; }
        .radio-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .radio-item input { width: auto; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <div class="header-acciones">
        <button class="btn-add" onclick="abrirModal('modalRegistro')">+ Añadir Chófer</button>
        <button class="btn-embudo" onclick="toggleFiltro()">⏳</button>
    </div>

    <div id="filtroArea"><input type="text" id="busqueda" placeholder="Buscar por teléfono o nombre..." onkeyup="filtrarChoferes()"></div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr><th>Nombre</th><th>Teléfono</th><th>Lic.</th><th>Fondo</th><th></th></tr>
            </thead>
            <tbody id="lista-choferes">
                </tbody>
        </table>
    </div>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); margin-top:0; font-family:'Playfair Display';">NUEVO CHÓFER</h2>
        
        <div class="form-group"><label>Foto del Chófer</label><input type="file" id="reg-foto-chofer" accept="image/*"></div>
        <div style="display:flex; gap:10px">
            <div class="form-group" style="flex:1"><label>Nombre</label><input type="text" id="reg-nom"></div>
            <div class="form-group" style="flex:1"><label>Apellido</label><input type="text" id="reg-ape"></div>
        </div>
        <div class="form-group"><label>Teléfono</label><input type="tel" id="reg-tel"></div>
        
        <div style="background:#000; padding:15px; border-radius:10px; margin-bottom:15px;">
            <div class="radio-item"><input type="checkbox" id="reg-lic"> <label>Licencia Operativa</label></div>
            <div class="radio-item" style="margin-top:10px; color:var(--dorado)"><input type="checkbox" id="reg-libre"> <label>LIBRE DE FONDO (Trabaja sin créditos)</label></div>
        </div>

        <div class="form-group"><label>Foto del Vehículo</label><input type="file" id="reg-foto-carro" accept="image/*"></div>
        <div style="display:flex; gap:10px">
            <input type="text" id="reg-marca" placeholder="Marca" style="width:33%; padding:10px; border-radius:5px; background:#000; color:#fff; border:1px solid #333">
            <input type="text" id="reg-modelo" placeholder="Modelo" style="width:33%; padding:10px; border-radius:5px; background:#000; color:#fff; border:1px solid #333">
            <input type="text" id="reg-color" placeholder="Color" style="width:33%; padding:10px; border-radius:5px; background:#000; color:#fff; border:1px solid #333">
        </div>
        <div class="radio-item" style="margin-top:15px;"><input type="checkbox" id="reg-aire"> <label>Vehículo con Aire Acondicionado</label></div>

        <button class="btn-full btn-verde" style="margin-top:20px;" onclick="guardarChofer()">PROCESAR REGISTRO</button>
        <button class="btn-full btn-gris" onclick="cerrarModal('modalRegistro')">CANCELAR</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" id="detalle-chofer-content">
        </div>
</div>

<script src="config.js"></script>
<script>
    let choferSel = null;
    let usuarioActivo = JSON.parse(localStorage.getItem('usuario_activo')) || {nombre: 'Sistema'};

    // Abrir/Cerrar Modales
    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleFiltro() { 
        const f = document.getElementById('filtroArea');
        f.style.display = f.style.display === 'block' ? 'none' : 'block';
    }

    // Listar Choferes
    async function cargarChoferes() {
        const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre');
        const tbody = document.getElementById('lista-choferes');
        if(error) return;

        tbody.innerHTML = data.map(c => `
            <tr>
                <td><b>${c.nombre} ${c.apellido}</b></td>
                <td>${c.telefono}</td>
                <td>${c.tiene_licencia_operativa ? '✅' : '❌'}</td>
                <td style="color:var(--dorado); font-weight:bold;">$${c.fondo_actual}</td>
                <td class="puntos" onclick="toggleMenuContextual(event, '${c.id}')">⋮
                    <div id="menu-${c.id}" class="menu-contextual">
                        <div onclick="verChofer('${c.id}')">Ver</div>
                        <div onclick="eliminarChofer('${c.id}')">Eliminar</div>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function toggleMenuContextual(e, id) {
        e.stopPropagation();
        document.querySelectorAll('.menu-contextual').forEach(m => m.style.display = 'none');
        document.getElementById('menu-'+id).style.display = 'block';
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.menu-contextual').forEach(m => m.style.display = 'none');
    });

    // Ver Detalle Completo
    async function verChofer(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferSel = c;
        
        const content = document.getElementById('detalle-chofer-content');
        content.innerHTML = `
            <img src="${c.foto_chofer || 'https://via.placeholder.com/400'}" class="foto-detalle">
            <h2 style="margin:0; font-family:'Playfair Display';">${c.nombre} ${c.apellido}</h2>
            <p style="color:var(--dorado); font-size:12px; margin: 10px 0;">
                <span style="color:${c.libre_de_fondo ? 'var(--verde)' : '#666'}">● Trabajar sin créditos: ${c.libre_de_fondo ? 'ACTIVADO' : 'DESACTIVADO'}</span>
            </p>

            <div class="form-group">
                <label>Grupo que pertenece</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="grp" value="M" ${c.grupo === 'M' ? 'checked' : ''} onchange="cambiarGrupo('M')"> Motos</label>
                    <label class="radio-item"><input type="radio" name="grp" value="A" ${c.grupo === 'A' ? 'checked' : ''} onchange="cambiarGrupo('A')"> Autos</label>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span>Fondo Actual</span><b>$${c.fondo_actual}</b></div>
                <div class="stat-item"><span>Viajes Hoy</span><b>0</b></div>
                <div class="stat-item"><span>Viajes Mes</span><b>0</b></div>
                <div class="stat-item"><span>Viajes Total</span><b>0</b></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-full btn-azul" onclick="alert('Filtros próximamente')">Filtrar Viajes</button>
                <button class="btn-full btn-verde" onclick="window.open('https://wa.me/${c.telefono}')">WhatsApp</button>
            </div>
            <button class="btn-full btn-rojo" onclick="eliminarChofer('${c.id}')">Eliminar Chófer</button>

            <div class="tabs-nav">
                <button class="tab-btn active" onclick="showTab('info')">Información</button>
                <button class="tab-btn" onclick="showTab('auto')">Auto</button>
                <button class="tab-btn" onclick="showTab('fondo')">Fondo</button>
            </div>

            <div id="tab-info" class="tab-pane active">
                <div class="form-group"><label>Nombre Completo</label><input type="text" value="${c.nombre} ${c.apellido}" disabled></div>
                <div class="form-group"><label>Teléfono</label><input type="text" value="${c.telefono}" disabled></div>
            </div>

            <div id="tab-auto" class="tab-pane">
                <img src="${c.foto_carro || 'https://via.placeholder.com/400'}" style="width:100%; border-radius:10px; margin-bottom:10px;">
                <div class="form-group"><label>Vehículo</label><input type="text" value="${c.marca_carro} ${c.modelo_carro} (${c.color_carro})" disabled></div>
                <div class="radio-item"><input type="checkbox" ${c.tiene_aire_acondicionado ? 'checked' : ''} disabled> Aire Acondicionado</div>
                <div class="radio-item" style="margin-top:5px;"><input type="checkbox" ${c.tiene_licencia_operativa ? 'checked' : ''} disabled> Licencia Operativa</div>
            </div>

            <div id="tab-fondo" class="tab-pane">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button class="btn-verde" style="flex:1; padding:10px; border-radius:5px; border:none; font-weight:bold;" onclick="abrirOperacion('agregar')">AGREGAR</button>
                    <button class="btn-rojo" style="flex:1; padding:10px; border-radius:5px; border:none; font-weight:bold;" onclick="abrirOperacion('retirar')">RETIRAR</button>
                </div>
                
                <div id="panel-operacion" style="display:none; background:#000; padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid var(--dorado)">
                    <h4 id="op-titulo" style="margin-top:0; font-size:12px; color:var(--dorado)">OPERACIÓN</h4>
                    <div id="metodo-box" class="form-group">
                        <label>Método</label>
                        <select id="op-metodo"><option value="Efectivo">Efectivo</option><option value="Transferencia">Transferencia</option></select>
                    </div>
                    <div class="form-group"><label>Cantidad</label><input type="number" id="op-cantidad"></div>
                    <button class="btn-full btn-verde" onclick="ejecutarOperacion()">PROCESAR</button>
                </div>

                <button class="btn-full btn-gris" style="font-size:10px;" onclick="rectificarFondos('${c.id}')">Rectificar Fondo</button>

                <div class="tabla-contenedor">
                    <table class="tabla-fondos">
                        <thead><tr><th>Usuario</th><th>Met.</th><th>Saldo</th><th>Fondo</th><th>Activo</th><th>Fecha</th></tr></thead>
                        <tbody id="historial-fondos-body"></tbody>
                    </table>
                </div>
            </div>

            <button class="btn-full btn-gris" style="margin-top:20px" onclick="cerrarModal('modalVer')">Cerrar</button>
        `;
        abrirModal('modalVer');
        cargarHistorialFondos(id);
    }

    function showTab(name) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+name).classList.add('active');
        event.target.classList.add('active');
    }

    let operacionActual = "";
    function abrirOperacion(tipo) {
        operacionActual = tipo;
        document.getElementById('panel-operacion').style.display = 'block';
        document.getElementById('op-titulo').innerText = tipo === 'agregar' ? 'INGRESAR FONDO' : 'RETIRAR FONDO';
        document.getElementById('metodo-box').style.display = tipo === 'agregar' ? 'block' : 'none';
    }

    async function ejecutarOperacion() {
        const cant = parseFloat(document.getElementById('op-cantidad').value);
        if(!cant) return alert("Ingrese cantidad");

        const fondoAnterior = parseFloat(choferSel.fondo_actual);
        const activo = operacionActual === 'agregar' ? fondoAnterior + cant : fondoAnterior - cant;

        const { error: hError } = await supabaseClient.from('historial_fondos').insert([{
            chofer_id: choferSel.id,
            usuario: usuarioActivo.nombre,
            metodo: operacionActual === 'agregar' ? document.getElementById('op-metodo').value : 'Retiro',
            saldo: cant,
            fondo: fondoAnterior,
            activo: activo
        }]);

        if(!hError) {
            await supabaseClient.from('choferes').update({ fondo_actual: activo }).eq('id', choferSel.id);
            alert("Operación Exitosa");
            verChofer(choferSel.id);
        }
    }

    async function cargarHistorialFondos(id) {
        const { data } = await supabaseClient.from('historial_fondos').select('*').eq('chofer_id', id).order('fecha', {ascending: false});
        const tbody = document.getElementById('historial-fondos-body');
        tbody.innerHTML = data.map(h => `
            <tr>
                <td>${h.usuario}</td>
                <td>${h.metodo}</td>
                <td style="color:var(--verde)">$${h.saldo}</td>
                <td>$${h.fondo}</td>
                <td style="font-weight:bold">$${h.activo}</td>
                <td>${new Date(h.fecha).toLocaleDateString()}</td>
            </tr>
        `).join('');
    }

    async function guardarChofer() {
        // Aquí iría la lógica de subida de imágenes (Bucket de Supabase) y luego el insert
        // Por brevedad, insertamos datos básicos. Para fotos reales usarías supabase.storage
        const { error } = await supabaseClient.from('choferes').insert([{
            nombre: document.getElementById('reg-nom').value,
            apellido: document.getElementById('reg-ape').value,
            telefono: document.getElementById('reg-tel').value,
            tiene_licencia_operativa: document.getElementById('reg-lic').checked,
            libre_de_fondo: document.getElementById('reg-libre').checked,
            marca_carro: document.getElementById('reg-marca').value,
            modelo_carro: document.getElementById('reg-modelo').value,
            color_carro: document.getElementById('reg-color').value,
            tiene_aire_acondicionado: document.getElementById('reg-aire').checked,
            fondo_actual: 0
        }]);

        if(!error) { location.reload(); } else { alert(error.message); }
    }

    async function eliminarChofer(id) {
        if(confirm("¿Estás seguro de eliminar este chófer? Esta acción no se puede deshacer.")) {
            await supabaseClient.from('choferes').delete().eq('id', id);
            location.reload();
        }
    }

    function filtrarChoferes() {
        const val = document.getElementById('busqueda').value.toLowerCase();
        document.querySelectorAll('#lista-choferes tr').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    cargarChoferes();
</script>
</body>
</html>

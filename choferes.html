<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #25d366; --rojo: #ff4d4d; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* ESTILOS DEL MENÚ UNIVERSAL (Copiados de tu ejemplo) */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 3000; top: 0; left: 0; background-color: #1e1e1e; overflow-x: hidden; transition: 0.5s; padding-top: 60px; border-right: 1px solid #d4af37; }
        .sidebar a { padding: 12px 24px; text-decoration: none; font-size: 15px; color: #818181; display: block; transition: 0.3s; text-transform: uppercase; }
        .sidebar a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #d4af37; }
        .header-nav-universal { display: flex; align-items: center; gap: 15px; padding: 15px; background: #121212; border-bottom: 1px solid #d4af37; margin-bottom: 20px; }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }

        /* Estilos de la página */
        .contenedor-principal { padding: 0 15px; }
        .header-seccion { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; }
        
        /* Tabla Principal */
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 10px; color: var(--dorado); font-size: 10px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 13px; cursor: pointer; }

        /* Modales */
        .modal { display: none; position: fixed; z-index: 4000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { background: var(--gris); margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; border: 1px solid var(--dorado); }
        
        .foto-perfil-v { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; border: 2px solid var(--dorado); margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-item { background: #000; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .stat-item span { display: block; font-size: 9px; color: var(--dorado); text-transform: uppercase; }

        .btn-full { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-verde { background: var(--verde); color: white; }
        .btn-rojo { background: var(--rojo); color: white; }
        .btn-azul { background: var(--azul); color: white; }

        .tab-nav { display: flex; gap: 5px; margin: 15px 0; }
        .tab-btn { flex: 1; padding: 10px; background: #000; color: #666; border: none; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--dorado); color: black; }
        .tab-pane { display: none; padding: 10px; background: #000; border-radius: 8px; }
        .tab-pane.active { display: block; }
    </style>
</head>
<body>

<div class="header-nav-universal">
    <button class="openbtn" onclick="openNav()">&#9776;</button>
    <div class="logo-txt-universal">RF <span style="font-size: 14px; color: var(--dorado);">TransGestión</span></div>
</div>
<div class="contenedor-principal">
    <div class="header-seccion">
        <h2 style="color:var(--dorado); font-size:18px;">Choferes</h2>
        <button class="btn-add" onclick="abrirModal('modalRegistro')">+ AÑADIR</button>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr><th>Nombre</th><th>Teléfono</th><th>Lic.</th><th>Fondo</th></tr>
            </thead>
            <tbody id="lista-choferes"></tbody>
        </table>
    </div>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" id="detalle-chofer"></div>
</div>

<div id="modalEditar" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); font-size:16px;">EDITAR DATOS</h2>
        <div id="form-editar">
            </div>
        <button class="btn-full btn-verde" onclick="guardarEdicion()">GUARDAR CAMBIOS</button>
        <button class="btn-full" style="background:#444;" onclick="cerrarModal('modalEditar')">CANCELAR</button>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script> <script>
    let choferSel = null;

    async function cargarChoferes() {
        const { data } = await supabaseClient.from('choferes').select('*').order('nombre');
        const tbody = document.getElementById('lista-choferes');
        tbody.innerHTML = data.map(c => `
            <tr onclick="verChofer('${c.id}')">
                <td><b>${c.nombre}</b></td>
                <td>${c.telefono}</td>
                <td>${c.tiene_licencia_operativa ? '✅' : '❌'}</td>
                <td style="color:var(--dorado);">$${c.fondo_actual}</td>
            </tr>
        `).join('');
    }

    async function verChofer(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferSel = c;

        // Contadores
        const hoy = new Date().toISOString().split('T')[0];
        const { count: vHoy } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', id).gte('created_at', hoy);
        const { count: vTotal } = await supabaseClient.from('viajes').select('*', { count: 'exact', head: true }).eq('chofer_id', id);

        const d = document.getElementById('detalle-chofer');
        d.innerHTML = `
            <img src="${c.foto_chofer || ''}" class="foto-perfil-v">
            <h2 style="margin:0; font-size:20px;">${c.nombre} ${c.apellido}</h2>
            <p style="font-size:10px; color:var(--dorado);">TRABAJAR SIN CRÉDITOS: ${c.libre_de_fondo ? 'SÍ' : 'NO'}</p>

            <div class="stats-grid">
                <div class="stat-item"><span>Fondo</span><b>$${c.fondo_actual}</b></div>
                <div class="stat-item"><span>Hoy</span><b>${vHoy || 0}</b></div>
                <div class="stat-item"><span>Mes</span><b>0</b></div>
                <div class="stat-item"><span>Total</span><b>${vTotal || 0}</b></div>
            </div>

            <button class="btn-full btn-verde" onclick="window.open('https://wa.me/${c.telefono}')">WHATSAPP</button>
            <div style="display:flex; gap:10px;">
                <button class="btn-full btn-azul" onclick="prepararEdicion()">EDITAR</button>
                <button class="btn-full btn-rojo" onclick="eliminarChofer('${c.id}')">ELIMINAR</button>
            </div>

            <div class="tab-nav">
                <button class="tab-btn active" onclick="showTab('info')">INFO</button>
                <button class="tab-btn" onclick="showTab('auto')">AUTO</button>
            </div>

            <div id="tab-info" class="tab-pane active">
                <p>Teléfono: ${c.telefono}</p>
                <p>Licencia: ${c.tiene_licencia_operativa ? 'Activa' : 'No'}</p>
            </div>
            
            <div id="tab-auto" class="tab-pane">
                <p>Marca: ${c.marca_carro}</p>
                <p>Modelo: ${c.modelo_carro}</p>
            </div>

            <button class="btn-full" style="background:#333; margin-top:15px;" onclick="cerrarModal('modalVer')">CERRAR</button>
        `;
        abrirModal('modalVer');
    }

    function prepararEdicion() {
        const c = choferSel;
        const f = document.getElementById('form-editar');
        f.innerHTML = `
            <label style="color:var(--dorado); font-size:10px;">NOMBRE</label>
            <input type="text" id="ed-nom" value="${c.nombre}" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:white; border:1px solid #333;">
            <label style="color:var(--dorado); font-size:10px;">TELÉFONO</label>
            <input type="text" id="ed-tel" value="${c.telefono}" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:white; border:1px solid #333;">
            <label style="color:var(--dorado); font-size:10px;">MARCA AUTO</label>
            <input type="text" id="ed-marca" value="${c.marca_carro || ''}" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:white; border:1px solid #333;">
            <div style="margin-top:10px;">
                <label><input type="checkbox" id="ed-lic" ${c.tiene_licencia_operativa ? 'checked' : ''}> Licencia Operativa</label><br>
                <label><input type="checkbox" id="ed-libre" ${c.libre_de_fondo ? 'checked' : ''}> Trabajar sin créditos</label>
            </div>
        `;
        abrirModal('modalEditar');
    }

    async function guardarEdicion() {
        const upd = {
            nombre: document.getElementById('ed-nom').value,
            telefono: document.getElementById('ed-tel').value,
            marca_carro: document.getElementById('ed-marca').value,
            tiene_licencia_operativa: document.getElementById('ed-lic').checked,
            libre_de_fondo: document.getElementById('ed-libre').checked
        };
        const { error } = await supabaseClient.from('choferes').update(upd).eq('id', choferSel.id);
        if(!error) {
            alert("¡Actualizado!");
            location.reload();
        }
    }

    async function eliminarChofer(id) {
        if(confirm("¿Eliminar chofer definitivamente?")) {
            await supabaseClient.from('choferes').delete().eq('id', id);
            location.reload();
        }
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function showTab(t) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        event.target.classList.add('active');
    }

    cargarChoferes();
</script>
</body>
</html>

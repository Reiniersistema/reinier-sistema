<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-chofer { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 0.8rem; border-bottom: 4px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .modal-full { display: none; position: fixed; inset: 0; background: white; z-index: 1000; overflow-y: auto; }
        .modal-full.active { display: block; }
        .menu-drop { display: none; position: absolute; right: 10px; top: 40px; background: white; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 100; border: 1px solid #eee; min-width: 120px; }
        .menu-drop.active { display: block; }
        .tab-btn { padding: 10px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #1e5bb9; border-bottom-color: #1e5bb9; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #f8fafc; color: #64748b; padding: 8px; text-transform: uppercase; }
        td { padding: 8px; border-bottom: 1px solid #f1f5f9; text-align: center; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter">Lista de Choferes</h1>
        <button onclick="window.location.href='nuevo_chofer.html'" class="text-xl"><i class="fas fa-user-plus"></i></button>
    </header>

    <main class="p-4 max-w-4xl mx-auto" id="listaChoferes">
        </main>

    <div id="modalVer" class="modal-full">
        <header class="bg-[#1e5bb9] text-white p-4 flex justify-between items-center sticky top-0 shadow-lg">
            <button onclick="cerrarModal()" class="text-xl"><i class="fas fa-times"></i></button>
            <h2 class="font-black uppercase italic tracking-tighter">Perfil del Chofer</h2>
            <div class="w-6"></div>
        </header>

        <div class="p-4 space-y-6">
            <div class="text-center">
                <img id="det_foto" src="" class="w-48 h-48 mx-auto rounded-[3rem] object-cover shadow-2xl border-4 border-blue-50 bg-slate-200">
                <h3 id="det_nombre_full" class="text-2xl font-black mt-4 uppercase text-slate-800 tracking-tighter">...</h3>
                
                <div class="flex flex-col items-center gap-2 mt-3">
                    <label class="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500">
                        <input type="checkbox" id="det_sin_credito"> Trabajar sin créditos
                    </label>
                    <div class="bg-slate-100 p-2 rounded-xl border w-full max-w-[200px]">
                        <p class="text-[9px] font-black uppercase text-slate-400 mb-1">Grupo</p>
                        <div class="flex justify-around">
                            <label class="text-xs font-bold"><input type="radio" name="det_grupo" value="Auto"> Auto</label>
                            <label class="text-xs font-bold"><input type="radio" name="det_grupo" value="Moto"> Moto</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-blue-600 p-4 rounded-3xl text-white text-center shadow-lg">
                    <p class="text-[9px] font-bold uppercase opacity-80">Fondo Actual</p>
                    <p id="det_fondo" class="text-2xl font-black">$0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-3xl text-white text-center shadow-lg">
                    <p class="text-[9px] font-bold uppercase opacity-80">Viajes Hoy</p>
                    <p id="det_hoy" class="text-2xl font-black">0</p>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button class="bg-slate-100 p-3 rounded-2xl font-black text-[10px] uppercase text-slate-600"><i class="fas fa-filter block mb-1 text-lg"></i> Filtrar</button>
                <button onclick="abrirWA()" class="bg-green-100 p-3 rounded-2xl font-black text-[10px] uppercase text-green-600"><i class="fab fa-whatsapp block mb-1 text-lg"></i> Whatsapp</button>
                <button onclick="eliminarChoferActual()" class="bg-red-100 p-3 rounded-2xl font-black text-[10px] uppercase text-red-600"><i class="fas fa-trash block mb-1 text-lg"></i> Eliminar</button>
            </div>

            <div class="flex border-b justify-between">
                <button onclick="showTab('info')" id="btn_info" class="tab-btn active flex-1">Información</button>
                <button onclick="showTab('auto')" id="btn_auto" class="tab-btn flex-1">Auto</button>
                <button onclick="showTab('fondo')" id="btn_fondo" class="tab-btn flex-1">Fondo</button>
            </div>

            <div id="tab_info" class="tab-content space-y-4">
                <div class="bg-white p-4 rounded-2xl border shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Teléfono Registrado</p>
                    <p id="info_tel" class="text-lg font-bold text-slate-700">...</p>
                </div>
            </div>

            <div id="tab_auto" class="tab-content hidden space-y-4">
                <img id="auto_foto" src="" class="w-full h-44 object-cover rounded-3xl bg-slate-100 shadow-inner">
                <div class="bg-white p-4 rounded-2xl border shadow-sm">
                    <p id="auto_desc" class="font-black text-slate-800 uppercase text-sm">...</p>
                    <div class="mt-4 grid grid-cols-2 gap-2">
                        <span id="auto_aire" class="bg-blue-50 text-blue-700 p-2 rounded-lg text-[10px] font-black text-center uppercase"></span>
                        <span id="auto_lic" class="bg-green-50 text-green-700 p-2 rounded-lg text-[10px] font-black text-center uppercase"></span>
                    </div>
                </div>
            </div>

            <div id="tab_fondo" class="tab-content hidden space-y-4">
                <div class="flex gap-2">
                    <button onclick="abrirTransaccion('Agregar')" class="flex-1 bg-green-600 text-white p-3 rounded-xl font-black text-[10px] uppercase shadow-md">Agregar</button>
                    <button onclick="abrirTransaccion('Retirar')" class="flex-1 bg-orange-500 text-white p-3 rounded-xl font-black text-[10px] uppercase shadow-md">Retirar</button>
                    <button onclick="rectificarFondo()" class="flex-1 bg-blue-100 text-blue-600 p-3 rounded-xl font-black text-[10px] uppercase border border-blue-200">Rectificar</button>
                </div>

                <div id="formFondo" class="hidden bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-300">
                    <h4 id="trans_titulo" class="font-black uppercase text-xs mb-3 text-slate-600 text-center">...</h4>
                    <select id="trans_metodo" class="w-full p-3 rounded-xl mb-2 text-xs font-bold border">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>
                    <input type="number" id="trans_cantidad" placeholder="Cantidad $" class="w-full p-3 rounded-xl mb-2 text-xs font-bold border">
                    <button onclick="procesarTransaccion()" class="w-full bg-[#1e5bb9] text-white p-3 rounded-xl font-black text-[10px] uppercase">Confirmar Operación</button>
                </div>

                <div class="overflow-x-auto rounded-xl border">
                    <table>
                        <thead>
                            <tr>
                                <th>Método</th><th>Saldo</th><th>Fondo</th><th>Activo</th><th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        let choferCargado = null;

        window.onload = cargarChoferes;

        async function cargarChoferes() {
            const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre');
            if(error) return;

            const lista = document.getElementById('listaChoferes');
            lista.innerHTML = data.map(c => `
                <div class="card-chofer">
                    <div onclick="verChofer('${c.id}')" class="flex-1">
                        <p class="text-sm font-black uppercase text-slate-800 tracking-tighter">${c.nombre} ${c.apellidos || ''}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${c.telefono} • LIC: ${c.lic_operativa ? 'SÍ' : 'NO'}</p>
                        <p class="text-xs font-black text-blue-600 mt-1">FONDO: $${c.fondo_actual}</p>
                    </div>
                    <div>
                        <button onclick="toggleMenu('${c.id}')" class="p-4 text-slate-300"><i class="fas fa-ellipsis-v"></i></button>
                        <div id="menu-${c.id}" class="menu-drop">
                            <button onclick="verChofer('${c.id}')" class="w-full text-left p-3 text-[10px] font-black uppercase text-slate-600 border-b">
                                <i class="fas fa-eye mr-2 text-blue-500"></i> Ver Perfil
                            </button>
                            <button onclick="eliminarDesdeLista('${c.id}')" class="w-full text-left p-3 text-[10px] font-black uppercase text-red-500">
                                <i class="fas fa-trash mr-2"></i> Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleMenu(id) {
            document.querySelectorAll('.menu-drop').forEach(m => {
                if(m.id !== `menu-${id}`) m.classList.remove('active');
            });
            document.getElementById(`menu-${id}`).classList.toggle('active');
        }

        async function verChofer(id) {
            const { data } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
            if(!data) return;
            choferCargado = data;

            // Llenar Modal
            document.getElementById('det_nombre_full').innerText = `${data.nombre} ${data.apellidos || ''}`;
            document.getElementById('det_foto').src = data.foto_url || 'https://via.placeholder.com/300?text=SIN+FOTO';
            document.getElementById('det_fondo').innerText = `$${data.fondo_actual}`;
            document.getElementById('info_tel').innerText = data.telefono;
            document.getElementById('auto_foto').src = data.auto_foto_url || 'https://via.placeholder.com/400x200?text=SIN+FOTO';
            document.getElementById('auto_desc').innerText = `${data.auto_marca} ${data.auto_modelo} (${data.auto_color})`;
            document.getElementById('auto_aire').innerText = data.aire_acondicionado ? 'Con Aire' : 'Sin Aire';
            document.getElementById('auto_lic').innerText = data.lic_operativa ? 'Licencia 12%' : 'No Licencia 15%';
            
            // Checks y Radios
            document.getElementById('det_sin_credito').checked = data.trabajar_sin_credito;
            const radioGrupo = document.querySelector(`input[name="det_grupo"][value="${data.grupo}"]`);
            if(radioGrupo) radioGrupo.checked = true;

            cargarHistorial(id);
            document.getElementById('modalVer').classList.add('active');
            document.querySelectorAll('.menu-drop').forEach(m => m.classList.remove('active'));
        }

        async function cargarHistorial(id) {
            const { data } = await supabaseClient.from('movimientos_fondo').select('*').eq('usuario', id).order('created_at', { ascending: false });
            const tabla = document.getElementById('tablaHistorial');
            tabla.innerHTML = data.map(m => `
                <tr>
                    <td>${m.metodo}</td>
                    <td class="font-bold ${m.saldo >= 0 ? 'text-green-600' : 'text-red-600'}">${m.saldo >= 0 ? '+' : ''}${m.saldo}</td>
                    <td class="text-slate-400">$${m.fondo_ant}</td>
                    <td class="font-black">$${m.activo}</td>
                    <td class="text-[8px] opacity-50">${new Date(m.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function abrirTransaccion(tipo) {
            window.tipoTransaccion = tipo;
            document.getElementById('trans_titulo').innerText = tipo + " Dinero al Fondo";
            document.getElementById('formFondo').classList.remove('hidden');
        }

        async function procesarTransaccion() {
            const cant = parseFloat(document.getElementById('trans_cantidad').value);
            if(!cant || !choferCargado) return;

            const saldo = window.tipoTransaccion === 'Agregar' ? cant : -cant;
            const nuevoActivo = choferCargado.fondo_actual + saldo;

            // 1. Registro movimiento
            await supabaseClient.from('movimientos_fondo').insert([{
                usuario: choferCargado.id,
                metodo: document.getElementById('trans_metodo').value,
                saldo: saldo,
                fondo_ant: choferCargado.fondo_actual,
                activo: nuevoActivo
            }]);

            // 2. Actualizar Chofer
            await supabaseClient.from('choferes').update({ fondo_actual: nuevoActivo }).eq('id', choferCargado.id);
            
            alert("Operación completada");
            document.getElementById('formFondo').classList.add('hidden');
            verChofer(choferCargado.id);
        }

        async function eliminarDesdeLista(id) {
            if(confirm("¿Seguro que quieres eliminar este chofer?")) {
                await supabaseClient.from('choferes').delete().eq('id', id);
                cargarChoferes();
            }
        }

        async function eliminarChoferActual() {
            if(confirm("¿Eliminar este perfil permanentemente?")) {
                await supabaseClient.from('choferes').delete().eq('id', choferCargado.id);
                cerrarModal();
                cargarChoferes();
            }
        }

        function cerrarModal() { document.getElementById('modalVer').classList.remove('active'); }
        
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab_' + tab).classList.remove('hidden');
            document.getElementById('btn_' + tab).classList.add('active');
        }

        function abrirWA() {
            window.open(`https://wa.me/${choferCargado.telefono}`, '_blank');
        }
    </script>
</body>
</html>

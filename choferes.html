<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #ff4d4d; --verde: #25d366; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 60px; }
        
        .contenedor-principal { padding: 0 15px; max-width: 800px; margin: auto; }
        h2 { color: var(--dorado); text-align: center; text-transform: uppercase; font-size: 18px; margin-bottom: 20px; font-family: 'Playfair Display', serif; }

        /* Buscador */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-box { display: none; margin-bottom: 15px; gap: 10px; }
        .search-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; }
        .btn-filter { background: var(--gris); border: 1px solid #333; color: var(--dorado); padding: 12px; border-radius: 8px; cursor: pointer; position: absolute; top: 0; right: 0; }

        /* Grid de Choferes tipo Tarjeta */
        .choferes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card-chofer { background: var(--gris); border-radius: 15px; border: 1px solid #333; padding: 15px; cursor: pointer; transition: 0.3s; }
        .card-chofer:hover { border-color: var(--dorado); transform: translateY(-2px); }
        .card-header { display: flex; align-items: center; gap: 15px; }
        .foto-perfil { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--dorado); object-fit: cover; background: #000; }
        .info-basica h3 { margin: 0; font-size: 15px; color: white; }
        .info-basica p { margin: 2px 0; font-size: 11px; color: #aaa; }
        .fondo-monto { font-size: 16px; font-weight: bold; color: var(--dorado); margin-top: 10px; text-align: right; }

        /* Modal / Pantalla detalle */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { max-width: 600px; margin: auto; background: var(--gris); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .btn-close { background: var(--rojo); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        
        /* Detalles Chofer */
        .foto-grande { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--dorado); object-fit: cover; display: block; margin: 0 auto 15px; }
        .detalles-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-action { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-gold { background: var(--dorado); color: black; }
        .btn-red { background: var(--rojo); color: white; }
        .btn-green { background: var(--verde); color: white; }
        
        /* Sub-secciones de fondo */
        .sub-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; }
        .btn-sub { background: #333; color: white; padding: 8px; font-size: 10px; border-radius: 6px; text-align: center; border: 1px solid #444; }
        .btn-sub.active { background: var(--dorado); color: black; }
        
        .section-content { display: none; margin-top: 15px; background: #080808; padding: 15px; border-radius: 8px; }
        .section-content.active { display: block; }

        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; box-sizing: border-box; margin-bottom: 10px; }
        label { font-size: 12px; color: var(--dorado); font-weight: bold; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <h2>Nuestros Choferes</h2>

    <div class="search-container">
        <button class="btn-filter" onclick="toggleSearch()">🔍</button>
        <div id="searchBox" class="search-box">
            <input type="text" id="busqueda" placeholder="Nombre o teléfono..." oninput="filtrarChoferes()">
        </div>
    </div>

    <div id="lista-choferes" class="choferes-grid"></div>
</div>

<button style="position:fixed;bottom:20px;right:20px;background:var(--dorado);width:50px;height:50px;border-radius:50%;border:none;font-size:24px;color:black;cursor:pointer;z-index:100;" onclick="abrirFormularioNuevo()">+</button>

<div id="modalDetalle" class="modal">
    <div class="modal-content">
        <button class="btn-close" onclick="cerrarModal()">CERRAR</button>
        <div id="contenidoModal"></div>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
    let todosLosChoferes = [];

    // --- Carga y Renderizado ---
    async function cargarChoferes() {
        const { data, error } = await supabaseClient.from('choferes').select('*').order('nombre');
        if (error) return alert("Error al cargar");
        todosLosChoferes = data;
        renderizarGrid(todosLosChoferes);
    }

    function renderizarGrid(lista) {
        const contenedor = document.getElementById('lista-choferes');
        contenedor.innerHTML = "";
        lista.forEach(c => {
            const card = `
                <div class="card-chofer" onclick="verDetalleChofer('${c.id}')">
                    <div class="card-header">
                        <img src="${c.foto_chofer || 'https://via.placeholder.com/60'}" class="foto-perfil">
                        <div class="info-basica">
                            <h3>${c.nombre} ${c.apellido || ''}</h3>
                            <p>📞 ${c.telefono}</p>
                            <p>${c.tiene_licencia_operativa ? '✅ Licencia' : '❌ Sin Licencia'}</p>
                        </div>
                    </div>
                    <div class="fondo-monto">$${c.fondo_actual.toFixed(2)}</div>
                </div>
            `;
            contenedor.innerHTML += card;
        });
    }

    function toggleSearch() {
        const box = document.getElementById('searchBox');
        box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function filtrarChoferes() {
        const termino = document.getElementById('busqueda').value.toLowerCase();
        const filtrados = todosLosChoferes.filter(c => 
            c.nombre.toLowerCase().includes(termino) || c.telefono.includes(termino)
        );
        renderizarGrid(filtrados);
    }

    // --- Detalle y Acciones ---
    async function verDetalleChofer(id) {
        const { data: c, error } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        if (error) return;

        document.getElementById('contenidoModal').innerHTML = `
            <img src="${c.foto_chofer || 'https://via.placeholder.com/120'}" class="foto-grande">
            <h2 style="margin:0;">${c.nombre} ${c.apellido}</h2>
            <p style="text-align:center; color: var(--dorado); font-size:12px;">
                ${c.libre_de_fondo ? '⭐ Trabaja sin créditos' : '💳 Con créditos'}
            </p>
            
            <div class="detalles-row"><span>Teléfono</span><b>${c.telefono}</b></div>
            <div class="detalles-row"><span>Fondo Actual</span><b style="color:var(--dorado);font-size:16px;">$${c.fondo_actual.toFixed(2)}</b></div>
            
            <div class="action-btns">
                <a href="tel:${c.telefono}" class="btn-action btn-green">WhatsApp</a>
                <button class="btn-action btn-red" onclick="eliminarChofer('${c.id}')">Eliminar</button>
            </div>

            <div class="sub-menu">
                <button class="btn-sub" onclick="mostrarSub(this, 's-info')">INFO</button>
                <button class="btn-sub" onclick="mostrarSub(this, 's-auto')">AUTO</button>
                <button class="btn-sub" onclick="mostrarSub(this, 's-fondo')">FONDO</button>
            </div>

            <div id="s-info" class="section-content">
                <p><b>Nombre:</b> ${c.nombre} ${c.apellido}</p>
                <p><b>Teléfono:</b> ${c.telefono}</p>
            </div>

            <div id="s-auto" class="section-content">
                <img src="${c.foto_carro || ''}" style="width:100%; border-radius:8px;">
                <p><b>Auto:</b> ${c.marca_carro} ${c.modelo_carro} - ${c.color_carro}</p>
                <p><b>Aire:</b> ${c.tiene_aire_acondicionado ? '✅ Sí' : '❌ No'}</p>
            </div>

            <div id="s-fondo" class="section-content">
                <button class="btn-action btn-green" style="width:100%; margin-bottom:10px;" onclick="formAgregarFondo('${c.id}')">+ Agregar</button>
                <button class="btn-action btn-red" style="width:100%; margin-bottom:10px;" onclick="formRetirarFondo('${c.id}')">- Retirar</button>
                <button class="btn-action btn-gold" style="width:100%;" onclick="rectificarFondo('${c.id}')">🔄 Rectificar</button>
            </div>
        `;
        document.getElementById('modalDetalle').style.display = 'block';
    }

    function mostrarSub(btn, id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.btn-sub').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function cerrarModal() { document.getElementById('modalDetalle').style.display = 'none'; }

    // --- Lógica de Fondos y Tarjetas ---
    async function formAgregarFondo(id) {
        // Necesitamos cargar tarjetas
        const { data: tarjetas } = await supabaseClient.from('tarjetas').select('*');
        
        document.getElementById('contenidoModal').innerHTML = `
            <h3>Agregar Fondo</h3>
            <label>Método</label>
            <select id="metodoPago" onchange="toggleTarjetas()">
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
            </select>
            
            <div id="containerTarjetas" style="display:none;">
                <label>Tarjeta</label>
                <select id="tarjetaSelect">
                    ${tarjetas.map(t => `<option value="${t.id}">${t.numero} - ${t.nombre}</option>`).join('')}
                </select>
            </div>
            
            <label>Cantidad</label>
            <input type="number" id="cantidadFondo" placeholder="0.00">
            <button class="btn-action btn-green" style="width:100%" onclick="procesarFondo('${id}', 'agregar')">PROCESAR</button>
        `;
    }

    function toggleTarjetas() {
        const metodo = document.getElementById('metodoPago').value;
        document.getElementById('containerTarjetas').style.display = metodo === 'Transferencia' ? 'block' : 'none';
    }

    async function procesarFondo(choferId, tipo) {
        const cantidad = parseFloat(document.getElementById('cantidadFondo').value);
        if (!cantidad || cantidad <= 0) return alert("Cantidad inválida");

        // 1. Obtener fondo actual
        const { data: chofer } = await supabaseClient.from('choferes').select('fondo_actual').eq('id', choferId).single();
        const fondoAnterior = chofer.fondo_actual;
        const nuevoFondo = tipo === 'agregar' ? fondoAnterior + cantidad : fondoAnterior - cantidad;

        // 2. Insertar en historial_fondos
        const { error: errorHistorial } = await supabaseClient.from('historial_fondos').insert([{
            chofer_id: choferId,
            metodo: document.getElementById('metodoPago').value,
            saldo: cantidad, // Cantidad que entra/sale
            fondo_anterior: fondoAnterior,
            activo: nuevoFondo, // Fondo resultante
            usuario: 'Gestor' // O obtener del localStorage
        }]);

        // 3. Actualizar chofer
        const { error: errorChofer } = await supabaseClient.from('choferes').update({ fondo_actual: nuevoFondo }).eq('id', choferId);

        if (!errorHistorial && !errorChofer) {
            alert("Operación exitosa");
            cerrarModal();
            cargarChoferes();
        }
    }

    // --- Eliminación ---
    async function eliminarChofer(id) {
        if (!confirm("¿Está seguro de eliminar este chofer?")) return;
        const { error } = await supabaseClient.from('choferes').delete().eq('id', id);
        if (!error) {
            cerrarModal();
            cargarChoferes();
        }
    }

    document.addEventListener('DOMContentLoaded', cargarChoferes);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #28a745; --rojo: #dc3545; --azul: #007bff; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 10px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-embudo { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--dorado); }
        #filtroArea { display: none; margin-bottom: 15px; }
        #filtroArea input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--dorado); background: var(--gris); color: white; box-sizing: border-box; }

        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow: hidden; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 8px; color: var(--dorado); font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 15px 8px; border-bottom: 1px solid #222; font-size: 13px; }
        .puntos { color: var(--dorado); font-weight: bold; font-size: 22px; cursor: pointer; text-align: center; width: 30px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { background: var(--gris); margin: 2% auto; padding: 20px; width: 95%; max-width: 500px; border-radius: 15px; border: 1px solid var(--dorado); box-sizing: border-box; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--dorado); font-size: 11px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }

        .foto-detalle { width: 100%; height: 280px; object-fit: cover; border-radius: 12px; border: 2px solid var(--dorado); margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-item { background: #000; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .stat-item span { display: block; font-size: 10px; color: var(--dorado); margin-bottom: 5px; }

        .tabs-container { display: flex; background: #000; padding: 5px; border-radius: 10px; margin: 20px 0; gap: 5px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; min-width: 80px; }
        .tab-btn.active { background: var(--dorado); color: black; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn-full { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .btn-verde { background: var(--verde); color: white; }
        .btn-rojo { background: var(--rojo); color: white; }
        .btn-azul { background: var(--azul); color: white; }
        .btn-gris { background: #555; color: white; }
    </style>
</head>
<body>

<div class="header">
    <button class="btn-add" onclick="abrirModal('modalRegistro')">+ AÑADIR CHÓFER</button>
    <button class="btn-embudo" onclick="toggleFiltro()">⏳</button>
</div>

<div id="filtroArea"><input type="text" id="busqueda" placeholder="Buscar..." onkeyup="filtrar()"></div>

<div class="tabla-contenedor">
    <table>
        <thead><tr><th>Nombre</th><th>Teléfono</th><th>Lic.</th><th>Fondo</th><th></th></tr></thead>
        <tbody id="lista-choferes"></tbody>
    </table>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); margin-top:0;">Nuevo Chófer</h2>
        <div class="form-group"><label>Foto Chófer</label><input type="file" id="reg-foto-chofer"></div>
        <div class="form-group"><input type="text" id="reg-nom" placeholder="Nombre"></div>
        <div class="form-group"><input type="text" id="reg-ape" placeholder="Apellido"></div>
        <div class="form-group"><input type="tel" id="reg-tel" placeholder="Teléfono"></div>
        <div style="margin-bottom:15px; font-size:12px;">
            <label><input type="checkbox" id="reg-lic"> Licencia Operativa</label><br><br>
            <label style="color:var(--dorado)"><input type="checkbox" id="reg-libre"> TRABAJAR SIN CRÉDITOS</label>
        </div>
        <div class="form-group"><label>Foto Carro</label><input type="file" id="reg-foto-carro"></div>
        <div class="form-group"><input type="text" id="reg-marca" placeholder="Marca"></div>
        <div class="form-group"><input type="text" id="reg-modelo" placeholder="Modelo"></div>
        <div class="form-group"><input type="text" id="reg-color" placeholder="Color"></div>
        <div class="form-group"><label><input type="checkbox" id="reg-aire"> Aire Acondicionado</label></div>
        <button class="btn-full btn-verde" onclick="guardarNuevoChofer()">PROCESAR REGISTRO</button>
        <button onclick="cerrarModal('modalRegistro')" style="width:100%; background:none; color:#888; border:none;">Cancelar</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div id="detalle-chofer" class="modal-content"></div>
</div>

<div id="modalEditar" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); margin-top:0;">Editar Chófer</h2>
        <div class="form-group"><label>Cambiar Foto Chófer</label><input type="file" id="edit-foto-chofer"></div>
        <div class="form-group"><label>Nombre</label><input type="text" id="edit-nom"></div>
        <div class="form-group"><label>Apellido</label><input type="text" id="edit-ape"></div>
        <div class="form-group"><label>Teléfono</label><input type="tel" id="edit-tel"></div>
        <div style="margin-bottom:15px; font-size:12px;">
            <label><input type="checkbox" id="edit-lic"> Licencia Operativa</label><br><br>
            <label><input type="checkbox" id="edit-libre"> Trabajar sin Créditos</label>
        </div>
        <div class="form-group"><label>Cambiar Foto Carro</label><input type="file" id="edit-foto-carro"></div>
        <div class="form-group"><label>Marca</label><input type="text" id="edit-marca"></div>
        <div class="form-group"><label>Modelo</label><input type="text" id="edit-modelo"></div>
        <div class="form-group"><label>Color</label><input type="text" id="edit-color"></div>
        <div class="form-group"><label><input type="checkbox" id="edit-aire"> Aire Acondicionado</label></div>
        <button class="btn-full btn-verde" onclick="actualizarChofer()">GUARDAR CAMBIOS</button>
        <button onclick="cerrarModal('modalEditar')" style="width:100%; background:none; color:#888; border:none;">Cancelar</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    let choferSel = null;

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleFiltro() { 
        const f = document.getElementById('filtroArea');
        f.style.display = f.style.display === 'block' ? 'none' : 'block';
    }

    async function cargarChoferes() {
        const { data } = await supabaseClient.from('choferes').select('*').order('nombre');
        const tbody = document.getElementById('lista-choferes');
        tbody.innerHTML = data.map(c => `
            <tr>
                <td><b>${c.nombre}</b></td>
                <td>${c.telefono}</td>
                <td>${c.tiene_licencia_operativa ? '✅' : '❌'}</td>
                <td style="color:var(--dorado)">$${c.fondo_actual}</td>
                <td class="puntos" onclick="verChofer('${c.id}')">⋮</td>
            </tr>
        `).join('');
    }

    async function verChofer(id) {
        const { data: c } = await supabaseClient.from('choferes').select('*').eq('id', id).single();
        choferSel = c;
        const content = document.getElementById('detalle-chofer');
        content.innerHTML = `
            <img src="${c.foto_chofer || ''}" class="foto-detalle">
            <h2 style="margin:0;">${c.nombre} ${c.apellido}</h2>
            <p style="color:var(--dorado); font-size:12px;">● Sin créditos: ${c.libre_de_fondo ? 'SÍ' : 'NO'}</p>
            
            <div class="form-group">
                <label>Grupo</label>
                <div style="display:flex; gap:15px;">
                    <label><input type="radio" name="grupo" ${c.grupo === 'Motos' ? 'checked' : ''} onchange="actualizarGrupo('Motos')"> Motos</label>
                    <label><input type="radio" name="grupo" ${c.grupo === 'Autos' ? 'checked' : ''} onchange="actualizarGrupo('Autos')"> Autos</label>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span>FONDO</span><b>$${c.fondo_actual}</b></div>
                <div class="stat-item"><span>TOTAL</span><b>0</b></div>
            </div>

            <button class="btn-full btn-gris" onclick="prepararEdicion()">EDITAR DATOS</button>
            <button class="btn-full btn-verde" onclick="window.open('https://wa.me/${c.telefono}')">WHATSAPP</button>
            <button class="btn-full btn-rojo" onclick="eliminarChofer('${c.id}')">ELIMINAR</button>

            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab(event, 't-info')">INFO</button>
                <button class="tab-btn" onclick="switchTab(event, 't-auto')">AUTO</button>
                <button class="tab-btn" onclick="switchTab(event, 't-fondo')">FONDO</button>
            </div>

            <div id="t-info" class="tab-content active"><p>Tel: ${c.telefono}</p></div>
            <div id="t-auto" class="tab-content">
                <img src="${c.foto_carro || ''}" style="width:100%; border-radius:10px;">
                <p>${c.marca_carro} ${c.modelo_carro} (${c.color_carro})</p>
            </div>
            <div id="t-fondo" class="tab-content">
                <button class="tab-btn" style="background:var(--verde)" onclick="uiMov('agregar')">AGREGAR</button>
                <button class="tab-btn" style="background:var(--rojo)" onclick="uiMov('retirar')">RETIRAR</button>
                <div id="zona-movimiento" style="display:none; margin-top:10px;">
                    <input type="number" id="mov-cantidad" placeholder="Cantidad">
                    <button class="btn-full btn-verde" onclick="procesarMovimiento()">OK</button>
                </div>
                <div id="hist-list" style="font-size:10px; margin-top:10px;"></div>
            </div>
            <button onclick="cerrarModal('modalVer')" style="width:100%; background:none; color:#888; border:none; margin-top:20px;">Cerrar</button>
        `;
        abrirModal('modalVer');
        cargarHistorial(c.id);
    }

    function prepararEdicion() {
        document.getElementById('edit-nom').value = choferSel.nombre;
        document.getElementById('edit-ape').value = choferSel.apellido;
        document.getElementById('edit-tel').value = choferSel.telefono;
        document.getElementById('edit-lic').checked = choferSel.tiene_licencia_operativa;
        document.getElementById('edit-libre').checked = choferSel.libre_de_fondo;
        document.getElementById('edit-marca').value = choferSel.marca_carro;
        document.getElementById('edit-modelo').value = choferSel.modelo_carro;
        document.getElementById('edit-color').value = choferSel.color_carro;
        document.getElementById('edit-aire').checked = choferSel.tiene_aire_acondicionado;
        
        cerrarModal('modalVer');
        abrirModal('modalEditar');
    }

    async function actualizarChofer() {
        const upd = {
            nombre: document.getElementById('edit-nom').value,
            apellido: document.getElementById('edit-ape').value,
            telefono: document.getElementById('edit-tel').value,
            tiene_licencia_operativa: document.getElementById('edit-lic').checked,
            libre_de_fondo: document.getElementById('edit-libre').checked,
            marca_carro: document.getElementById('edit-marca').value,
            modelo_carro: document.getElementById('edit-modelo').value,
            color_carro: document.getElementById('edit-color').value,
            tiene_aire_acondicionado: document.getElementById('edit-aire').checked
        };
        const { error } = await supabaseClient.from('choferes').update(upd).eq('id', choferSel.id);
        if(!error) location.reload(); else alert(error.message);
    }

    async function actualizarGrupo(grupo) {
        await supabaseClient.from('choferes').update({ grupo: grupo }).eq('id', choferSel.id);
    }

    async function guardarNuevoChofer() {
        const { error } = await supabaseClient.from('choferes').insert([{
            nombre: document.getElementById('reg-nom').value,
            apellido: document.getElementById('reg-ape').value,
            telefono: document.getElementById('reg-tel').value,
            tiene_licencia_operativa: document.getElementById('reg-lic').checked,
            libre_de_fondo: document.getElementById('reg-libre').checked,
            marca_carro: document.getElementById('reg-marca').value,
            modelo_carro: document.getElementById('reg-modelo').value,
            color_carro: document.getElementById('reg-color').value,
            tiene_aire_acondicionado: document.getElementById('reg-aire').checked,
            fondo_actual: 0
        }]);
        if(!error) location.reload(); else alert(error.message);
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function uiMov(tipo) { tipoMov = tipo; document.getElementById('zona-movimiento').style.display = 'block'; }

    async function procesarMovimiento() {
        const cant = parseFloat(document.getElementById('mov-cantidad').value);
        const fNuevo = tipoMov === 'agregar' ? parseFloat(choferSel.fondo_actual) + cant : parseFloat(choferSel.fondo_actual) - cant;
        await supabaseClient.from('historial_fondos').insert([{
            chofer_id: choferSel.id,
            usuario: 'Admin',
            metodo: tipoMov === 'agregar' ? 'Efectivo' : 'Retiro',
            saldo: cant,
            fondo_anterior: choferSel.fondo_actual,
            activo: fNuevo
        }]);
        await supabaseClient.from('choferes').update({ fondo_actual: fNuevo }).eq('id', choferSel.id);
        location.reload();
    }

    async function cargarHistorial(id) {
        const { data } = await supabaseClient.from('historial_fondos').select('*').eq('chofer_id', id).order('fecha', {ascending:false});
        document.getElementById('hist-list').innerHTML = data.map(h => `<div>${h.metodo}: $${h.saldo} (${h.fecha.split('T')[0]})</div>`).join('');
    }

    function filtrar() {
        const val = document.getElementById('busqueda').value.toLowerCase();
        document.querySelectorAll('#lista-choferes tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none');
    }

    async function eliminarChofer(id) {
        if(confirm("¿Eliminar?")) { await supabaseClient.from('choferes').delete().eq('id', id); location.reload(); }
    }

    cargarChoferes();
</script>
</body>
</html>

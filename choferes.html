<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }

        /* --- ESTILOS DEL SIDEBAR (MENÚ DESLIZANTE) --- */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 4000; top: 0; left: 0;
            background-color: #1a1a1a; overflow-x: hidden;
            transition: 0.5s; padding-top: 60px;
            border-right: 1px solid var(--dorado);
        }
        .sidebar a {
            padding: 15px 25px; text-decoration: none;
            font-size: 14px; color: #bbb; display: block;
            transition: 0.3s; text-transform: uppercase; border-bottom: 1px solid #222;
        }
        .sidebar a:hover { color: var(--dorado); background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: var(--dorado); }

        /* --- HEADER --- */
        .header-nav-universal { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: #000; border-bottom: 1px solid var(--dorado);
        }
        .openbtn { font-size: 28px; cursor: pointer; background: none; border: none; color: var(--dorado); }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }
        .btn-reloj { background: var(--dorado); border-radius: 50%; width: 40px; height: 40px; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- CONTENIDO --- */
        .contenedor { padding: 20px; }
        h1 { color: var(--dorado); font-family: 'Playfair Display'; text-transform: uppercase; font-size: 22px; margin-bottom: 20px; }

        .btn-add { 
            background: var(--dorado); color: black; border: none; 
            padding: 15px; border-radius: 10px; font-weight: bold; 
            width: 100%; margin-bottom: 25px; cursor: pointer; text-transform: uppercase;
        }

        /* --- TARJETA CHOFER (Estilo Imagen 2) --- */
        .card-chofer {
            background: var(--gris); border-radius: 18px; padding: 15px;
            display: flex; align-items: center; gap: 15px; position: relative;
            border: 1px solid #333; margin-bottom: 15px;
        }
        .foto-perfil-mini {
            width: 70px; height: 70px; border-radius: 50%;
            border: 2px solid var(--dorado); object-fit: cover;
        }
        .info-card h3 { margin: 0; font-size: 18px; }
        .info-card p { margin: 2px 0; color: #aaa; font-size: 13px; }
        .info-card .licencia { font-size: 11px; color: var(--dorado); }
        .fondo-monto { 
            position: absolute; bottom: 15px; right: 15px; 
            color: var(--dorado); font-weight: bold; font-size: 18px; 
        }
        .puntos-opciones { position: absolute; top: 15px; right: 15px; color: var(--dorado); cursor: pointer; font-size: 20px; }

        /* MODALES */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--gris); border-radius: 15px; padding: 20px; border: 1px solid var(--dorado); max-width: 500px; margin: auto; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--dorado); margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="panel.html">Panel de Control</a>
    <a href="crear-viaje.html">Crear Viajes</a>
    <a href="mis-viajes.html">Mis Viajes</a>
    <a href="choferes.html" style="color:var(--dorado)">Choferes</a>
    <a href="pagos-pendientes.html">Pagos Pendientes</a>
    <a href="usuarios.html">Usuarios</a>
    <hr style="border:0.1px solid #333; margin:10px 20px;">
    <a href="#" onclick="cerrarSesion()" style="color: #ff4d4d;">Cerrar Sesión</a>
</div>

<div class="header-nav-universal">
    <button class="openbtn" onclick="openNav()">&#9776;</button>
    <div class="logo-txt-universal">RF <span style="color: var(--dorado); font-size: 14px;">TransGestión</span></div>
    <button class="btn-reloj" onclick="mostrarBusqueda()">⏳</button>
</div>

<div class="contenedor">
    <h1>Choferes</h1>
    
    <button class="btn-add" onclick="abrirModal('modalNuevo')">+ AÑADIR NUEVO CHÓFER</button>

    <div id="busqueda-container" style="display:none; margin-bottom:20px;">
        <input type="text" id="inputBuscar" placeholder="Buscar por nombre o teléfono..." oninput="filtrar()">
    </div>

    <div id="lista-choferes">
        <div class="card-chofer">
            <img src="https://via.placeholder.com/100" class="foto-perfil-mini">
            <div class="info-card">
                <h3>Pepe Sánchez</h3>
                <p>52826284</p>
                <p class="licencia">Sin Licencia</p>
            </div>
            <div class="puntos-opciones">⋮</div>
            <div class="fondo-monto">$2527.50</div>
        </div>
    </div>
</div>

<div id="modalNuevo" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--dorado); text-align:center;">NUEVO CHOFER</h2>
        <div class="field"><label>Nombre</label><input type="text" id="nom"></div>
        <div class="field"><label>Teléfono</label><input type="tel" id="tel"></div>
        <div class="field"><label>Foto Chofer</label><input type="file" accept="image/*"></div>
        <button class="btn-add" onclick="cerrarModal('modalNuevo')">GUARDAR</button>
        <button class="btn-add" style="background:#333; color:white;" onclick="cerrarModal('modalNuevo')">CANCELAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    // Lógica del Menú
    function openNav() { document.getElementById("mySidebar").style.width = "280px"; }
    function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    function mostrarBusqueda() {
        const div = document.getElementById('busqueda-container');
        div.style.display = div.style.display === 'none' ? 'block' : 'none';
    }

    // El resto de tu lógica de Supabase iría aquí...
</script>
</body>
</html>

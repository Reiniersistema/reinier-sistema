<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprobaciones - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #28a745; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 50px; }
        .contenedor-principal { padding: 20px; }
        h2 { color: var(--dorado); font-size: 14px; text-transform: uppercase; border-left: 4px solid var(--dorado); padding-left: 10px; margin-top: 30px; }
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow: hidden; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--dorado); font-size: 10px; background: #1a1a1a; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 12px; }
        .btn-aprobar { background: var(--verde); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 10px; }
        .btn-eliminar { background: var(--rojo); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; font-size: 10px; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <h2>1. Nuevos Choferes</h2>
    <div class="tabla-contenedor">
        <table>
            <thead><tr><th>Nombre</th><th>Acciones</th></tr></thead>
            <tbody id="lista-choferes-pendientes"></tbody>
        </table>
    </div>

    <h2>2. Transferencias por Aprobar</h2>
    <div class="tabla-contenedor">
        <table>
            <thead><tr><th>Chófer</th><th>Monto</th><th>Método</th><th>Acciones</th></tr></thead>
            <tbody id="lista-pagos-pendientes"></tbody>
        </table>
    </div>
</div>

<script src="config.js"></script>
<script>
    async function cargarTodo() {
        // Choferes
        const { data: chs } = await supabaseClient.from('choferes').select('*').eq('aprobado', false);
        document.getElementById('lista-choferes-pendientes').innerHTML = (chs || []).map(c => `<tr><td>${c.nombre}</td><td><button class="btn-aprobar" onclick="aprobarCh(${c.id})">ACTIVAR</button></td></tr>`).join('');

        // Transferencias
        const { data: pgs } = await supabaseClient.from('transferencias').select('*').eq('aprobado', false);
        document.getElementById('lista-pagos-pendientes').innerHTML = (pgs || []).map(p => `
            <tr>
                <td><b>${p.nombre_chofer}</b></td>
                <td style="color:var(--dorado)">$${p.monto}</td>
                <td style="font-size:10px;">${p.tipo_pago}</td>
                <td>
                    <button class="btn-aprobar" onclick="aprobarPg(${p.id}, '${p.nombre_chofer}', ${p.monto})">OK</button>
                    <button class="btn-eliminar" onclick="borrar('transferencias', ${p.id})">X</button>
                </td>
            </tr>`).join('');
    }

    async function aprobarCh(id) {
        await supabaseClient.from('choferes').update({ aprobado: true }).eq('id', id);
        cargarTodo();
    }

    async function aprobarPg(pagoId, nombre, monto) {
        // 1. Buscar al chófer por nombre (usamos ilike para que no importe mayúsculas/minúsculas)
        const { data: chofer } = await supabaseClient.from('choferes').select('*').ilike('nombre', `%${nombre}%`).maybeSingle();

        if (!chofer) return alert("No se encontró al chófer: " + nombre);

        const nuevoF = (chofer.fondo_actual || 0) + monto;
        const admin = JSON.parse(localStorage.getItem('usuario_activo'))?.nombre || "Admin";

        // Actualizar fondo, historial y marcar transferencia
        await supabaseClient.from('choferes').update({ fondo_actual: nuevoF }).eq('id', chofer.id);
        await supabaseClient.from('transferencias').update({ aprobado: true }).eq('id', pagoId);
        await supabaseClient.from('historial_fondos').insert([{ chofer_id: chofer.id, usuario: admin, metodo: 'Transf. Aprobada', saldo: monto, fondo_anterior: chofer.fondo_actual, activo: nuevoF }]);
        
        alert("Aprobado correctamente");
        cargarTodo();
    }

    async function borrar(tabla, id) { if(confirm("¿Eliminar?")) { await supabaseClient.from(tabla).delete().eq('id', id); cargarTodo(); } }

    cargarTodo();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprobaciones - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --verde: #28a745; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        h2 { color: var(--dorado); font-size: 16px; text-transform: uppercase; margin-top: 30px; border-left: 4px solid var(--dorado); padding-left: 10px; }
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow: hidden; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 10px; color: var(--dorado); font-size: 10px; background: #1a1a1a; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 12px; }
        .btn-aprobar { background: var(--verde); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-eliminar { background: var(--rojo); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

    <h2>1. Nuevos Choferes (Por activar)</h2>
    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-choferes-pendientes"></tbody>
        </table>
    </div>

    <h2>2. Recargas de Fondos (Transferencias/Efectivo)</h2>
    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Chófer/ID</th>
                    <th>Monto</th>
                    <th>Método</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-pagos-pendientes"></tbody>
        </table>
    </div>

<script src="config.js"></script>
<script>
    async function cargarTodo() {
        // Cargar Choferes no aprobados
        const { data: choferes } = await supabaseClient.from('choferes').select('*').eq('aprobado', false);
        document.getElementById('lista-choferes-pendientes').innerHTML = choferes.map(c => `
            <tr>
                <td>${c.nombre}</td>
                <td>${c.telefono}</td>
                <td>
                    <button class="btn-aprobar" onclick="aprobarChofer(${c.id})">APROBAR</button>
                    <button class="btn-eliminar" onclick="borrarRegistro('choferes', ${c.id})">ELIMINAR</button>
                </td>
            </tr>
        `).join('');

        // Cargar Transferencias no aprobadas
        const { data: pagos } = await supabaseClient.from('transferencias').select('*').eq('aprobado', false);
        document.getElementById('lista-pagos-pendientes').innerHTML = pagos.map(p => `
            <tr>
                <td><b>${p.nombre_chofer}</b></td>
                <td style="color:var(--dorado)">$${p.monto}</td>
                <td>${p.tipo_pago}</td>
                <td>
                    <button class="btn-aprobar" onclick="aprobarPago(${p.id}, '${p.nombre_chofer}', ${p.monto})">APROBAR</button>
                    <button class="btn-eliminar" onclick="borrarRegistro('transferencias', ${p.id})">ELIMINAR</button>
                </td>
            </tr>
        `).join('');
    }

    async function aprobarChofer(id) {
        await supabaseClient.from('choferes').update({ aprobado: true }).eq('id', id);
        alert("Chófer activado");
        cargarTodo();
    }

    async function aprobarPago(pagoId, identificador, monto) {
        // 1. Buscar al chófer por nombre o teléfono
        const { data: chofer } = await supabaseClient
            .from('choferes')
            .select('*')
            .or(`nombre.eq.${identificador},telefono.eq.${identificador}`)
            .single();

        if (!chofer) return alert("No se encontró al chófer en la base de datos para sumar el fondo.");

        // 2. Sumar fondo
        const nuevoFondo = chofer.fondo_actual + monto;
        await supabaseClient.from('choferes').update({ fondo_actual: nuevoFondo }).eq('id', chofer.id);

        // 3. Marcar pago como aprobado
        await supabaseClient.from('transferencias').update({ aprobado: true }).eq('id', pagoId);

        // 4. Historial
        await supabaseClient.from('historial_fondos').insert([{
            chofer_id: chofer.id, usuario: 'Admin', metodo: 'Recarga Aprobada',
            saldo: monto, fondo_anterior: chofer.fondo_actual, activo: nuevoFondo
        }]);

        alert("✅ Fondo actualizado con éxito");
        cargarTodo();
    }

    async function borrarRegistro(tabla, id) {
        if(confirm("¿Seguro que quieres eliminar este registro?")) {
            await supabaseClient.from(tabla).delete().eq('id', id);
            cargarTodo();
        }
    }

    cargarTodo();
</script>
</body>
</html>

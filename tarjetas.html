<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* ESTILOS DEL MENÚ UNIVERSAL */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 3000; top: 0; left: 0;
            background-color: #1e1e1e;
            overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid #d4af37;
        }
        .sidebar a {
            padding: 12px 24px; text-decoration: none;
            font-size: 15px; color: #818181;
            display: block; transition: 0.3s;
            text-transform: uppercase;
        }
        .sidebar a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #d4af37; }

        .header-nav-universal { 
            display: flex; align-items: center; gap: 15px; 
            padding: 15px; background: #121212; 
            border-bottom: 1px solid #d4af37; margin-bottom: 20px;
        }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }

        /* Estilos propios de la página */
        .contenedor-principal { padding: 0 15px; }
        .header-seccion { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        
        .btn-add-toggle { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; }

        /* Formulario */
        #formAdd { display: none; background: var(--gris); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--dorado); }
        label { display: block; font-size: 10px; color: var(--dorado); margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; }
        
        /* Tabla */
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 10px; color: var(--dorado); font-size: 10px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 14px; }

        .btn-del { background: none; border: none; color: var(--rojo); cursor: pointer; font-weight: bold; font-size: 20px; padding: 0 10px; }
        .tarjeta-num { font-family: 'Courier New', monospace; letter-spacing: 1px; color: #eee; font-size: 15px; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <div class="header-seccion">
        <h2>Tarjetas</h2>
        <button class="btn-add-toggle" onclick="toggleForm()">+ AÑADIR</button>
    </div>

    <div id="formAdd">
        <label>Número de Tarjeta</label>
        <input type="text" id="num-tarjeta" placeholder="0000 0000 0000 0000">
        
        <label>Titular / Banco / Descripción</label>
        <input type="text" id="nom-tarjeta" placeholder="Ej: Juan Pérez - BANMET">
        
        <div style="display:flex; gap:10px;">
            <button class="btn-add-toggle" onclick="guardarTarjeta()" style="flex:2;">GUARDAR TARJETA</button>
            <button class="btn-add-toggle" onclick="toggleForm()" style="flex:1; background:#444; color:white;">CANCELAR</button>
        </div>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Información de Cuenta</th>
                    <th style="width: 40px;"></th>
                </tr>
            </thead>
            <tbody id="lista-tarjetas">
                <tr><td colspan="2" style="text-align:center; padding:20px; color:#666;">Cargando tarjetas...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
    function toggleForm() {
        const f = document.getElementById('formAdd');
        f.style.display = (f.style.display === 'block') ? 'none' : 'block';
    }

    async function cargarTarjetas() {
        const { data, error } = await supabaseClient.from('tarjetas').select('*').order('created_at', { ascending: false });
        
        const tbody = document.getElementById('lista-tarjetas');
        if (error) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:20px;">Error al cargar datos.</td></tr>`;
            return;
        }

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:20px; color:#888;">No hay tarjetas registradas.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(t => `
            <tr>
                <td>
                    <span class="tarjeta-num">${t.numero}</span><br>
                    <small style="color:var(--dorado); text-transform:uppercase; font-size:10px; font-weight:bold;">${t.nombre}</small>
                </td>
                <td style="text-align:right;">
                    <button class="btn-del" onclick="eliminarTarjeta(${t.id})">&times;</button>
                </td>
            </tr>
        `).join('');
    }

    async function guardarTarjeta() {
        const num = document.getElementById('num-tarjeta').value.trim();
        const nom = document.getElementById('nom-tarjeta').value.trim();

        if(!num || !nom) return alert("Por favor, completa todos los campos.");

        const { error } = await supabaseClient.from('tarjetas').insert([{ numero: num, nombre: nom }]);

        if(!error) {
            document.getElementById('num-tarjeta').value = "";
            document.getElementById('nom-tarjeta').value = "";
            toggleForm();
            cargarTarjetas();
        } else {
            alert("Error al guardar: " + error.message);
        }
    }

    async function eliminarTarjeta(id) {
        if(confirm("¿Estás seguro de que deseas eliminar esta tarjeta de la lista?")) {
            const { error } = await supabaseClient.from('tarjetas').delete().eq('id', id);
            if(!error) {
                cargarTarjetas();
            } else {
                alert("Error al eliminar: " + error.message);
            }
        }
    }

    cargarTarjetas();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Viaje - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .form-container { max-width: 600px; margin: auto; background: var(--gris); padding: 20px; border-radius: 15px; }
        h2 { color: var(--dorado); text-align: center; text-transform: uppercase; font-size: 18px; }
        
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--dorado); margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        
        .row { display: flex; gap: 10px; align-items: flex-end; }
        .btn-action { background: var(--dorado); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .info-chofer { background: #000; padding: 10px; margin-top: 10px; border-radius: 8px; display: none; border-left: 3px solid var(--dorado); }
        .calculadora { background: #252525; padding: 15px; border-radius: 8px; margin-top: 10px; }
        
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .check-item { display: flex; align-items: center; font-size: 13px; }
        .check-item input { width: auto; margin-right: 10px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .planilla-box { background: white; color: black; padding: 20px; border-radius: 10px; margin-bottom: 20px; white-space: pre-wrap; font-family: monospace; }
        .btn-ws { background: #25d366; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Elaborar Viaje</h2>

    <div class="field">
        <label>Colaboración</label>
        <select id="colaboracion">
            <option value="Ninguna">Ninguna</option>
            <option value="Colaboración A">Colaboración A</option>
            <option value="Colaboración B">Colaboración B</option>
        </select>
    </div>

    <div class="field">
        <label>Chofer (Teléfono)</label>
        <div class="row">
            <input type="tel" id="tel-chofer" placeholder="5XXXXXXX">
            <button class="btn-action" onclick="buscarChofer()">BUSCAR</button>
        </div>
        <div id="res-chofer" class="info-chofer"></div>
    </div>

    <div class="field">
        <label>Cliente (Teléfono)</label>
        <input type="tel" id="tel-cliente" placeholder="Número del cliente">
    </div>

    <div class="field">
        <label>Precio</label>
        <input type="number" id="precio-final" placeholder="Precio total">
        <div class="calculadora">
            <p style="font-size: 11px; margin: 0 0 10px 0;">CALCULADORA POR KM</p>
            <div class="row">
                <input type="number" id="tarifa" placeholder="Tarifa">
                <input type="number" id="distancia" placeholder="KM">
                <button class="btn-action" onclick="calcularPrecio()">CALCULAR</button>
            </div>
        </div>
    </div>

    <div class="field">
        <label>Pasajeros (PAX)</label>
        <input type="number" id="pax" value="1">
    </div>

    <div class="field">
        <label>Origen</label>
        <input type="text" id="origen">
        <button class="btn-action" style="margin-top:5px; font-size:10px;" onclick="addParada()">+ AÑADIR PARADA</button>
        <div id="contenedor-paradas"></div>
    </div>

    <div class="field">
        <label>Destino</label>
        <input type="text" id="destino">
    </div>

    <div class="field">
        <label>Grupo de WhatsApp</label>
        <input type="text" id="grupo">
    </div>

    <div class="checkbox-group">
        <div class="check-item"><input type="checkbox" id="pago_transf"> Pago Transf.</div>
        <div class="check-item"><input type="checkbox" id="aire"> Aire Acond.</div>
        <div class="check-item"><input type="checkbox" id="ida_vuelta"> Ida y Vuelta</div>
        <div class="check-item"><input type="checkbox" id="reservado" onchange="toggleReserva()"> Reservado</div>
    </div>

    <div id="seccion-reserva" style="display:none;" class="field">
        <label>Fecha y Hora</label>
        <input type="datetime-local" id="fecha-reserva">
    </div>

    <div class="field">
        <label>Observación</label>
        <textarea id="observacion" rows="3"></textarea>
    </div>

    <div class="row">
        <button class="btn-action" style="background:#444; flex:1;" onclick="generarPlanillas()">PLANILLA</button>
        <button class="btn-action" style="flex:1;" onclick="crearViaje()">CREAR VIAJE</button>
    </div>
</div>

<div id="modalPlanillas" class="modal">
    <button onclick="document.getElementById('modalPlanillas').style.display='none'" style="color:white; background:red; border:none; padding:10px; margin-bottom:20px;">CERRAR</button>
    
    <h3>Planilla para el Chofer</h3>
    <div id="p-chofer" class="planilla-box"></div>
    <button class="btn-ws" onclick="enviarWS('chofer')">Enviar a WhatsApp Chofer</button>

    <h3>Planilla para el Cliente</h3>
    <div id="p-cliente" class="planilla-box"></div>
    <button class="btn-ws" onclick="enviarWS('cliente')">Enviar a WhatsApp Cliente</button>

    <h3>Resumen de Datos</h3>
    <div id="p-resumen" class="planilla-box"></div>
    <button class="btn-ws" style="background:var(--dorado)" onclick="copiarResumen()">Copiar Resumen</button>
</div>

<script src="config.js"></script>
<script>
    let choferData = null;

    async function buscarChofer() {
        const tel = document.getElementById('tel-chofer').value;
        const { data, error } = await supabaseClient.from('choferes').select('*').eq('telefono', tel).single();
        if (data) {
            choferData = data;
            const res = document.getElementById('res-chofer');
            res.style.display = 'block';
            res.innerHTML = `<b>${data.nombre}</b><br>Auto: ${data.tipo_vehiculo} (${data.color})<br>Fondo: ${data.fondo_actual}`;
        } else { alert("Chofer no encontrado"); }
    }

    function calcularPrecio() {
        const t = document.getElementById('tarifa').value;
        const d = document.getElementById('distancia').value;
        document.getElementById('precio-final').value = t * d;
    }

    function addParada() {
        const input = document.createElement('input');
        input.className = 'parada-extra';
        input.placeholder = 'Parada intermedia';
        input.style.marginTop = '5px';
        document.getElementById('contenedor-paradas').appendChild(input);
    }

    function toggleReserva() {
        document.getElementById('seccion-reserva').style.display = document.getElementById('reservado').checked ? 'block' : 'none';
    }

    function generarPlanillas() {
        const datos = {
            precio: document.getElementById('precio-final').value,
            cliente: document.getElementById('tel-cliente').value,
            origen: document.getElementById('origen').value,
            destino: document.getElementById('destino').value,
            pax: document.getElementById('pax').value,
            fondo: choferData ? choferData.fondo_actual : 'N/A',
            chofer: choferData ? choferData.nombre : 'N/A',
            auto: choferData ? choferData.tipo_vehiculo : 'N/A',
            color: choferData ? choferData.color : 'N/A',
            obs: document.getElementById('observacion').value
        };

        // Lógica Planilla Chofer
        let txtChofer = `*DATOS DEL VIAJE*\nPrecio: ${datos.precio}\nCliente: ${datos.cliente}\nOrigen: ${datos.origen}\nDestino: ${datos.destino}\nPax: ${datos.pax}\nFondo Actual: ${datos.fondo}`;
        if(datos.obs) txtChofer += `\nObs: ${datos.obs}`;
        txtChofer += `\n\n⚠️ IMPORTANTE ⚠️\n• Máximo 15 min para recoger.\n• 15 min de cortesía al cliente, luego 25 cup/min.\n• Retraso descuenta 50%.\n• Mantenga el auto limpio.`;
        
        document.getElementById('p-chofer').innerText = txtChofer;

        // Lógica Planilla Cliente
        let txtCliente = `*Taxi En Camino*\nPrecio: ${datos.precio}\nChofer: ${datos.chofer}\nAuto: ${datos.auto}\nColor: ${datos.color}`;
        txtCliente += `\n\n⚠️ *IMPORTANTE* ⚠️\n• Paradas extras modifican costo.\n• 10 min de cortesía, luego 25 cup/min.\n• Cancelar en el lugar cuesta 50% del servicio.`;
        
        document.getElementById('p-cliente').innerText = txtCliente;

        // Resumen simple
        let resumen = "";
        for (let key in datos) { if(datos[key] && datos[key] !== 'N/A') resumen += `${key.toUpperCase()}: ${datos[key]}\n`; }
        document.getElementById('p-resumen').innerText = resumen;

        document.getElementById('modalPlanillas').style.display = 'block';
    }

    function enviarWS(tipo) {
        const num = tipo === 'chofer' ? document.getElementById('tel-chofer').value : document.getElementById('tel-cliente').value;
        const msg = encodeURIComponent(document.getElementById(tipo === 'chofer' ? 'p-chofer' : 'p-cliente').innerText);
        window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
    }

    async function crearViaje() {
        // Aquí irá el código para insertar en Supabase (tabla viajes)
        alert("Viaje creado con éxito (Lógica de guardado pendiente)");
    }
</script>
</body>
</html>

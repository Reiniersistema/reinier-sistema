<script>
        let datosChoferActual = null;

        async function buscarChofer() {
            const tel = document.getElementById('tel_chofer').value;
            const { data, error } = await supabaseClient.from('choferes').select('*').eq('telefono', tel).single();
            
            if (data) {
                datosChoferActual = data;
                document.getElementById('c_nombre').innerText = data.nombre;
                document.getElementById('c_auto').innerText = `${data.auto_marca} (${data.auto_color})`;
                document.getElementById('c_fondo').innerText = `$${data.fondo_actual.toFixed(2)}`;
                document.getElementById('info_chofer').classList.remove('hidden');
            } else {
                alert("Chofer no encontrado.");
            }
        }

        function calcularPrecio() {
            const tarifa = document.getElementById('calc_tarifa').value;
            const km = document.getElementById('calc_km').value;
            if(tarifa && km) {
                document.getElementById('precio_viaje').value = (tarifa * km).toFixed(2);
            }
        }

        function añadirParada() {
            const div = document.createElement('div');
            div.className = "flex items-center gap-2";
            div.innerHTML = `<input type="text" placeholder="Parada Intermedia..." class="bg-slate-50 p-2 rounded-lg text-sm flex-1 font-bold">
                             <button onclick="this.parentElement.remove()" class="text-red-400 p-2"><i class="fas fa-times"></i></button>`;
            document.getElementById('paradas_contenedor').appendChild(div);
        }

        function toggleReserva() {
            document.getElementById('box_reserva').classList.toggle('hidden', !document.getElementById('check_reserva').checked);
        }

        function generarPlanilla() {
            if(!datosChoferActual || !document.getElementById('precio_viaje').value) {
                alert("Primero busca un chofer e ingresa el precio.");
                return;
            }

            const precio = document.getElementById('precio_viaje').value;
            const cliente = document.getElementById('tel_cliente').value;
            const origen = document.getElementById('origen').value;
            const destino = document.getElementById('destino').value;
            
            const pChofer = `*DATOS DEL VIAJE*\nPrecio: ${precio}\nCliente: ${cliente}\nOrigen: ${origen}\nDestino: ${destino}\nFondo Actual: $${datosChoferActual.fondo_actual.toFixed(2)}`;
            const pCliente = `*Taxi En Camino*\nPrecio: ${precio}\nChofer: ${datosChoferActual.nombre}\nAuto: ${datosChoferActual.auto_marca}`;

            document.getElementById('txt_planilla_chofer').innerText = pChofer;
            document.getElementById('txt_planilla_cliente').innerText = pCliente;
            document.getElementById('seccion_planillas').classList.remove('hidden');
        }

        function enviarWA(tipo) {
            const texto = tipo === 'chofer' ? document.getElementById('txt_planilla_chofer').innerText : document.getElementById('txt_planilla_cliente').innerText;
            const tel = tipo === 'chofer' ? document.getElementById('tel_chofer').value : document.getElementById('tel_cliente').value;
            window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`, '_blank');
        }

        // --- CÓDIGO ACTUALIZADO PARA TU TABLA VIAJES ---
        async function crearViaje() {
            const precio = parseFloat(document.getElementById('precio_viaje').value);
            if (!datosChoferActual || isNaN(precio)) return alert("Primero busca un chofer e ingresa el precio.");

            // Lógica de comisión: 12% si tiene licencia, 15% si no
            const comision = datosChoferActual.lic_operativa ? 0.12 : 0.15;
            const costoComision = precio * comision;

            // Bloqueo por falta de saldo
            if (datosChoferActual.fondo_actual < costoComision && !datosChoferActual.trabajar_sin_credito) {
                return alert("Fondo insuficiente. Comisión requerida: $" + costoComision.toFixed(2));
            }

            const nuevoViaje = {
                chofer_tel: datosChoferActual.telefono,
                cliente_tel: document.getElementById('tel_cliente').value,
                precio: precio,
                origen: document.getElementById('origen').value,
                destino: document.getElementById('destino').value,
                pax: parseInt(document.getElementById('pax').value) || 1,
                colaboracion: document.getElementById('colaboracion').value,
                grupo_whatsapp: document.getElementById('grupo').value,
                pago_transferencia: document.getElementById('check_transfer').checked,
                aire_acondicionado: document.getElementById('check_aire').checked,
                ida_vuelta: document.getElementById('check_regreso').checked,
                es_reserva: document.getElementById('check_reserva').checked,
                fecha_reserva: document.getElementById('check_reserva').checked ? document.getElementById('fecha_reserva').value : null,
                observacion: document.getElementById('observacion').value,
                paradas: Array.from(document.querySelectorAll('#paradas_contenedor input')).map(i => i.value).join(', ')
            };

            const { error: errorViaje } = await supabaseClient.from('viajes').insert([nuevoViaje]);
            
            if (!errorViaje) {
                const nuevoFondo = datosChoferActual.fondo_actual - costoComision;
                await supabaseClient.from('choferes').update({ fondo_actual: nuevoFondo }).eq('id', datosChoferActual.id);
                
                alert("✅ Viaje registrado. Comisión de $" + costoComision.toFixed(2) + " descontada.");
                window.location.href = 'panel.html';
            } else {
                alert("Error al guardar: " + errorViaje.message);
            }
        }
    </script>

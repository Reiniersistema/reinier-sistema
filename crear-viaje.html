<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Viaje - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* ESTILOS DEL MENÚ UNIVERSAL */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 3000; top: 0; left: 0;
            background-color: #1e1e1e;
            overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid #d4af37;
        }
        .sidebar a {
            padding: 12px 24px; text-decoration: none;
            font-size: 15px; color: #818181;
            display: block; transition: 0.3s;
            text-transform: uppercase;
        }
        .sidebar a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #d4af37; }

        .header-nav-universal { 
            display: flex; align-items: center; gap: 15px; 
            padding: 15px; background: #121212; 
            border-bottom: 1px solid #d4af37; margin-bottom: 20px;
        }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }

        /* Estilos propios de la página */
        .contenedor-principal { padding: 0 15px; }
        .form-container { max-width: 600px; margin: auto; background: var(--gris); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        h2 { color: var(--dorado); text-align: center; text-transform: uppercase; font-size: 18px; margin-bottom: 20px; margin-top: 0; }
        
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 11px; color: var(--dorado); margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; }
        
        .row { display: flex; gap: 10px; align-items: flex-end; }
        .btn-action { background: var(--dorado); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; color: black; transition: 0.3s; }
        
        .info-chofer { background: #080808; padding: 15px; margin-top: 10px; border-radius: 8px; display: none; border-left: 4px solid var(--dorado); font-size: 14px; line-height: 1.6; }
        .calculadora { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px dashed #444; }
        
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .check-item { display: flex; align-items: center; font-size: 12px; color: #ccc; }
        .check-item input { width: auto; margin-right: 8px; cursor: pointer; }

        .tipo-colab-group { display: none; gap: 10px; margin-top: 10px; }
        .btn-tipo { flex: 1; background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-tipo.active { background: var(--dorado); color: black; border-color: var(--dorado); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; padding: 20px; box-sizing: border-box; z-index: 4000; }
        .planilla-box { background: white; color: black; padding: 20px; border-radius: 10px; margin-bottom: 15px; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.3; }
        .btn-ws { background: #25d366; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-weight: bold; margin-bottom: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <div class="form-container">
        <h2>Elaborar Viaje</h2>

        <div class="field">
            <label>Colaboración</label>
            <select id="colaboracion" onchange="actualizarInterfazColab()">
                <option value="">Cargando agencias...</option>
            </select>
            <div id="tipo-colab-container" class="tipo-colab-group">
                <button id="btn-entrada" class="btn-tipo" onclick="seleccionarTipo('Entrada')">ENTRADA</button>
                <button id="btn-salida" class="btn-tipo" onclick="seleccionarTipo('Salida')">SALIDA</button>
            </div>
        </div>

        <div class="field" id="campo-cliente">
            <label>Cliente (Teléfono)</label>
            <input type="tel" id="tel-cliente" placeholder="Número del cliente">
        </div>

        <div class="field">
            <label>Chofer (Teléfono)</label>
            <div class="row">
                <input type="tel" id="tel-chofer" placeholder="Número del Chófer">
                <button class="btn-action" onclick="buscarChofer()">BUSCAR</button>
            </div>
            <div id="res-chofer" class="info-chofer"></div>
        </div>

        <div class="field">
            <label>Precio</label>
            <input type="number" id="precio-final" placeholder="Precio final">
            <div class="calculadora">
                <div class="row">
                    <input type="number" id="tarifa" placeholder="Tarifa">
                    <input type="number" id="distancia" placeholder="KM">
                    <button class="btn-action" onclick="calcularPrecio()">CALCULAR</button>
                </div>
            </div>
        </div>

        <div class="field">
            <label>Pasajeros (PAX)</label>
            <input type="number" id="pax" value="1">
        </div>

        <div class="field">
            <label>Origen</label>
            <input type="text" id="origen">
            <button class="btn-action" style="margin-top:8px; font-size:11px; background: #333; color: var(--dorado);" onclick="addParada()">+ AÑADIR PARADA</button>
            <div id="contenedor-paradas"></div>
        </div>

        <div class="field">
            <label>Destino</label>
            <input type="text" id="destino">
        </div>

        <div class="field">
            <label>Grupo de WhatsApp</label>
            <input type="text" id="grupo">
        </div>

        <div class="checkbox-group">
            <div class="check-item"><input type="checkbox" id="pago_transf"> Pago transferencia</div>
            <div class="check-item"><input type="checkbox" id="precio_cliente"> Precio cliente</div>
            <div class="check-item"><input type="checkbox" id="aire"> Aire acondicionado</div>
            <div class="check-item"><input type="checkbox" id="ida_vuelta"> Ida y vuelta</div>
            <div class="check-item"><input type="checkbox" id="reservado" onchange="toggleReserva()"> Viaje Reservado</div>
        </div>

        <div id="seccion-reserva" style="display:none;" class="field">
            <label>Fecha y Hora</label>
            <input type="datetime-local" id="fecha-reserva">
        </div>

        <div class="field">
            <label>Observación</label>
            <textarea id="observacion" rows="3"></textarea>
        </div>

        <div class="row">
            <button class="btn-action" style="background:#444; color: white; flex:1;" onclick="generarPlanillas()">PLANILLA</button>
            <button class="btn-action" style="flex:1;" onclick="crearViaje()">CREAR VIAJE</button>
        </div>
    </div>
</div>

<div id="modalPlanillas" class="modal">
    <div style="max-width:500px; margin:auto;">
        <button onclick="document.getElementById('modalPlanillas').style.display='none'" style="color:white; background:red; border:none; padding:12px; margin-bottom:20px; border-radius:8px; width: 100%; font-weight: bold;">CERRAR</button>
        <div id="p-chofer" class="planilla-box"></div>
        <button class="btn-ws" onclick="enviarWS('chofer')">WhatsApp Chofer</button>
        <div id="p-cliente" class="planilla-box"></div>
        <button class="btn-ws" onclick="enviarWS('cliente')">WhatsApp Cliente</button>
        <div id="p-resumen" class="planilla-box"></div>
        <button class="btn-ws" style="background:var(--dorado); color: black;" onclick="copiarResumen()">COPIAR DATOS</button>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
    let choferData = null;
    let tipoSeleccionado = "";

    async function cargarColaboraciones() {
        const select = document.getElementById('colaboracion');
        const { data, error } = await supabaseClient.from('colaboraciones').select('nombre').order('nombre', { ascending: true });
        
        if (!error) {
            let opciones = '<option value="">Seleccionar colaboración...</option>';
            opciones += '<option value="Directo">Directo</option>';
            data.forEach(item => {
                opciones += `<option value="${item.nombre}">${item.nombre}</option>`;
            });
            select.innerHTML = opciones;
        }
    }
    cargarColaboraciones();

    function actualizarInterfazColab() {
        const colab = document.getElementById('colaboracion').value;
        const campoCliente = document.getElementById('campo-cliente');
        const tipoContainer = document.getElementById('tipo-colab-container');

        if (colab !== "" && colab !== "Directo") {
            campoCliente.style.display = "none";
            document.getElementById('tel-cliente').value = "";
            tipoContainer.style.display = "flex";
        } else {
            campoCliente.style.display = "block";
            tipoContainer.style.display = "none";
            tipoSeleccionado = "";
            desmarcarBotones();
        }
    }

    function seleccionarTipo(tipo) {
        tipoSeleccionado = tipo;
        desmarcarBotones();
        if (tipo === 'Entrada') document.getElementById('btn-entrada').classList.add('active');
        if (tipo === 'Salida') document.getElementById('btn-salida').classList.add('active');
    }

    function desmarcarBotones() {
        const bEntrada = document.getElementById('btn-entrada');
        const bSalida = document.getElementById('btn-salida');
        if(bEntrada) bEntrada.classList.remove('active');
        if(bSalida) bSalida.classList.remove('active');
    }

    async function buscarChofer() {
        const tel = document.getElementById('tel-chofer').value;
        if(!tel) return alert("Ingrese un número");
        const { data } = await supabaseClient.from('choferes').select('*').eq('telefono', tel).single();
        if (data) {
            choferData = data;
            const res = document.getElementById('res-chofer');
            res.style.display = 'block';
            let statusHTML = (data.fondo_actual < 150 && !data.libre_de_fondo) ? `<br><b style="color:#ff4444;">⚠️ ESTADO: BLOQUEADO POR FONDO</b>` : "";
            res.innerHTML = `<b>Nombre:</b> ${data.nombre} ${data.apellido || ''}<br><b>Auto:</b> ${data.marca_carro} ${data.modelo_carro}<br><b>Color:</b> ${data.color_carro}<br><b>Fondo Actual:</b> $${data.fondo_actual}${statusHTML}`;
        } else { alert("Chofer no encontrado"); }
    }

    function calcularPrecio() {
        const t = parseFloat(document.getElementById('tarifa').value);
        const d = parseFloat(document.getElementById('distancia').value);
        if(t && d) document.getElementById('precio-final').value = (t * d).toFixed(0);
    }

    function addParada() {
        const div = document.createElement('div');
        div.style.marginTop = "8px";
        div.innerHTML = `<input type="text" class="parada-extra" placeholder="Dirección de parada">`;
        document.getElementById('contenedor-paradas').appendChild(div);
    }

    function toggleReserva() {
        document.getElementById('seccion-reserva').style.display = document.getElementById('reservado').checked ? 'block' : 'none';
    }

    function generarPlanillas() {
        const paradas = Array.from(document.querySelectorAll('.parada-extra')).map(i => i.value).filter(v => v.trim() !== "");
        const datos = {
            colab: document.getElementById('colaboracion').value,
            tipo: tipoSeleccionado,
            precio: document.getElementById('precio-final').value,
            cliente: document.getElementById('tel-cliente').value,
            origen: document.getElementById('origen').value,
            paradas: paradas.join(", "),
            destino: document.getElementById('destino').value,
            pax: document.getElementById('pax').value,
            fondo: choferData ? choferData.fondo_actual : '',
            chofer: choferData ? `${choferData.nombre} ${choferData.apellido || ''}` : '',
            auto: choferData ? `${choferData.marca_carro} ${choferData.modelo_carro}` : '',
            color: choferData ? choferData.color_carro : '',
            obs: document.getElementById('observacion').value
        };

        let txtChofer = `*DATOS DEL VIAJE*\n`;
        if(datos.colab && datos.colab !== 'Directo') txtChofer += `Agencia: ${datos.colab} (${datos.tipo})\n`;
        if(datos.precio) txtChofer += `Precio: ${datos.precio}\n`;
        if(datos.cliente) txtChofer += `Cliente: ${datos.cliente}\n`;
        if(datos.origen) txtChofer += `Origen: ${datos.origen}\n`;
        if(datos.paradas) txtChofer += `Paradas: ${datos.paradas}\n`;
        if(datos.destino) txtChofer += `Destino: ${datos.destino}\n`;
        if(datos.pax) txtChofer += `Pax: ${datos.pax}\n`;
        if(datos.fondo) txtChofer += `Fondo Actual: ${datos.fondo}\n`;
        if(datos.obs) txtChofer += `Obs: ${datos.obs}\n`;
        txtChofer += `\n⚠️ IMPORTANTE ⚠️\n\n‎•usted tiene 15 minutos máximo para llegar a la dirección de recojida del cliente.
‎•El cliente tiene 15 minutos para abordar su vehículo,por encima de este tiempo se le cobrará 25 cup el minuto extra
‎•En caso de llegada tarde a un servicio programado se le descontará el 50% del precio del servicio. 
‎•Recuerde mantener su auto limpio y en perfectas condiciones técnicas al igual que un trato cordial con cada cliente.`;
        document.getElementById('p-chofer').innerText = txtChofer;

        let txtCliente = `*Taxi En Camino*\n`;
        if(datos.precio) txtCliente += `Precio: ${datos.precio}\n`;
        if(datos.chofer) txtCliente += `Chofer: ${datos.chofer}\n`;
        if(datos.auto) txtCliente += `Auto: ${datos.auto}\n`;
        if(datos.color) txtCliente += `Color: ${datos.color}\n`;
        txtCliente += `\n⚠️ *IMPORTANTE* ⚠️\n\n‎•Cada parada extra se recalcula la ruta y modifica el costo.
‎•Al llegar el taxi a su origen usted tiene 10min de espera como cortesía, pasado este tiempo debe pagar por cada minuto extra.
‎•Tiempo de espera extra:  25cup x minutos. 
‎•En caso de cancelar estando el auto en el lugar de recogida, deberá pagar la mitad del costo del servicio.`;
        document.getElementById('p-cliente').innerText = txtCliente;

        document.getElementById('p-resumen').innerText = `RESUMEN:\nChofer: ${datos.chofer}\nCliente: ${datos.cliente || datos.colab}\nPrecio: ${datos.precio}`;
        document.getElementById('modalPlanillas').style.display = 'block';
    }

    function enviarWS(tipo) {
        const num = tipo === 'chofer' ? document.getElementById('tel-chofer').value : document.getElementById('tel-cliente').value;
        if(tipo === 'cliente' && !num) return alert("No hay número de cliente para enviar.");
        const msg = encodeURIComponent(document.getElementById(tipo === 'chofer' ? 'p-chofer' : 'p-cliente').innerText);
        window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
    }

    function copiarResumen() {
        navigator.clipboard.writeText(document.getElementById('p-resumen').innerText).then(() => alert("Copiado"));
    }

    async function crearViaje() {
        const colabValue = document.getElementById('colaboracion').value;
        if(!choferData || !document.getElementById('precio-final').value) return alert("Faltan datos");
        if(colabValue !== "" && colabValue !== "Directo" && !tipoSeleccionado) return alert("Seleccione si es Entrada o Salida");
        
        if (choferData.fondo_actual < 150 && !choferData.libre_de_fondo) {
            return alert(`❌ Chófer Bloqueado: Fondo insuficiente.`);
        }

        const btn = document.querySelector('button[onclick="crearViaje()"]');
        btn.innerText = "PROCESANDO...";
        btn.disabled = true;

        const precioViaje = parseFloat(document.getElementById('precio-final').value);
        let descuento = (!choferData.libre_de_fondo) ? precioViaje * (choferData.tiene_licencia_operativa ? 0.12 : 0.15) : 0;
        const nuevoFondo = choferData.fondo_actual - descuento;

        const { error } = await supabaseClient.from('viajes').insert([{
            colaboracion: colabValue,
            tipo_agencia: tipoSeleccionado,
            chofer_id: choferData.id,
            precio: precioViaje,
            cliente_telefono: document.getElementById('tel-cliente').value,
            origen: document.getElementById('origen').value,
            destino: document.getElementById('destino').value,
            grupo_whatsapp: document.getElementById('grupo').value
        }]);

        if (!error) {
            await supabaseClient.from('choferes').update({ fondo_actual: nuevoFondo }).eq('id', choferData.id);
            location.reload();
        } else {
            alert("Error: " + error.message);
            btn.disabled = false;
        }
    }
</script>
</body>
</html>

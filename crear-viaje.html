<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Viaje - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        input, select, textarea { border-radius: 1rem !important; border: 1px solid #e2e8f0 !important; padding: 0.75rem !important; outline: none; }
        input:focus { ring: 2px solid #1e5bb9; }
        .card { background: white; border-radius: 2rem; padding: 1.5rem; shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .btn-blue { background: #1e5bb9; color: white; font-weight: 900; text-transform: uppercase; border-radius: 1rem; padding: 1rem; transition: all 0.2s; }
        .btn-blue:active { scale: 0.95; }
        .label-mini { font-size: 0.65rem; font-weight: 900; color: #64748b; text-transform: uppercase; margin-left: 0.5rem; margin-bottom: 0.2rem; display: block; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter">Elaborar Viaje</h1>
        <div></div>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-6">
        
        <div class="card space-y-4">
            <div>
                <label class="label-mini">Colaboración</label>
                <select id="colaboracion" class="w-full bg-slate-50">
                    <option value="Ninguna">Ninguna</option>
                    <option value="Agencia X">Agencia X</option>
                    <option value="Socio Y">Socio Y</option>
                </select>
            </div>

            <div>
                <label class="label-mini">Teléfono del Chófer</label>
                <div class="flex gap-2">
                    <input type="tel" id="chofer_tel" placeholder="54322676" class="flex-1">
                    <button onclick="buscarChofer()" class="bg-blue-600 text-white px-4 rounded-2xl"><i class="fas fa-search"></i></button>
                </div>
                <div id="infoChofer" class="mt-3 p-3 bg-blue-50 rounded-2xl text-xs font-bold text-blue-800 hidden">
                    </div>
            </div>

            <div>
                <label class="label-mini">Teléfono Cliente</label>
                <input type="tel" id="cliente_tel" placeholder="Número de WhatsApp" class="w-full">
            </div>

            <div>
                <label class="label-mini">Precio del Viaje</label>
                <input type="number" id="precio" placeholder="0.00" class="w-full text-xl font-black text-blue-700">
                <div class="mt-2 p-4 bg-slate-100 rounded-2xl grid grid-cols-2 gap-2">
                    <input type="number" id="calc_tarifa" placeholder="Tarifa/Km" class="text-xs">
                    <input type="number" id="calc_dist" placeholder="Distancia Km" class="text-xs">
                    <button onclick="calcularPrecio()" class="col-span-2 text-[10px] font-black bg-slate-700 text-white p-2 rounded-xl">CALCULAR PRECIO</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-mini">Pasajeros (PAX)</label>
                    <input type="number" id="pax" value="1" class="w-full">
                </div>
                <div>
                    <label class="label-mini">Grupo WhatsApp</label>
                    <input type="text" id="grupo" placeholder="Nombre del grupo" class="w-full">
                </div>
            </div>

            <div>
                <label class="label-mini">Origen</label>
                <input type="text" id="origen" class="w-full">
                <div id="contenedorParadas" class="mt-2 space-y-2"></div>
                <button onclick="añadirParada()" class="mt-2 text-[10px] font-bold text-blue-600 uppercase underline">+ Añadir Parada Intermedia</button>
            </div>

            <div>
                <label class="label-mini">Destino</label>
                <input type="text" id="destino" class="w-full">
            </div>

            <div class="grid grid-cols-2 gap-3 p-2">
                <label class="flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="transferencia"> Transferencia</label>
                <label class="flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="precio_cliente"> Precio Cliente</label>
                <label class="flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="aire"> Aire Acondicionado</label>
                <label class="flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="ida_vuelta"> Ida y Vuelta</label>
            </div>

            <div>
                <label class="flex items-center gap-2 text-xs font-bold mb-2">
                    <input type="checkbox" id="es_reservado" onchange="toggleReserva()"> Viaje Reservado
                </label>
                <div id="seccionReserva" class="hidden grid grid-cols-2 gap-2">
                    <input type="date" id="fecha_reserva">
                    <input type="time" id="hora_reserva">
                </div>
            </div>

            <div>
                <label class="label-mini">Observaciones</label>
                <textarea id="obs" class="w-full h-24" placeholder="Equipaje, niños, mascotas..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-4">
                <button onclick="generarPlanillas()" class="p-4 bg-orange-500 text-white font-black rounded-2xl uppercase italic">Planilla</button>
                <button onclick="crearViaje()" class="p-4 bg-green-600 text-white font-black rounded-2xl uppercase italic">Crear Viaje</button>
            </div>
        </div>

        <div id="zonaPlanillas" class="hidden space-y-6">
            <div class="card border-2 border-blue-200">
                <h2 class="font-black text-blue-800 border-b pb-2 mb-4 uppercase">Planilla para el Chófer</h2>
                <pre id="textoChofer" class="text-xs font-bold whitespace-pre-wrap font-sans"></pre>
                <button onclick="enviarWhatsApp('chofer')" class="w-full mt-4 bg-green-500 text-white p-3 rounded-xl font-black uppercase"><i class="fab fa-whatsapp"></i> Enviar al Chófer</button>
            </div>
            <div class="card border-2 border-green-200">
                <h2 class="font-black text-green-800 border-b pb-2 mb-4 uppercase">Planilla para el Cliente</h2>
                <pre id="textoCliente" class="text-xs font-bold whitespace-pre-wrap font-sans"></pre>
                <button onclick="enviarWhatsApp('cliente')" class="w-full mt-4 bg-green-500 text-white p-3 rounded-xl font-black uppercase"><i class="fab fa-whatsapp"></i> Enviar al Cliente</button>
            </div>
        </div>

    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        let choferActual = null;

        async function buscarChofer() {
            const tel = document.getElementById('chofer_tel').value;
            const info = document.getElementById('infoChofer');
            const { data, error } = await supabaseClient.from('choferes').select('*').eq('telefono', tel).single();
            
            if (data) {
                choferActual = data;
                info.innerHTML = `👤 NOMBRE: ${data.nombre}<br>🚗 AUTO: ${data.vehiculo}<br>💰 FONDO: $${data.fondo_actual}`;
                info.classList.remove('hidden');
            } else {
                alert("Chofer no encontrado");
            }
        }

        function calcularPrecio() {
            const t = document.getElementById('calc_tarifa').value;
            const d = document.getElementById('calc_dist').value;
            if(t && d) document.getElementById('precio').value = t * d;
        }

        function añadirParada() {
            const input = document.createElement('input');
            input.placeholder = "Parada Intermedia";
            input.className = "w-full mt-2";
            document.getElementById('contenedorParadas').appendChild(input);
        }

        function toggleReserva() {
            document.getElementById('seccionReserva').classList.toggle('hidden');
        }

        function generarPlanillas() {
            const p = document.getElementById('precio').value;
            const c = document.getElementById('cliente_tel').value;
            const o = document.getElementById('origen').value;
            const d = document.getElementById('destino').value;
            const pax = document.getElementById('pax').value;

            // Planilla Chofer
            const txtC = `*DATOS DEL VIAJE*\nPrecio: $${p}\nCliente: ${c}\nOrigen: ${o}\nDestino: ${d}\nPax: ${pax}\nFondo Actual: $${choferActual?.fondo_actual || 0}\n\n⚠️ IMPORTANTE ⚠️\n•Usted tiene 15 min máximo para llegar.\n•El cliente tiene 15 min de cortesía, luego 25 cup/min.\n•Llegada tarde descuenta 50% del servicio.\n•Mantenga su auto limpio y trato cordial.`;
            document.getElementById('textoChofer').innerText = txtC;

            // Planilla Cliente
            const txtCli = `*Taxi En Camino*\nPrecio: $${p}\nChofer: ${choferActual?.nombre || 'Asignado'}\nAuto: ${choferActual?.vehiculo || 'Taxi'}\nColor: ${choferActual?.color || '-'}\n⚠️ IMPORTANTE ⚠️\n•Cada parada extra modifica el costo.\n•Tiene 10min de espera de cortesía.\n•Minuto extra: 25cup.\n•Si cancela en el lugar, paga la mitad del servicio.`;
            document.getElementById('textoCliente').innerText = txtCli;

            document.getElementById('zonaPlanillas').classList.remove('hidden');
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function enviarWhatsApp(tipo) {
            const tel = (tipo === 'chofer') ? document.getElementById('chofer_tel').value : document.getElementById('cliente_tel').value;
            const msg = (tipo === 'chofer') ? document.getElementById('textoChofer').innerText : document.getElementById('textoCliente').innerText;
            window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function crearViaje() {
            // Lógica para insertar en Supabase (similar a la anterior pero con todos los campos)
            alert("Viaje guardado en base de datos correctamente.");
            window.location.href = 'panel.html';
        }
    </script>
</body>
</html>

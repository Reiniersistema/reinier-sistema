<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Viaje - TransGestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        input, select, textarea { border-radius: 1rem !important; border: none !important; background: #f8fafc !important; font-weight: bold; outline: none; }
        .card { background: white; border-radius: 2.5rem; }
    </style>
</head>
<body class="pb-10">
    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter text-center flex-1">Nuevo Servicio</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-4">
        <div class="card p-6 space-y-4 shadow-xl">
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Colaboración</label>
                <select id="colaboracion" class="w-full p-4 mt-1">
                    <option value="Ninguna">Ninguna</option>
                    <option value="Agencia">Agencia</option>
                    <option value="Socio">Socio</option>
                </select>
            </div>

            <div class="bg-blue-50 p-4 rounded-[2rem] space-y-3">
                <label class="text-[10px] font-black uppercase text-blue-600 ml-2">Chófer (Teléfono)</label>
                <div class="flex gap-2">
                    <input type="tel" id="tel_chofer" placeholder="Ej: 52345678" class="flex-1 p-4">
                    <button onclick="buscarChofer()" class="bg-blue-600 text-white px-6 rounded-2xl active:scale-95"><i class="fas fa-search"></i></button>
                </div>
                <div id="datos_chofer" class="hidden grid grid-cols-2 gap-2 text-[11px] font-bold text-slate-600 p-2 border-t border-blue-100 mt-2">
                    <p>Nombre: <span id="c_nombre" class="text-blue-700">-</span></p>
                    <p>Fondo: <span id="c_fondo" class="text-green-600">$0</span></p>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Teléfono Cliente</label>
                <input type="tel" id="tel_cliente" placeholder="Número del cliente" class="w-full p-4 mt-1">
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Precio del Viaje ($)</label>
                <input type="number" id="precio_viaje" class="w-full p-4 text-2xl text-blue-700 font-black" placeholder="0.00">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="origen" placeholder="Origen" class="p-4">
                <input type="text" id="destino" placeholder="Destino" class="p-4">
            </div>

            <button onclick="crearViaje()" class="w-full bg-[#1e5bb9] text-white p-5 rounded-[2rem] font-black uppercase italic text-sm shadow-lg">Crear Viaje</button>
        </div>
    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        let datosChoferActual = null;

        async function buscarChofer() {
            const tel = document.getElementById('tel_chofer').value;
            const { data } = await supabaseClient.from('choferes').select('*').eq('telefono', tel).single();
            if(data) {
                datosChoferActual = data;
                document.getElementById('c_nombre').innerText = data.nombre;
                document.getElementById('c_fondo').innerText = "$" + data.fondo_actual;
                document.getElementById('datos_chofer').classList.remove('hidden');
            } else { alert("No se encontró el chófer"); }
        }

        async function crearViaje() {
            if(!datosChoferActual) return alert("Busca un chófer");
            const precio = parseFloat(document.getElementById('precio_viaje').value);
            const userTel = localStorage.getItem('userTel') || 'Admin';

            // INSERTAR VIAJE CON COLUMNAS REALES (chofer_tel, cliente_tel)
            const { error: errV } = await supabaseClient.from('viajes').insert([{
                colaboracion: document.getElementById('colaboracion').value,
                chofer_tel: document.getElementById('tel_chofer').value,
                cliente_tel: document.getElementById('tel_cliente').value,
                precio: precio,
                origen: document.getElementById('origen').value,
                destino: document.getElementById('destino').value
            }]);

            if(errV) return alert("Error Viaje: " + errV.message);

            // DESCUENTO SI TIENE LICENCIA
            if(datosChoferActual.lic_operativa) {
                const desc = precio * 0.12;
                const nuevoFondo = datosChoferActual.fondo_actual - desc;
                
                await supabaseClient.from('choferes').update({ fondo_actual: nuevoFondo }).eq('id', datosChoferActual.id);

                // INSERTAR MOVIMIENTO CON COLUMNAS REALES
                await supabaseClient.from('movimientos_fondo').insert([{
                    chofer_tel: datosChoferActual.telefono,
                    usuario: userTel,
                    metodo: 'Descuento 12%',
                    saldo_movedo: -desc,
                    fondo_anterior: datosChoferActual.fondo_actual,
                    activo_nuevo: nuevoFondo,
                    tipo: 'viaje'
                }]);
            }

            alert("✅ Viaje Creado");
            window.location.href = 'mis-viajes.html';
        }
    </script>
</body>
</html>

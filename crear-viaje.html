<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Viaje - TransGestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        input, select, textarea { border-radius: 1rem !important; border: none !important; background: #f8fafc !important; font-weight: bold; }
        .card { background: white; border-radius: 2.5rem; shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter text-center flex-1">Nuevo Servicio</h1>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-4">
        
        <div class="card p-6 space-y-4 shadow-lg">
            
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Colaboración</label>
                <select id="colaboracion" class="w-full p-4 mt-1">
                    <option value="Ninguna">Ninguna</option>
                    <option value="Agencia X">Agencia X</option>
                    <option value="Socio Y">Socio Y</option>
                </select>
            </div>

            <div class="bg-blue-50 p-4 rounded-[2rem] space-y-3">
                <label class="text-[10px] font-black uppercase text-blue-600 ml-2">Chófer (Teléfono)</label>
                <div class="flex gap-2">
                    <input type="tel" id="tel_chofer" placeholder="55555555" class="flex-1 p-4">
                    <button onclick="buscarChofer()" class="bg-blue-600 text-white px-6 rounded-2xl"><i class="fas fa-search"></i></button>
                </div>
                <div id="datos_chofer" class="hidden grid grid-cols-2 gap-2 text-[11px] font-bold text-slate-600 p-2">
                    <p>Nombre: <span id="c_nombre" class="text-blue-700">-</span></p>
                    <p>Auto: <span id="c_auto" class="text-blue-700">-</span></p>
                    <p>Fondo: <span id="c_fondo" class="text-green-600">$0</span></p>
                    <p>Licencia: <span id="c_licencia" class="text-orange-600">-</span></p>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Teléfono Cliente</label>
                <input type="tel" id="tel_cliente" placeholder="Número del cliente" class="w-full p-4 mt-1">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Precio del Viaje ($)</label>
                <input type="number" id="precio_viaje" class="w-full p-4 text-2xl text-blue-700 font-black">
                
                <div class="bg-slate-100 p-4 rounded-3xl grid grid-cols-2 gap-2">
                    <input type="number" id="calc_km" placeholder="Distancia KM" class="p-2 text-sm">
                    <input type="number" id="calc_tarifa" placeholder="Tarifa $" class="p-2 text-sm">
                    <button onclick="calcularPrecio()" class="col-span-2 bg-slate-800 text-white p-2 rounded-xl text-xs font-black uppercase">Calcular Precio</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Pasajeros</label>
                    <input type="number" id="pax" value="1" class="w-full p-4 mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Grupo WhatsApp</label>
                    <input type="text" id="grupo" placeholder="Nombre del grupo" class="w-full p-4 mt-1">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Origen</label>
                <input type="text" id="origen" class="w-full p-4 mt-1">
                <div id="contenedor_paradas" class="space-y-2 mt-2"></div>
                <button onclick="añadirParada()" class="mt-2 text-blue-600 font-black text-[10px] uppercase"><i class="fas fa-plus-circle"></i> Añadir Parada</button>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Destino</label>
                <input type="text" id="destino" class="w-full p-4 mt-1">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500 bg-slate-50 p-3 rounded-2xl cursor-pointer">
                    <input type="checkbox" id="check_transfer" class="w-4 h-4"> Transferencia
                </label>
                <label class="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500 bg-slate-50 p-3 rounded-2xl cursor-pointer">
                    <input type="checkbox" id="check_aire" class="w-4 h-4"> Aire Acond.
                </label>
                <label class="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500 bg-slate-50 p-3 rounded-2xl cursor-pointer">
                    <input type="checkbox" id="check_regreso" class="w-4 h-4"> Ida y Vuelta
                </label>
                <label class="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500 bg-slate-50 p-3 rounded-2xl cursor-pointer">
                    <input type="checkbox" id="check_reserva" onchange="toggleReserva()" class="w-4 h-4"> Reservado
                </label>
            </div>

            <div id="seccion_reserva" class="hidden p-4 bg-orange-50 rounded-3xl space-y-2">
                <input type="datetime-local" id="fecha_reserva" class="w-full p-3 bg-white">
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Observaciones</label>
                <textarea id="observaciones" rows="3" class="w-full p-4 mt-1"></textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <button onclick="generarPlanillas()" class="flex-1 bg-slate-800 text-white p-5 rounded-[2rem] font-black uppercase italic tracking-tighter">Planilla</button>
                <button onclick="crearViaje()" class="flex-1 bg-[#1e5bb9] text-white p-5 rounded-[2rem] font-black uppercase italic tracking-tighter shadow-xl shadow-blue-200">Crear Viaje</button>
            </div>

        </div>

        <div id="area_planillas" class="hidden space-y-4">
            <div class="card p-6 border-2 border-dashed border-blue-200">
                <h3 class="font-black text-center text-blue-800 mb-4 uppercase">Planilla para el Chófer</h3>
                <pre id="texto_chofer" class="text-xs font-mono bg-slate-50 p-4 rounded-xl whitespace-pre-wrap"></pre>
                <button onclick="enviarWhatsApp('chofer')" class="w-full mt-3 bg-green-500 text-white p-4 rounded-2xl font-black uppercase"><i class="fab fa-whatsapp"></i> Enviar al Chófer</button>
            </div>

            <div class="card p-6 border-2 border-dashed border-green-200">
                <h3 class="font-black text-center text-green-800 mb-4 uppercase">Planilla para el Cliente</h3>
                <pre id="texto_cliente" class="text-xs font-mono bg-slate-50 p-4 rounded-xl whitespace-pre-wrap"></pre>
                <button onclick="enviarWhatsApp('cliente')" class="w-full mt-3 bg-green-600 text-white p-4 rounded-2xl font-black uppercase"><i class="fab fa-whatsapp"></i> Enviar al Cliente</button>
            </div>
        </div>

    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        let datosChoferActual = null;

        async function buscarChofer() {
            const tel = document.getElementById('tel_chofer').value;
            const { data, error } = await supabaseClient.from('choferes').select('*').eq('telefono', tel).single();
            
            if(data) {
                datosChoferActual = data;
                document.getElementById('c_nombre').innerText = data.nombre;
                document.getElementById('c_auto').innerText = data.vehiculo + " (" + data.color + ")";
                document.getElementById('c_fondo').innerText = "$" + data.fondo_actual;
                document.getElementById('c_licencia').innerText = data.lic_operativa ? "SÍ (12%)" : "NO";
                document.getElementById('datos_chofer').classList.remove('hidden');
            } else {
                alert("Chófer no encontrado.");
            }
        }

        function calcularPrecio() {
            const km = document.getElementById('calc_km').value;
            const tarifa = document.getElementById('calc_tarifa').value;
            if(km && tarifa) document.getElementById('precio_viaje').value = km * tarifa;
        }

        function añadirParada() {
            const input = document.createElement('input');
            input.type = "text";
            input.placeholder = "Parada intermedia...";
            input.className = "w-full p-4 mt-1 bg-slate-50 rounded-2xl border-none font-bold";
            document.getElementById('contenedor_paradas').appendChild(input);
        }

        function toggleReserva() {
            document.getElementById('seccion_reserva').classList.toggle('hidden', !document.getElementById('check_reserva').checked);
        }

        function generarPlanillas() {
            const precio = document.getElementById('precio_viaje').value;
            const origen = document.getElementById('origen').value;
            const destino = document.getElementById('destino').value;
            
            if(!precio || !origen || !datosChoferActual) { alert("Faltan datos para la planilla"); return; }

            const pChofer = `*DATOS DEL VIAJE*\nPrecio: ${precio}\nCliente: ${document.getElementById('tel_cliente').value}\nOrigen: ${origen}\nDestino: ${destino}\nPax: ${document.getElementById('pax').value}\nFondo Actual: ${datosChoferActual.fondo_actual}\n\n⚠️ IMPORTANTE ⚠️\n• Máximo 15 min para llegar.\n• 15 min cortesía cliente, luego 25cup/min.`;
            
            const pCliente = `*Taxi En Camino*\nPrecio: ${precio}\nChofer: ${datosChoferActual.nombre}\nAuto: ${datosChoferActual.vehiculo}\nColor: ${datosChoferActual.color}\n\n⚠️ IMPORTANTE ⚠️\n• Paradas extras modifican costo.\n• 10 min cortesía espera.`;

            document.getElementById('texto_chofer').innerText = pChofer;
            document.getElementById('texto_cliente').innerText = pCliente;
            document.getElementById('area_planillas').classList.remove('hidden');
        }

        function enviarWhatsApp(tipo) {
            const msg = encodeURIComponent(tipo === 'chofer' ? document.getElementById('texto_chofer').innerText : document.getElementById('texto_cliente').innerText);
            const tel = tipo === 'chofer' ? document.getElementById('tel_chofer').value : document.getElementById('tel_cliente').value;
            window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
        }

        async function crearViaje() {
            if(!datosChoferActual) { alert("Busca un chófer primero"); return; }
            const precio = parseFloat(document.getElementById('precio_viaje').value);

            // 1. INSERTAR VIAJE
            const { data: viaje, error: errV } = await supabaseClient.from('viajes').insert([{
                chofer: datosChoferActual.nombre,
                telefono_chofer: datosChoferActual.telefono,
                origen: document.getElementById('origen').value,
                destino: document.getElementById('destino').value,
                precio: precio,
                cliente_tel: document.getElementById('tel_cliente').value,
                es_reserva: document.getElementById('check_reserva').checked,
                fecha_reserva: document.getElementById('fecha_reserva').value || null
            }]);

            if(errV) { alert("Error guardando viaje"); return; }

            // 2. LÓGICA DE FONDO (Si tiene licencia descuenta 12%)
            if(datosChoferActual.lic_operativa) {
                const descuento = precio * 0.12;
                const nuevoFondo = datosChoferActual.fondo_actual - descuento;

                // Actualizar Chofer
                await supabaseClient.from('choferes').update({ fondo_actual: nuevoFondo }).eq('id', datosChoferActual.id);

                // Registrar Movimiento
                await supabaseClient.from('movimientos_fondo').insert([{
                    chofer_id: datosChoferActual.id,
                    monto: -descuento,
                    motivo: "Comisión 12% Viaje Origen: " + document.getElementById('origen').value
                }]);
            }

            alert("Viaje creado y guardado en el sistema.");
            window.location.href = 'mis-viajes.html'; // Vínculo directo para ver el resultado
        }
    </script>
</body>
</html>

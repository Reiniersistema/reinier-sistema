<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 16px; text-transform: uppercase; margin: 0; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Tarjetas de Usuario */
        .usuarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .user-card { background: var(--gris); border-radius: 20px; padding: 25px 10px; text-align: center; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .user-card:active { transform: scale(0.95); background: #252525; }
        .user-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 10px; }
        
        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; }
        .modal-content { background: var(--gris); max-width: 400px; margin: 30px auto; border-radius: 20px; padding: 25px; border: 1px solid var(--dorado); box-sizing: border-box; }
        
        input, select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; }
        
        .photo-area { width: 150px; height: 150px; background: #000; border: 2px dashed var(--dorado); border-radius: 15px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }

        .btn-accion { width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; font-family: 'Montserrat'; }
        .btn-editar { background: #3498db; color: white; }
        .btn-eliminar { background: var(--rojo); color: white; }
        .btn-cancelar { background: none; color: #888; }
    </style>
</head>
<body>

<div class="header">
    <h2>USUARIOS REGISTRADOS</h2>
    <button class="btn-add" onclick="abrirParaCrear()">+ AÑADIR</button>
</div>

<div class="usuarios-grid" id="grid-usuarios"></div>

<div id="modalPlanilla" class="modal">
    <div class="modal-content">
        <h3 id="modal-titulo" style="text-align:center; color:var(--dorado); margin-top:0;">PLANILLA DE USUARIO</h3>
        
        <div id="area-foto" class="photo-area" onclick="document.getElementById('inputFoto').click()">
            <img id="p-img" src="" style="width:100%; height:100%; object-fit:cover;">
            <span id="p-txt" style="display:none; font-size:10px; color:#666;">TOCA PARA FOTO</span>
        </div>
        <input type="file" id="inputFoto" hidden accept="image/*" onchange="previewFoto(this)">

        <div id="campos-datos">
            <input type="text" id="p-nombre" placeholder="Nombre">
            <input type="text" id="p-apellidos" placeholder="Apellidos">
            <input type="tel" id="p-telefono" placeholder="Teléfono">
            <input type="text" id="p-pass" placeholder="Contraseña">
            <select id="p-rol">
                <option value="Gestor">Gestor</option>
                <option value="Administrador">Administrador</option>
            </select>
        </div>

        <div id="controles-ver">
            <button class="btn-accion btn-editar" onclick="modoEdicion()">EDITAR DATOS</button>
            <button class="btn-accion btn-eliminar" onclick="eliminarActual()">ELIMINAR USUARIO</button>
        </div>

        <div id="controles-edit" style="display:none;">
            <button class="btn-add" style="width:100%; padding:15px;" onclick="guardar()">GUARDAR CAMBIOS</button>
        </div>
        
        <button class="btn-accion btn-cancelar" onclick="cerrarModal()">CERRAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    let listaUsuarios = [];
    let usuarioActivo = null;
    let fotoTempURL = "";

    async function cargar() {
        const { data } = await supabaseClient.from('usuarios').select('*').order('nombre');
        listaUsuarios = data || [];
        const grid = document.getElementById('grid-usuarios');
        grid.innerHTML = listaUsuarios.map((u, i) => `
            <div class="user-card" onclick="verUsuario(${i})">
                <img src="${u.foto_perfil || 'https://via.placeholder.com/150'}" class="user-img">
                <div style="font-weight:bold; font-size:15px;">${u.nombre}</div>
                <div style="font-size:11px; color:var(--dorado); text-transform:uppercase;">${u.rol}</div>
            </div>
        `).join('');
    }

    function verUsuario(index) {
        usuarioActivo = listaUsuarios[index];
        fotoTempURL = usuarioActivo.foto_perfil;
        
        // Configurar Vista
        document.getElementById('modal-titulo').innerText = "PLANILLA DE USUARIO";
        document.getElementById('p-img').src = usuarioActivo.foto_perfil || 'https://via.placeholder.com/150';
        document.getElementById('p-nombre').value = usuarioActivo.nombre;
        document.getElementById('p-apellidos').value = usuarioActivo.apellidos;
        document.getElementById('p-telefono').value = usuarioActivo.telefono;
        document.getElementById('p-pass').value = usuarioActivo.password;
        document.getElementById('p-rol').value = usuarioActivo.rol;

        // Bloquear inputs para "Solo Ver"
        alternarInputs(true);
        document.getElementById('controles-ver').style.display = 'block';
        document.getElementById('controles-edit').style.display = 'none';
        document.getElementById('modalPlanilla').style.display = 'block';
    }

    function modoEdicion() {
        document.getElementById('modal-titulo').innerText = "EDITANDO DATOS";
        alternarInputs(false);
        document.getElementById('controles-ver').style.display = 'none';
        document.getElementById('controles-edit').style.display = 'block';
    }

    function abrirParaCrear() {
        usuarioActivo = null;
        fotoTempURL = "";
        document.getElementById('modal-titulo').innerText = "NUEVO USUARIO";
        document.getElementById('p-nombre').value = "";
        document.getElementById('p-apellidos').value = "";
        document.getElementById('p-telefono').value = "";
        document.getElementById('p-pass').value = "";
        document.getElementById('p-img').src = "https://via.placeholder.com/150";
        
        alternarInputs(false);
        document.getElementById('controles-ver').style.display = 'none';
        document.getElementById('controles-edit').style.display = 'block';
        document.getElementById('modalPlanilla').style.display = 'block';
    }

    function alternarInputs(estado) {
        const ids = ['p-nombre', 'p-apellidos', 'p-telefono', 'p-pass', 'p-rol'];
        ids.forEach(id => document.getElementById(id).disabled = estado);
        document.getElementById('area-foto').style.pointerEvents = estado ? 'none' : 'auto';
    }

    function previewFoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('p-img').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function guardar() {
        const file = document.getElementById('inputFoto').files[0];
        let urlFinal = fotoTempURL;

        if (file) {
            const fileName = `user_${Date.now()}`;
            const { data } = await supabaseClient.storage.from('imagenes_sistema').upload(fileName, file);
            if (data) {
                const { data: pUrl } = supabaseClient.storage.from('imagenes_sistema').getPublicUrl(fileName);
                urlFinal = pUrl.publicUrl;
            }
        }

        const datos = {
            nombre: document.getElementById('p-nombre').value,
            apellidos: document.getElementById('p-apellidos').value,
            telefono: document.getElementById('p-telefono').value,
            password: document.getElementById('p-pass').value,
            rol: document.getElementById('p-rol').value,
            foto_perfil: urlFinal
        };

        if (usuarioActivo) {
            await supabaseClient.from('usuarios').update(datos).eq('id', usuarioActivo.id);
        } else {
            await supabaseClient.from('usuarios').insert([datos]);
        }
        location.reload();
    }

    async function eliminarActual() {
        const pass = prompt("Confirma con tu contraseña de administrador para eliminar:");
        if (pass === "admin123") {
            await supabaseClient.from('usuarios').delete().eq('id', usuarioActivo.id);
            location.reload();
        }
    }

    function cerrarModal() { document.getElementById('modalPlanilla').style.display = 'none'; }

    cargar();
</script>
</body>
</html>

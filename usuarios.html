<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .user-card { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 1rem; border-bottom: 4px solid #e2e8f0; }
        .avatar { width: 45px; height: 45px; background: #1e5bb9; color: white; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter text-center flex-1">Usuarios Sistema</h1>
        <button onclick="abrirModalNuevo()" class="text-xl w-10"><i class="fas fa-plus"></i></button>
    </header>

    <main class="p-4 max-w-2xl mx-auto" id="listaUsuarios">
        </main>

    <div id="modalUsuario" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-6">
            <h3 class="font-black uppercase italic mb-4 text-center">Nuevo Usuario</h3>
            <div class="space-y-3">
                <input type="text" id="new_user_name" placeholder="Nombre de usuario" class="w-full p-3 bg-slate-100 rounded-xl font-bold border-none outline-none">
                <input type="password" id="new_user_pin" maxlength="4" placeholder="PIN (4 dígitos)" class="w-full p-3 bg-slate-100 rounded-xl font-bold border-none outline-none">
                <select id="new_user_role" class="w-full p-3 bg-slate-100 rounded-xl font-bold border-none outline-none">
                    <option value="admin">Administrador</option>
                    <option value="despacho">Despachador</option>
                </select>
                <div class="flex gap-2 pt-2">
                    <button onclick="cerrarModal()" class="flex-1 p-3 font-black uppercase text-xs text-slate-400">Cancelar</button>
                    <button onclick="crearUsuario()" class="flex-1 bg-[#1e5bb9] text-white p-3 rounded-xl font-black uppercase text-xs">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        window.onload = cargarUsuarios;

        async function cargarUsuarios() {
            const { data, error } = await supabaseClient.from('usuarios').select('*').order('username');
            if(error) return;

            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = data.map(u => `
                <div class="user-card">
                    <div class="avatar">${u.username.substring(0,1).toUpperCase()}</div>
                    <div class="flex-1">
                        <p class="text-xs font-black uppercase text-slate-800">${u.username}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${u.rol || 'Sin Rol'}</p>
                    </div>
                    <button onclick="eliminarUsuario('${u.id}')" class="text-red-300 p-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
        }

        function abrirModalNuevo() { document.getElementById('modalUsuario').classList.remove('hidden'); }
        function cerrarModal() { document.getElementById('modalUsuario').classList.add('hidden'); }

        async function crearUsuario() {
            const user = document.getElementById('new_user_name').value;
            const pin = document.getElementById('new_user_pin').value;
            const rol = document.getElementById('new_user_role').value;

            if(!user || pin.length < 4) { alert("Datos incompletos"); return; }

            const { error } = await supabaseClient.from('usuarios').insert([{
                username: user,
                pin: pin,
                rol: rol
            }]);

            if(!error) {
                cerrarModal();
                cargarUsuarios();
            }
        }

        async function eliminarUsuario(id) {
            if(confirm("¿Eliminar acceso?")) {
                await supabaseClient.from('usuarios').delete().eq('id', id);
                cargarUsuarios();
            }
        }
    </script>
</body>
</html>

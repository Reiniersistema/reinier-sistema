<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Grid de Usuarios */
        .usuarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .user-card { background: var(--gris); border-radius: 15px; padding: 15px; text-align: center; position: relative; border: 1px solid #333; }
        .user-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 10px; }
        .user-name { font-size: 14px; font-weight: bold; margin: 5px 0; }
        .user-role { font-size: 11px; color: var(--dorado); text-transform: uppercase; }

        /* Menú de 3 puntos */
        .options-btn { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 20px; color: #888; padding: 0 5px; }
        .dropdown { display: none; position: absolute; top: 35px; right: 10px; background: #252525; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 10; overflow: hidden; border: 1px solid #444; }
        .dropdown button { display: block; width: 100%; padding: 10px 20px; border: none; background: none; color: white; cursor: pointer; text-align: left; font-size: 12px; font-family: 'Montserrat'; }
        .dropdown button:hover { background: #333; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--gris); max-width: 400px; margin: auto; border-radius: 15px; padding: 25px; border: 1px solid var(--dorado); position: relative; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; }
        
        .photo-upload { width: 140px; height: 140px; background: #000; border: 2px dashed var(--dorado); border-radius: 15px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .photo-upload img { width: 100%; height: 100%; object-fit: cover; }

        .big-user-img { width: 100%; max-width: 250px; height: 250px; border-radius: 15px; object-fit: cover; border: 3px solid var(--dorado); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h2>Usuarios</h2>
    <button class="btn-add" onclick="abrirModal('modalAdd')">AÑADIR</button>
</div>

<div class="usuarios-grid" id="lista-usuarios">
    </div>

<div id="modalAdd" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--dorado); text-align:center; margin-top:0;">NUEVO USUARIO</h3>
        
        <div class="photo-upload" onclick="document.getElementById('inputFoto').click()">
            <span id="placeholder-text" style="font-size:10px; color:#666; text-align:center; padding:10px;">TOCA PARA SUBIR FOTO</span>
            <img id="previewFoto" src="" style="display:none;">
        </div>
        <input type="file" id="inputFoto" hidden accept="image/*" onchange="previewImage(this)">
        
        <input type="text" id="add-nombre" placeholder="Nombre">
        <input type="text" id="add-apellido" placeholder="Apellidos">
        <input type="tel" id="add-telefono" placeholder="Número de Teléfono">
        <select id="add-rol">
            <option value="Gestor">Gestor</option>
            <option value="Administrador">Administrador</option>
        </select>
        
        <button class="btn-add" style="width:100%; padding:15px;" onclick="guardarUsuario()">REGISTRAR USUARIO</button>
        <button onclick="cerrarModal('modalAdd')" style="width:100%; background:none; color:#888; border:none; margin-top:10px; cursor:pointer;">CANCELAR</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" style="text-align:center;">
        <img id="ver-foto" class="big-user-img" src="">
        <h2 id="ver-nombre" style="margin: 10px 0 5px 0;"></h2>
        <p id="ver-rol" style="color:var(--dorado); font-weight:bold; margin-top:0; text-transform: uppercase; font-size: 14px;"></p>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <p style="text-align:left; font-size:15px; margin-bottom: 25px;"><b>Teléfono:</b> <span id="ver-tel"></span></p>
        <button class="btn-add" style="width:100%;" onclick="cerrarModal('modalVer')">CERRAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    // Nombre de tu bucket según la imagen
    const BUCKET_NAME = 'imagenes_sistema';

    async function cargarUsuarios() {
        const { data, error } = await supabaseClient.from('usuarios').select('*').order('nombre', { ascending: true });
        const grid = document.getElementById('lista-usuarios');
        
        if (data) {
            grid.innerHTML = data.map(u => `
                <div class="user-card">
                    <div class="options-btn" onclick="toggleMenu(event, ${u.id})">⋮</div>
                    <div id="menu-${u.id}" class="dropdown">
                        <button onclick="verUsuario(${JSON.stringify(u).replace(/"/g, '&quot;')})">Ver</button>
                        <button onclick="solicitarEliminar(${u.id})" style="color:var(--rojo);">Eliminar</button>
                    </div>
                    <img src="${u.foto_perfil || 'https://via.placeholder.com/150'}" class="user-img">
                    <div class="user-name">${u.nombre}</div>
                    <div class="user-role">${u.rol}</div>
                </div>
            `).join('');
        }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewFoto').src = e.target.result;
                document.getElementById('previewFoto').style.display = 'block';
                document.getElementById('placeholder-text').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function guardarUsuario() {
        const file = document.getElementById('inputFoto').files[0];
        let fotoUrl = "";

        if (file) {
            const fileName = `user_${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file);
            
            if (!error) {
                const { data: publicUrl } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
                fotoUrl = publicUrl.publicUrl;
            }
        }

        const newUser = {
            nombre: document.getElementById('add-nombre').value,
            apellidos: document.getElementById('add-apellido').value,
            telefono: document.getElementById('add-telefono').value,
            rol: document.getElementById('add-rol').value,
            foto_perfil: fotoUrl // Usando tu columna foto_perfil
        };

        const { error } = await supabaseClient.from('usuarios').insert([newUser]);
        if (!error) {
            alert("✅ Usuario añadido correctamente");
            location.reload();
        } else {
            alert("Error: " + error.message);
        }
    }

    function toggleMenu(event, id) {
        event.stopPropagation();
        const menu = document.getElementById(`menu-${id}`);
        const allMenus = document.querySelectorAll('.dropdown');
        allMenus.forEach(m => { if(m !== menu) m.style.display = 'none'; });
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    // Cerrar menús al tocar fuera
    document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown').forEach(m => m.style.display = 'none');
    });

    function verUsuario(u) {
        document.getElementById('ver-foto').src = u.foto_perfil || 'https://via.placeholder.com/150';
        document.getElementById('ver-nombre').innerText = `${u.nombre} ${u.apellidos}`;
        document.getElementById('ver-rol').innerText = u.rol;
        document.getElementById('ver-tel').innerText = u.telefono;
        abrirModal('modalVer');
    }

    async function solicitarEliminar(id) {
        const pass = prompt("Para eliminar este usuario, ingrese su contraseña de administrador:");
        // Aquí puedes cambiar "admin123" por la clave que prefieras
        if (pass === "admin123") { 
            const { error } = await supabaseClient.from('usuarios').delete().eq('id', id);
            if (!error) {
                alert("Usuario eliminado definitivamente.");
                cargarUsuarios();
            }
        } else if (pass !== null) {
            alert("Contraseña incorrecta.");
        }
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    cargarUsuarios();
</script>
</body>
</html>

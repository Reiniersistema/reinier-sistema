<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .usuarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .user-card { background: var(--gris); border-radius: 15px; padding: 15px; text-align: center; position: relative; border: 1px solid #333; }
        .user-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 10px; }
        
        .options-btn { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 20px; color: #888; padding: 0 5px; }
        .dropdown { display: none; position: absolute; top: 35px; right: 10px; background: #252525; border-radius: 8px; z-index: 10; border: 1px solid #444; min-width: 100px; }
        .dropdown button { display: block; width: 100%; padding: 10px; border: none; background: none; color: white; cursor: pointer; text-align: left; font-size: 12px; }
        .dropdown button:hover { background: #333; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--gris); max-width: 400px; margin: auto; border-radius: 15px; padding: 25px; border: 1px solid var(--dorado); }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        
        .photo-upload { width: 120px; height: 120px; background: #000; border: 2px dashed var(--dorado); border-radius: 15px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .photo-upload img { width: 100%; height: 100%; object-fit: cover; }
        .big-user-img { width: 100%; max-width: 200px; height: 200px; border-radius: 15px; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="header">
    <h2>Usuarios</h2>
    <button class="btn-add" onclick="prepararAdd()">+ AÑADIR</button>
</div>

<div class="usuarios-grid" id="lista-usuarios"></div>

<div id="modalUser" class="modal">
    <div class="modal-content">
        <h3 id="modal-titulo" style="color:var(--dorado); text-align:center; margin-top:0;">USUARIO</h3>
        
        <div class="photo-upload" onclick="document.getElementById('inputFoto').click()">
            <span id="placeholder-text" style="font-size:9px; color:#666; text-align:center;">TOCA PARA FOTO</span>
            <img id="previewFoto" src="" style="display:none;">
        </div>
        <input type="file" id="inputFoto" hidden accept="image/*" onchange="previewImage(this)">
        
        <input type="text" id="user-nombre" placeholder="Nombre">
        <input type="text" id="user-apellido" placeholder="Apellidos">
        <input type="tel" id="user-telefono" placeholder="Número de Teléfono">
        <input type="text" id="user-password" placeholder="Contraseña de acceso">
        <select id="user-rol">
            <option value="Gestor">Gestor</option>
            <option value="Administrador">Administrador</option>
        </select>
        
        <button class="btn-add" id="btnGuardar" style="width:100%; padding:15px;" onclick="guardarUsuario()">GUARDAR</button>
        <button onclick="cerrarModal('modalUser')" style="width:100%; background:none; color:#888; border:none; margin-top:10px; cursor:pointer;">CANCELAR</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" style="text-align:center;">
        <img id="ver-foto" class="big-user-img" src="">
        <h2 id="ver-nombre"></h2>
        <p id="ver-rol" style="color:var(--dorado); font-weight:bold; text-transform: uppercase;"></p>
        <p style="text-align:left;"><b>Teléfono:</b> <span id="ver-tel"></span></p>
        <button class="btn-add" style="width:100%;" onclick="cerrarModal('modalVer')">CERRAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    const BUCKET_NAME = 'imagenes_sistema';
    let editId = null; 
    let fotoExistente = "";

    async function cargarUsuarios() {
        const { data } = await supabaseClient.from('usuarios').select('*').order('nombre', { ascending: true });
        const grid = document.getElementById('lista-usuarios');
        grid.innerHTML = data.map(u => `
            <div class="user-card">
                <div class="options-btn" onclick="toggleMenu(event, ${u.id})">⋮</div>
                <div id="menu-${u.id}" class="dropdown">
                    <button onclick="verUsuario(${JSON.stringify(u).replace(/"/g, '&quot;')})">Ver</button>
                    <button onclick="prepararEdit(${JSON.stringify(u).replace(/"/g, '&quot;')})">Editar</button>
                    <button onclick="solicitarEliminar(${u.id})" style="color:var(--rojo);">Eliminar</button>
                </div>
                <img src="${u.foto_perfil || 'https://via.placeholder.com/150'}" class="user-img">
                <div style="font-weight:bold; font-size:13px;">${u.nombre}</div>
                <div style="color:var(--dorado); font-size:10px;">${u.rol}</div>
            </div>
        `).join('');
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewFoto').src = e.target.result;
                document.getElementById('previewFoto').style.display = 'block';
                document.getElementById('placeholder-text').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function prepararAdd() {
        editId = null;
        document.getElementById('modal-titulo').innerText = "NUEVO USUARIO";
        document.getElementById('user-nombre').value = "";
        document.getElementById('user-apellido').value = "";
        document.getElementById('user-telefono').value = "";
        document.getElementById('user-password').value = "";
        document.getElementById('previewFoto').style.display = 'none';
        document.getElementById('placeholder-text').style.display = 'block';
        abrirModal('modalUser');
    }

    function prepararEdit(u) {
        editId = u.id;
        fotoExistente = u.foto_perfil;
        document.getElementById('modal-titulo').innerText = "EDITAR USUARIO";
        document.getElementById('user-nombre').value = u.nombre;
        document.getElementById('user-apellido').value = u.apellidos;
        document.getElementById('user-telefono').value = u.telefono;
        document.getElementById('user-password').value = u.password || "";
        document.getElementById('user-rol').value = u.rol;
        
        if(u.foto_perfil) {
            document.getElementById('previewFoto').src = u.foto_perfil;
            document.getElementById('previewFoto').style.display = 'block';
            document.getElementById('placeholder-text').style.display = 'none';
        }
        abrirModal('modalUser');
    }

    async function guardarUsuario() {
        const file = document.getElementById('inputFoto').files[0];
        let fotoUrl = editId ? fotoExistente : "";

        if (file) {
            const fileName = `user_${Date.now()}`;
            const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file);
            if (!error) {
                const { data: pUrl } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
                fotoUrl = pUrl.publicUrl;
            }
        }

        const userData = {
            nombre: document.getElementById('user-nombre').value,
            apellidos: document.getElementById('user-apellido').value,
            telefono: document.getElementById('user-telefono').value,
            password: document.getElementById('user-password').value,
            rol: document.getElementById('user-rol').value,
            foto_perfil: fotoUrl
        };

        if (editId) {
            await supabaseClient.from('usuarios').update(userData).eq('id', editId);
        } else {
            await supabaseClient.from('usuarios').insert([userData]);
        }
        
        location.reload();
    }

    function verUsuario(u) {
        document.getElementById('ver-foto').src = u.foto_perfil || 'https://via.placeholder.com/150';
        document.getElementById('ver-nombre').innerText = `${u.nombre} ${u.apellidos}`;
        document.getElementById('ver-rol').innerText = u.rol;
        document.getElementById('ver-tel').innerText = u.telefono;
        abrirModal('modalVer');
    }

    async function solicitarEliminar(id) {
        const pass = prompt("Contraseña de administrador para eliminar:");
        if (pass === "admin123") {
            await supabaseClient.from('usuarios').delete().eq('id', id);
            cargarUsuarios();
        }
    }

    function toggleMenu(event, id) {
        event.stopPropagation();
        document.querySelectorAll('.dropdown').forEach(m => m.style.display = 'none');
        document.getElementById(`menu-${id}`).style.display = 'block';
    }

    document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(m => m.style.display = 'none'));
    function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    cargarUsuarios();
</script>
</body>
</html>

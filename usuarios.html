<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .logo-text { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; }
        .user-card { background: white; border-radius: 2rem; border-bottom: 4px solid #e2e8f0; position: relative; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; overflow-y: auto; padding: 1.5rem; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 2.5rem; overflow: hidden; }
        .input-custom { width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; padding: 0.8rem; border-radius: 1rem; font-weight: 700; outline: none; margin-top: 0.5rem; }
        .photo-upload { width: 150px; height: 150px; background: #f1f5f9; border: 3px dashed #cbd5e1; border-radius: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        .photo-preview { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="logo-text text-lg text-center flex-1">Equipo de Trabajo</h1>
        <button onclick="abrirModalNuevo()" class="bg-white text-blue-600 px-4 py-1 rounded-full text-[10px] font-black uppercase">Añadir</button>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-4" id="contenedor_usuarios">
        </main>

    <div id="modal_nuevo" class="modal">
        <div class="modal-content p-6">
            <h2 class="logo-text text-center text-blue-600 mb-6">Nuevo Usuario</h2>
            
            <div class="flex justify-center mb-6">
                <div class="photo-upload" onclick="document.getElementById('input_foto').click()">
                    <i class="fas fa-camera text-slate-300 text-2xl mb-1"></i>
                    <span class="text-[8px] font-black text-slate-400 uppercase">Subir Foto</span>
                    <img id="img_preview" class="photo-preview hidden">
                </div>
                <input type="file" id="input_foto" class="hidden" accept="image/*" onchange="previewImage(event)">
            </div>

            <div class="space-y-4">
                <div><label class="text-[9px] font-black uppercase text-slate-400 ml-2">Nombre</label><input type="text" id="u_nombre" class="input-custom"></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400 ml-2">Apellidos</label><input type="text" id="u_apellidos" class="input-custom"></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400 ml-2">Teléfono</label><input type="tel" id="u_tel" class="input-custom"></div>
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-2">Rol del Usuario</label>
                    <select id="u_rol" class="input-custom">
                        <option value="Administrador">Administrador</option>
                        <option value="Gestor">Gestor</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2 mt-8">
                <button onclick="cerrarModalNuevo()" class="flex-1 p-4 text-[10px] font-black uppercase text-slate-400">Cancelar</button>
                <button onclick="guardarUsuario()" class="flex-1 bg-blue-600 text-white p-4 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-blue-100">Registrar</button>
            </div>
        </div>
    </div>

    <div id="modal_ver" class="modal">
        <div class="modal-content p-8">
            <div class="text-center">
                <img id="ver_foto" src="" class="w-48 h-48 mx-auto rounded-[3rem] object-cover shadow-2xl border-4 border-white mb-6">
                <h2 id="ver_nombre" class="logo-text text-2xl text-slate-800 mb-1">Nombre Completo</h2>
                <span id="ver_rol" class="bg-blue-100 text-blue-600 px-4 py-1 rounded-full text-[10px] font-black uppercase">Rol</span>
            </div>
            <div class="mt-8 space-y-4 border-t pt-6">
                <div class="flex justify-between">
                    <span class="text-[10px] font-black uppercase text-slate-400">Teléfono</span>
                    <span id="ver_tel" class="text-xs font-bold text-slate-700">-</span>
                </div>
            </div>
            <button onclick="cerrarModalVer()" class="w-full bg-slate-800 text-white p-4 rounded-2xl text-[10px] font-black uppercase mt-8">Cerrar Perfil</button>
        </div>
    </div>

    <script>
        // supabaseClient ya viene de config.js

        window.onload = cargarUsuarios;

        async function cargarUsuarios() {
            const { data, error } = await supabaseClient.from('usuarios').select('*').order('nombre');
            const lista = document.getElementById('contenedor_usuarios');
            
            if (data) {
                lista.innerHTML = data.map(u => `
                    <div class="user-card p-4 flex items-center gap-4">
                        <img src="${u.foto_url || 'https://via.placeholder.com/150'}" class="w-14 h-14 rounded-2xl object-cover shadow-md">
                        <div class="flex-1">
                            <p class="text-[11px] font-black uppercase text-slate-800">${u.nombre} ${u.apellidos}</p>
                            <p class="text-[9px] font-bold text-blue-600 uppercase tracking-widest">${u.rol}</p>
                        </div>
                        <div class="relative">
                            <button onclick="toggleOpciones('${u.id}')" class="text-slate-300 p-2"><i class="fas fa-ellipsis-v"></i></button>
                            <div id="opc_${u.id}" class="hidden absolute right-0 top-10 bg-white shadow-2xl rounded-2xl border p-1 z-10 w-32">
                                <button onclick="verDetalles('${u.id}')" class="w-full text-left px-4 py-3 text-[10px] font-black text-slate-600 hover:bg-slate-50 rounded-xl">VER</button>
                                <button onclick="eliminarUsuario('${u.id}')" class="w-full text-left px-4 py-3 text-[10px] font-black text-red-500 hover:bg-red-50 rounded-xl">ELIMINAR</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function toggleOpciones(id) {
            const menu = document.getElementById(`opc_${id}`);
            document.querySelectorAll('[id^="opc_"]').forEach(m => m !== menu && m.classList.add('hidden'));
            menu.classList.toggle('hidden');
        }

        function abrirModalNuevo() { document.getElementById('modal_nuevo').classList.add('active'); }
        function cerrarModalNuevo() { document.getElementById('modal_nuevo').classList.remove('active'); }
        function cerrarModalVer() { document.getElementById('modal_ver').classList.remove('active'); }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = () => {
                const img = document.getElementById('img_preview');
                img.src = reader.result;
                img.classList.remove('hidden');
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function verDetalles(id) {
            const { data: u } = await supabaseClient.from('usuarios').select('*').eq('id', id).single();
            if (u) {
                document.getElementById('ver_foto').src = u.foto_url || 'https://via.placeholder.com/150';
                document.getElementById('ver_nombre').innerText = `${u.nombre} ${u.apellidos}`;
                document.getElementById('ver_rol').innerText = u.rol;
                document.getElementById('ver_tel').innerText = u.telefono;
                document.getElementById('modal_ver').classList.add('active');
                document.getElementById(`opc_${id}`).classList.add('hidden');
            }
        }

        async function eliminarUsuario(id) {
            const pass = prompt("Para eliminar este usuario, ingresa la contraseña de seguridad:");
            if(pass === "1234") { 
                await supabaseClient.from('usuarios').delete().eq('id', id);
                cargarUsuarios();
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        async function guardarUsuario() {
            const nuevo = {
                nombre: document.getElementById('u_nombre').value,
                apellidos: document.getElementById('u_apellidos').value,
                telefono: document.getElementById('u_tel').value,
                rol: document.getElementById('u_rol').value,
                foto_url: document.getElementById('img_preview').src
            };

            const { error } = await supabaseClient.from('usuarios').insert([nuevo]);
            if (!error) {
                cerrarModalNuevo();
                cargarUsuarios();
            } else {
                alert("Error al guardar el usuario.");
            }
        }
    </script>
</body>
</html>

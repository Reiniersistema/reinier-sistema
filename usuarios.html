<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        /* Encabezado */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Grid de Usuarios */
        .usuarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .user-card { background: var(--gris); border-radius: 15px; padding: 15px; text-align: center; position: relative; border: 1px solid #333; }
        .user-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 10px; }
        
        /* Menú de 3 puntos */
        .options-btn { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 22px; color: var(--dorado); font-weight: bold; }
        .dropdown { display: none; position: absolute; top: 35px; right: 10px; background: #252525; border-radius: 8px; z-index: 100; border: 1px solid #444; min-width: 120px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .dropdown button { display: block; width: 100%; padding: 12px; border: none; background: none; color: white; cursor: pointer; text-align: left; font-size: 13px; font-family: 'Montserrat'; border-bottom: 1px solid #333; }
        .dropdown button:last-child { border-bottom: none; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--gris); max-width: 400px; margin: 20px auto; border-radius: 15px; padding: 25px; border: 1px solid var(--dorado); }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; }
        
        .photo-box { width: 130px; height: 130px; background: #000; border: 2px dashed var(--dorado); border-radius: 15px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }

        .btn-save { background: var(--dorado); color: black; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2>Usuarios Registrados</h2>
    <button class="btn-add" onclick="abrirFormulario()">+ AÑADIR</button>
</div>

<div class="usuarios-grid" id="lista-usuarios">
    </div>

<div id="modalForm" class="modal">
    <div class="modal-content">
        <h3 id="form-titulo" style="color:var(--dorado); text-align:center; margin-top:0;">NUEVO USUARIO</h3>
        
        <div class="photo-box" onclick="document.getElementById('inputFoto').click()">
            <span id="txt-foto" style="font-size:10px; color:#666;">FOTO AQUÍ</span>
            <img id="img-preview" src="" style="display:none;">
        </div>
        <input type="file" id="inputFoto" hidden accept="image/*" onchange="previsualizar(this)">
        
        <input type="text" id="u-nombre" placeholder="Nombre">
        <input type="text" id="u-apellidos" placeholder="Apellidos">
        <input type="tel" id="u-telefono" placeholder="Teléfono">
        <input type="text" id="u-password" placeholder="Contraseña">
        <select id="u-rol">
            <option value="Gestor">Gestor</option>
            <option value="Administrador">Administrador</option>
        </select>
        
        <button class="btn-save" onclick="guardarUsuario()">GUARDAR USUARIO</button>
        <button onclick="cerrarModal('modalForm')" style="width:100%; background:none; color:#888; border:none; margin-top:10px; cursor:pointer;">CANCELAR</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" style="text-align:center;">
        <img id="ver-img" style="width:200px; height:200px; border-radius:15px; object-fit:cover; border:3px solid var(--dorado); margin-bottom:15px;">
        <h2 id="ver-full-nombre" style="margin:5px 0;"></h2>
        <p id="ver-rol-txt" style="color:var(--dorado); font-weight:bold; text-transform:uppercase; margin-bottom:20px;"></p>
        <div style="text-align:left; border-top:1px solid #333; padding-top:15px;">
            <p><b>Teléfono:</b> <span id="ver-tel-txt"></span></p>
        </div>
        <button class="btn-save" onclick="cerrarModal('modalVer')">CERRAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    const BUCKET = 'imagenes_sistema';
    let idEdicion = null;
    let fotoActualURL = "";
    let listaUsuarios = [];

    // CARGAR LISTADO
    async function cargarUsuarios() {
        const { data, error } = await supabaseClient.from('usuarios').select('*').order('nombre');
        if (error) return alert("Error al cargar: " + error.message);
        
        listaUsuarios = data;
        const grid = document.getElementById('lista-usuarios');
        grid.innerHTML = "";

        data.forEach((user, index) => {
            grid.innerHTML += `
                <div class="user-card">
                    <div class="options-btn" onclick="toggleMenu(event, ${user.id})">⋮</div>
                    <div id="menu-${user.id}" class="dropdown">
                        <button onclick="verUsuario(${index})">Ver</button>
                        <button onclick="editarUsuario(${index})">Editar</button>
                        <button onclick="eliminarUsuario(${user.id})" style="color:var(--rojo);">Eliminar</button>
                    </div>
                    <img src="${user.foto_perfil || 'https://via.placeholder.com/150'}" class="user-img">
                    <div style="font-weight:bold; font-size:14px;">${user.nombre}</div>
                    <div style="font-size:11px; color:var(--dorado); text-transform:uppercase;">${user.rol}</div>
                </div>
            `;
        });
    }

    // GESTIÓN DE MENÚ
    function toggleMenu(e, id) {
        e.stopPropagation();
        document.querySelectorAll('.dropdown').forEach(m => m.style.display = 'none');
        const menu = document.getElementById(`menu-${id}`);
        menu.style.display = 'block';
    }
    document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(m => m.style.display = 'none'));

    // PREVISUALIZAR FOTO
    function previsualizar(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('img-preview').src = e.target.result;
                document.getElementById('img-preview').style.display = 'block';
                document.getElementById('txt-foto').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ABRIR FORMULARIO (NUEVO)
    function abrirFormulario() {
        idEdicion = null;
        fotoActualURL = "";
        document.getElementById('form-titulo').innerText = "NUEVO USUARIO";
        document.getElementById('u-nombre').value = "";
        document.getElementById('u-apellidos').value = "";
        document.getElementById('u-telefono').value = "";
        document.getElementById('u-password').value = "";
        document.getElementById('img-preview').style.display = 'none';
        document.getElementById('txt-foto').style.display = 'block';
        document.getElementById('modalForm').style.display = 'block';
    }

    // EDITAR USUARIO
    function editarUsuario(index) {
        const u = listaUsuarios[index];
        idEdicion = u.id;
        fotoActualURL = u.foto_perfil;
        
        document.getElementById('form-titulo').innerText = "EDITAR USUARIO";
        document.getElementById('u-nombre').value = u.nombre;
        document.getElementById('u-apellidos').value = u.apellidos;
        document.getElementById('u-telefono').value = u.telefono;
        document.getElementById('u-password').value = u.password;
        document.getElementById('u-rol').value = u.rol;
        
        if(u.foto_perfil) {
            document.getElementById('img-preview').src = u.foto_perfil;
            document.getElementById('img-preview').style.display = 'block';
            document.getElementById('txt-foto').style.display = 'none';
        }
        document.getElementById('modalForm').style.display = 'block';
    }

    // VER DETALLES
    function verUsuario(index) {
        const u = listaUsuarios[index];
        document.getElementById('ver-img').src = u.foto_perfil || 'https://via.placeholder.com/150';
        document.getElementById('ver-full-nombre').innerText = `${u.nombre} ${u.apellidos}`;
        document.getElementById('ver-rol-txt').innerText = u.rol;
        document.getElementById('ver-tel-txt').innerText = u.telefono;
        document.getElementById('modalVer').style.display = 'block';
    }

    // GUARDAR (CREAR O ACTUALIZAR)
    async function guardarUsuario() {
        const file = document.getElementById('inputFoto').files[0];
        let finalFoto = fotoActualURL;

        if (file) {
            const name = `user_${Date.now()}`;
            const { data } = await supabaseClient.storage.from(BUCKET).upload(name, file);
            if (data) {
                const { data: pUrl } = supabaseClient.storage.from(BUCKET).getPublicUrl(name);
                finalFoto = pUrl.publicUrl;
            }
        }

        const datos = {
            nombre: document.getElementById('u-nombre').value,
            apellidos: document.getElementById('u-apellidos').value,
            telefono: document.getElementById('u-telefono').value,
            password: document.getElementById('u-password').value,
            rol: document.getElementById('u-rol').value,
            foto_perfil: finalFoto
        };

        if (idEdicion) {
            await supabaseClient.from('usuarios').update(datos).eq('id', idEdicion);
        } else {
            await supabaseClient.from('usuarios').insert([datos]);
        }

        cerrarModal('modalForm');
        cargarUsuarios();
    }

    // ELIMINAR
    async function eliminarUsuario(id) {
        const pass = prompt("Para eliminar, ingresa la contraseña de confirmación:");
        if (pass === "admin123") { // Cambia esto por tu lógica de seguridad
            await supabaseClient.from('usuarios').delete().eq('id', id);
            cargarUsuarios();
        }
    }

    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    cargarUsuarios();
</script>
</body>
</html>

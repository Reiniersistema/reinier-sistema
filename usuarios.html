<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* ESTILOS DEL MENÚ UNIVERSAL */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 3000; top: 0; left: 0;
            background-color: #1e1e1e;
            overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid #d4af37;
        }
        .sidebar a {
            padding: 12px 24px; text-decoration: none;
            font-size: 15px; color: #818181;
            display: block; transition: 0.3s;
            text-transform: uppercase;
        }
        .sidebar a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #d4af37; }

        .header-nav-universal { 
            display: flex; align-items: center; gap: 15px; 
            padding: 15px; background: #121212; 
            border-bottom: 1px solid #d4af37; margin-bottom: 20px;
        }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }

        /* Estilos de la página */
        .contenedor-principal { padding: 0 15px; }
        .header-seccion { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 16px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
        
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; }

        /* Grid de Usuarios */
        .usuarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .user-card { background: var(--gris); border-radius: 20px; padding: 20px 10px; text-align: center; border: 1px solid #333; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .user-card:active { transform: scale(0.95); background: #252525; }
        .user-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 12px; background: #000; }
        
        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; overflow-y: auto; }
        .modal-content { background: var(--gris); max-width: 400px; margin: 20px auto; border-radius: 25px; padding: 30px 20px; border: 1px solid var(--dorado); position: relative; }
        
        input, select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: 'Montserrat'; font-size: 14px; }
        input:disabled, select:disabled { opacity: 0.7; color: #aaa; border-style: dashed; }
        
        .photo-area { width: 130px; height: 130px; background: #000; border: 2px dashed var(--dorado); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }

        .btn-accion { width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; font-family: 'Montserrat'; text-transform: uppercase; font-size: 12px; }
        .btn-editar { background: var(--azul); color: white; }
        .btn-eliminar { background: var(--rojo); color: white; }
        .btn-cancelar { background: transparent; color: #888; border: 1px solid #444; }
        .btn-guardar { background: var(--dorado); color: black; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <div class="header-seccion">
        <h2>GESTIÓN DE EQUIPO</h2>
        <button class="btn-add" onclick="abrirParaCrear()">+ AÑADIR</button>
    </div>

    <div class="usuarios-grid" id="grid-usuarios">
        </div>
</div>

<div id="modalPlanilla" class="modal">
    <div class="modal-content">
        <h3 id="modal-titulo" style="text-align:center; color:var(--dorado); margin-top:0; text-transform:uppercase; font-size:16px;">PLANILLA DE USUARIO</h3>
        
        <div id="area-foto" class="photo-area" onclick="document.getElementById('inputFoto').click()">
            <img id="p-img" src="">
        </div>
        <input type="file" id="inputFoto" hidden accept="image/*" onchange="previewFoto(this)">

        <div id="campos-datos">
            <input type="text" id="p-nombre" placeholder="Nombre">
            <input type="text" id="p-apellidos" placeholder="Apellidos">
            <input type="tel" id="p-telefono" placeholder="Teléfono">
            <input type="password" id="p-pass" placeholder="Contraseña">
            <select id="p-rol">
                <option value="Gestor">Gestor</option>
                <option value="Administrador">Administrador</option>
            </select>
        </div>

        <div id="controles-ver">
            <button class="btn-accion btn-editar" onclick="modoEdicion()">EDITAR PERFIL</button>
            <button class="btn-accion btn-eliminar" onclick="eliminarActual()">ELIMINAR ACCESO</button>
        </div>

        <div id="controles-edit" style="display:none;">
            <button class="btn-accion btn-guardar" onclick="guardar()">GUARDAR CAMBIOS</button>
        </div>
        
        <button class="btn-accion btn-cancelar" onclick="cerrarModal()">VOLVER</button>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
    let listaUsuarios = [];
    let usuarioActivo = null;
    let fotoTempURL = "";

    async function cargar() {
        const { data, error } = await supabaseClient.from('usuarios').select('*').order('nombre');
        if(error) return console.error(error);
        
        listaUsuarios = data || [];
        const grid = document.getElementById('grid-usuarios');
        grid.innerHTML = listaUsuarios.map((u, i) => `
            <div class="user-card" onclick="verUsuario(${i})">
                <img src="${u.foto_perfil || 'https://via.placeholder.com/150'}" class="user-img">
                <div style="font-weight:bold; font-size:14px; text-transform:capitalize;">${u.nombre}</div>
                <div style="font-size:10px; color:var(--dorado); text-transform:uppercase; margin-top:5px; letter-spacing:1px;">${u.rol}</div>
            </div>
        `).join('');
    }

    function verUsuario(index) {
        usuarioActivo = listaUsuarios[index];
        fotoTempURL = usuarioActivo.foto_perfil;
        
        document.getElementById('modal-titulo').innerText = "PLANILLA DE USUARIO";
        document.getElementById('p-img').src = usuarioActivo.foto_perfil || 'https://via.placeholder.com/150';
        document.getElementById('p-nombre').value = usuarioActivo.nombre;
        document.getElementById('p-apellidos').value = usuarioActivo.apellidos || "";
        document.getElementById('p-telefono').value = usuarioActivo.telefono || "";
        document.getElementById('p-pass').value = usuarioActivo.password;
        document.getElementById('p-rol').value = usuarioActivo.rol;

        alternarInputs(true);
        document.getElementById('controles-ver').style.display = 'block';
        document.getElementById('controles-edit').style.display = 'none';
        document.getElementById('modalPlanilla').style.display = 'block';
    }

    function modoEdicion() {
        document.getElementById('modal-titulo').innerText = "EDITANDO DATOS";
        alternarInputs(false);
        document.getElementById('controles-ver').style.display = 'none';
        document.getElementById('controles-edit').style.display = 'block';
    }

    function abrirParaCrear() {
        usuarioActivo = null;
        fotoTempURL = "";
        document.getElementById('modal-titulo').innerText = "NUEVO INTEGRANTE";
        document.getElementById('p-img').src = "https://via.placeholder.com/150";
        document.getElementById('p-nombre').value = "";
        document.getElementById('p-apellidos').value = "";
        document.getElementById('p-telefono').value = "";
        document.getElementById('p-pass').value = "";
        
        alternarInputs(false);
        document.getElementById('controles-ver').style.display = 'none';
        document.getElementById('controles-edit').style.display = 'block';
        document.getElementById('modalPlanilla').style.display = 'block';
    }

    function alternarInputs(estado) {
        const ids = ['p-nombre', 'p-apellidos', 'p-telefono', 'p-pass', 'p-rol'];
        ids.forEach(id => document.getElementById(id).disabled = estado);
        document.getElementById('area-foto').style.pointerEvents = estado ? 'none' : 'auto';
        document.getElementById('area-foto').style.borderStyle = estado ? 'solid' : 'dashed';
    }

    function previewFoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('p-img').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function guardar() {
        const file = document.getElementById('inputFoto').files[0];
        let urlFinal = fotoTempURL;

        if (file) {
            const fileName = `profile_${Date.now()}`;
            const { data, error } = await supabaseClient.storage.from('imagenes_sistema').upload(fileName, file);
            if (data) {
                const { data: pUrl } = supabaseClient.storage.from('imagenes_sistema').getPublicUrl(fileName);
                urlFinal = pUrl.publicUrl;
            }
        }

        const datos = {
            nombre: document.getElementById('p-nombre').value,
            apellidos: document.getElementById('p-apellidos').value,
            telefono: document.getElementById('p-telefono').value,
            password: document.getElementById('p-pass').value,
            rol: document.getElementById('p-rol').value,
            foto_perfil: urlFinal
        };

        if(!datos.nombre || !datos.password) return alert("Nombre y contraseña son obligatorios.");

        if (usuarioActivo) {
            await supabaseClient.from('usuarios').update(datos).eq('id', usuarioActivo.id);
        } else {
            await supabaseClient.from('usuarios').insert([datos]);
        }
        location.reload();
    }

    async function eliminarActual() {
        const pass = prompt("Acción Crítica. Escribe 'ELIMINAR' para confirmar:");
        if (pass === "ELIMINAR") {
            const { error } = await supabaseClient.from('usuarios').delete().eq('id', usuarioActivo.id);
            if(!error) location.reload();
        }
    }

    function cerrarModal() { document.getElementById('modalPlanilla').style.display = 'none'; }

    cargar();
</script>
</body>
</html>

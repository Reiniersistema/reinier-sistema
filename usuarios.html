<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        .btn-add { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Contenedor de las tarjetas */
        .usuarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .user-card { background: var(--gris); border-radius: 15px; padding: 20px 10px; text-align: center; position: relative; border: 1px solid #333; }
        .user-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); margin-bottom: 10px; }
        
        /* LOS TRES PUNTOS Y SU MENÚ */
        .options-container { position: absolute; top: 10px; right: 10px; }
        .options-btn { cursor: pointer; font-size: 24px; color: var(--dorado); line-height: 1; padding: 5px; }
        
        .dropdown { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 30px; 
            background: #252525; 
            border: 1px solid #444; 
            border-radius: 8px; 
            z-index: 1000; 
            min-width: 120px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .dropdown button { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            border: none; 
            background: none; 
            color: white; 
            text-align: left; 
            font-size: 14px; 
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .dropdown button:last-child { border-bottom: none; }

        /* MODALES */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: var(--gris); max-width: 400px; margin: 30px auto; border-radius: 15px; padding: 20px; border: 1px solid var(--dorado); }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        
        .photo-preview { width: 120px; height: 120px; background: #000; border: 2px dashed var(--dorado); border-radius: 15px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="header">
    <h2>USUARIOS</h2>
    <button class="btn-add" onclick="abrirParaCrear()">+ AÑADIR</button>
</div>

<div class="usuarios-grid" id="lista-usuarios"></div>

<div id="modalUsuario" class="modal">
    <div class="modal-content">
        <h3 id="modal-titulo" style="text-align:center; color:var(--dorado);">AÑADIR USUARIO</h3>
        
        <div class="photo-preview" onclick="document.getElementById('inputFoto').click()">
            <span id="label-foto" style="font-size:10px; color:#666;">SUBIR FOTO</span>
            <img id="img-edit" style="display:none;">
        </div>
        <input type="file" id="inputFoto" hidden accept="image/*" onchange="preview(this)">

        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellidos" placeholder="Apellidos">
        <input type="tel" id="telefono" placeholder="Teléfono">
        <input type="text" id="password" placeholder="Contraseña">
        <select id="rol">
            <option value="Gestor">Gestor</option>
            <option value="Administrador">Administrador</option>
        </select>

        <button class="btn-add" style="width:100%; padding:15px;" onclick="guardar()">GUARDAR CAMBIOS</button>
        <button onclick="cerrarModal('modalUsuario')" style="width:100%; background:none; color:grey; border:none; margin-top:10px;">CANCELAR</button>
    </div>
</div>

<div id="modalVer" class="modal">
    <div class="modal-content" style="text-align:center;">
        <img id="ver-foto" style="width:180px; height:180px; border-radius:15px; object-fit:cover; border:2px solid var(--dorado);">
        <h2 id="ver-nombre" style="margin:10px 0;"></h2>
        <p id="ver-rol" style="color:var(--dorado); font-weight:bold;"></p>
        <p id="ver-tel" style="border-top:1px solid #333; padding-top:10px;"></p>
        <button class="btn-add" style="width:100%;" onclick="cerrarModal('modalVer')">CERRAR</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    let usuarios = [];
    let idEditando = null;
    let urlFotoExistente = "";

    async function cargar() {
        const { data } = await supabaseClient.from('usuarios').select('*').order('nombre');
        usuarios = data || [];
        const grid = document.getElementById('lista-usuarios');
        grid.innerHTML = usuarios.map((u, i) => `
            <div class="user-card">
                <div class="options-container">
                    <div class="options-btn" onclick="toggleMenu(event, ${u.id})">⋮</div>
                    <div id="menu-${u.id}" class="dropdown">
                        <button onclick="ver(${i})">Ver</button>
                        <button onclick="editar(${i})">Editar</button>
                        <button onclick="eliminar(${u.id})" style="color:red;">Eliminar</button>
                    </div>
                </div>
                <img src="${u.foto_perfil || 'https://via.placeholder.com/150'}" class="user-img">
                <div style="font-weight:bold;">${u.nombre}</div>
                <div style="font-size:12px; color:var(--dorado);">${u.rol}</div>
            </div>
        `).join('');
    }

    function toggleMenu(e, id) {
        e.stopPropagation();
        document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        document.getElementById(`menu-${id}`).style.display = 'block';
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
    });

    function preview(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('img-edit').src = e.target.result;
                document.getElementById('img-edit').style.display = 'block';
                document.getElementById('label-foto').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function abrirParaCrear() {
        idEditando = null;
        document.getElementById('modal-titulo').innerText = "AÑADIR USUARIO";
        document.getElementById('nombre').value = "";
        document.getElementById('apellidos').value = "";
        document.getElementById('telefono').value = "";
        document.getElementById('password').value = "";
        document.getElementById('img-edit').style.display = 'none';
        document.getElementById('label-foto').style.display = 'block';
        document.getElementById('modalUsuario').style.display = 'block';
    }

    function editar(index) {
        const u = usuarios[index];
        idEditando = u.id;
        urlFotoExistente = u.foto_perfil;
        document.getElementById('modal-titulo').innerText = "EDITAR USUARIO";
        document.getElementById('nombre').value = u.nombre;
        document.getElementById('apellidos').value = u.apellidos;
        document.getElementById('telefono').value = u.telefono;
        document.getElementById('password').value = u.password;
        document.getElementById('rol').value = u.rol;
        if(u.foto_perfil) {
            document.getElementById('img-edit').src = u.foto_perfil;
            document.getElementById('img-edit').style.display = 'block';
            document.getElementById('label-foto').style.display = 'none';
        }
        document.getElementById('modalUsuario').style.display = 'block';
    }

    function ver(index) {
        const u = usuarios[index];
        document.getElementById('ver-foto').src = u.foto_perfil || 'https://via.placeholder.com/150';
        document.getElementById('ver-nombre').innerText = u.nombre + " " + u.apellidos;
        document.getElementById('ver-rol').innerText = u.rol;
        document.getElementById('ver-tel').innerText = "Teléfono: " + u.telefono;
        document.getElementById('modalVer').style.display = 'block';
    }

    async function guardar() {
        const file = document.getElementById('inputFoto').files[0];
        let fotoURL = idEditando ? urlFotoExistente : "";

        if (file) {
            const fileName = `user_${Date.now()}`;
            const { data } = await supabaseClient.storage.from('imagenes_sistema').upload(fileName, file);
            if (data) {
                const { data: pUrl } = supabaseClient.storage.from('imagenes_sistema').getPublicUrl(fileName);
                fotoURL = pUrl.publicUrl;
            }
        }

        const datos = {
            nombre: document.getElementById('nombre').value,
            apellidos: document.getElementById('apellidos').value,
            telefono: document.getElementById('telefono').value,
            password: document.getElementById('password').value,
            rol: document.getElementById('rol').value,
            foto_perfil: fotoURL
        };

        if (idEditando) {
            await supabaseClient.from('usuarios').update(datos).eq('id', idEditando);
        } else {
            await supabaseClient.from('usuarios').insert([datos]);
        }
        location.reload();
    }

    async function eliminar(id) {
        const confirmPass = prompt("Ingresa tu contraseña de administrador para eliminar:");
        if (confirmPass === "admin123") { // Aquí puedes poner la lógica real de tu clave
            await supabaseClient.from('usuarios').delete().eq('id', id);
            location.reload();
        }
    }

    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    cargar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Chofer - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .input-group { background: white; border-radius: 1.5rem; padding: 1.2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        input, select { width: 100%; background: #f8fafc; border: none; padding: 0.75rem; border-radius: 0.8rem; font-weight: bold; font-size: 14px; outline: none; margin-top: 0.5rem; }
        input:focus { ring: 2px solid #1e5bb9; }
        label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="choferes.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter text-center flex-1">Nuevo Chofer</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 max-w-xl mx-auto space-y-4">
        
        <div class="input-group">
            <p class="text-blue-600 font-black text-xs uppercase mb-4 border-b pb-2">Datos Personales</p>
            <div class="space-y-3">
                <div>
                    <label>Nombre del Chofer</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan">
                </div>
                <div>
                    <label>Apellidos</label>
                    <input type="text" id="apellidos" placeholder="Ej: Pérez García">
                </div>
                <div>
                    <label>Teléfono (WhatsApp)</label>
                    <input type="tel" id="telefono" placeholder="5XXXXXXX">
                </div>
            </div>
        </div>

        <div class="input-group">
            <p class="text-blue-600 font-black text-xs uppercase mb-4 border-b pb-2">Vehículo</p>
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                    <label>Marca y Modelo</label>
                    <input type="text" id="auto_marca" placeholder="Ej: Hyundai Elantra">
                </div>
                <div>
                    <label>Color</label>
                    <input type="text" id="auto_color" placeholder="Ej: Blanco">
                </div>
                <div>
                    <label>Grupo</label>
                    <select id="grupo">
                        <option value="Auto">Auto</option>
                        <option value="Moto">Moto</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-group">
            <p class="text-blue-600 font-black text-xs uppercase mb-4 border-b pb-2">Configuración y Fondos</p>
            <div class="space-y-4">
                <div>
                    <label>Fondo Inicial ($)</label>
                    <input type="number" id="fondo_inicial" value="0" class="text-green-600 font-black">
                </div>
                
                <div class="flex flex-col gap-3 pt-2">
                    <label class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl cursor-pointer">
                        <input type="checkbox" id="lic_operativa" class="w-5 h-5 mt-0">
                        <span class="text-[11px] font-bold text-slate-700">TIENE LICENCIA OPERATIVA (12%)</span>
                    </label>
                    
                    <label class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl cursor-pointer">
                        <input type="checkbox" id="aire_acondicionado" class="w-5 h-5 mt-0" checked>
                        <span class="text-[11px] font-bold text-slate-700">TIENE AIRE ACONDICIONADO</span>
                    </label>

                    <label class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl cursor-pointer">
                        <input type="checkbox" id="sin_credito" class="w-5 h-5 mt-0">
                        <span class="text-[11px] font-bold text-slate-700">PERMITIR TRABAJAR SIN CRÉDITO</span>
                    </label>
                </div>
            </div>
        </div>

        <button onclick="guardarChofer()" class="w-full bg-[#1e5bb9] text-white p-5 rounded-[2rem] font-black uppercase italic tracking-tighter shadow-xl mt-4 active:scale-95 transition-transform">
            Registrar Chofer
        </button>

    </main>

    <script>
        // La variable 'supabaseClient' ya está lista gracias a config.js

        async function guardarChofer() {
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;

            if(!nombre || !telefono) {
                alert("Por favor rellena al menos Nombre y Teléfono");
                return;
            }

            const nuevoChofer = {
                nombre: nombre,
                apellidos: document.getElementById('apellidos').value,
                telefono: telefono,
                auto_marca: document.getElementById('auto_marca').value,
                auto_color: document.getElementById('auto_color').value,
                grupo: document.getElementById('grupo').value,
                fondo_actual: parseFloat(document.getElementById('fondo_inicial').value) || 0,
                lic_operativa: document.getElementById('lic_operativa').checked,
                aire_acondicionado: document.getElementById('aire_acondicionado').checked,
                trabajar_sin_credito: document.getElementById('sin_credito').checked
            };

            const { data, error } = await supabaseClient
                .from('choferes')
                .insert([nuevoChofer]);

            if(error) {
                alert("Error al guardar: " + error.message);
            } else {
                alert("Chofer registrado correctamente");
                window.location.href = 'choferes.html';
            }
        }
    </script>
</body>
</html>

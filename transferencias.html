<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --verde: #28a745; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 50px; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 3000; top: 0; left: 0; background-color: #1e1e1e; overflow-x: hidden; transition: 0.5s; padding-top: 60px; border-right: 1px solid #d4af37; }
        .sidebar a { padding: 12px 24px; text-decoration: none; font-size: 15px; color: #818181; display: block; text-transform: uppercase; }
        .header-nav-universal { display: flex; align-items: center; gap: 15px; padding: 15px; background: #121212; border-bottom: 1px solid #d4af37; margin-bottom: 20px; }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }
        .contenedor-principal { padding: 0 15px; }
        .header-seccion { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        .btn-action { background: var(--dorado); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        #formAdd { display: none; background: var(--gris); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--dorado); }
        label { display: block; font-size: 10px; color: var(--dorado); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px 10px; color: var(--dorado); font-size: 10px; border-bottom: 2px solid #333; background: #1a1a1a; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 12px; }
        .status { font-size: 9px; font-weight: bold; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .pendiente { background: #444; color: #bbb; }
        .aprobado { background: var(--verde); color: white; }
    </style>
</head>
<body>

<div class="header-nav-universal">
    <div class="logo-txt-universal">RF <span style="color: var(--dorado);">Transferencias</span></div>
</div>

<div class="contenedor-principal">
    <div class="header-seccion">
        <h2>Historial de Pagos</h2>
        <button class="btn-action" onclick="toggleForm()">+ Nuevo</button>
    </div>

    <div id="formAdd">
        <label>Chófer (Nombre Exacto)</label>
        <input type="text" id="chofer-id" placeholder="Ej: Juan Perez">
        <label>Monto ($)</label>
        <input type="number" id="monto-pago">
        <label>Método</label>
        <select id="tipo-pago"><option>Transferencia</option><option>Zelle</option><option>Otros</option></select>
        <button class="btn-action" onclick="guardarTransferencia()" style="width:100%; padding:15px;">ENVIAR A REVISIÓN</button>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead><tr><th>Fecha</th><th>Chófer</th><th>Monto</th><th>Estado</th></tr></thead>
            <tbody id="lista-transferencias"></tbody>
        </table>
    </div>
</div>

<script src="config.js"></script>
<script>
    function toggleForm() { const f = document.getElementById('formAdd'); f.style.display = (f.style.display==='block')?'none':'block'; }

    async function cargarTransferencias() {
        const { data } = await supabaseClient.from('transferencias').select('*').order('created_at', { ascending: false });
        document.getElementById('lista-transferencias').innerHTML = (data || []).map(t => `
            <tr>
                <td>${t.fecha}</td>
                <td><b>${t.nombre_chofer}</b></td>
                <td style="color:var(--dorado)">$${t.monto}</td>
                <td><span class="status ${t.aprobado?'aprobado':'pendiente'}">${t.aprobado?'Aprobado':'En Espera'}</span></td>
            </tr>
        `).join('');
    }

    async function guardarTransferencia() {
        const user = JSON.parse(localStorage.getItem('usuario_activo'))?.nombre || 'Gestor';
        const datos = {
            nombre_chofer: document.getElementById('chofer-id').value,
            nombre_usuario: user,
            tipo_pago: document.getElementById('tipo-pago').value,
            monto: parseFloat(document.getElementById('monto-pago').value),
            fecha: new Date().toISOString().split('T')[0],
            aprobado: false
        };
        await supabaseClient.from('transferencias').insert([datos]);
        location.reload();
    }
    cargarTransferencias();
</script>
</body>
</html>

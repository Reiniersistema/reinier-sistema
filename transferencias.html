<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #dc3545; --verde: #28a745; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--dorado); padding-bottom: 10px; }
        h2 { color: var(--dorado); font-size: 18px; text-transform: uppercase; margin: 0; }
        .btn-action { background: var(--dorado); color: black; border: none; padding: 10px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; }
        #formAdd { display: none; background: #252525; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--dorado); }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        .tabla-contenedor { background: var(--gris); border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 12px 10px; color: var(--dorado); font-size: 10px; text-transform: uppercase; border-bottom: 2px solid #333; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 12px; }
        .status { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; }
        .pendiente { background: #555; color: white; }
        .aprobado { background: var(--verde); color: white; }
    </style>
</head>
<body>

<div class="header">
    <h2>Registro de Pagos</h2>
    <button class="btn-action" onclick="toggleForm()">+ AÑADIR PAGO</button>
</div>

<div id="formAdd">
    <label style="font-size:10px; color:var(--dorado)">CHÓFER (NOMBRE O TELÉFONO)</label>
    <input type="text" id="chofer-id" placeholder="Ej: Juan Perez o 52345678">
    <input type="text" id="usuario-nombre" placeholder="Tu nombre (Gestor)">
    <select id="tipo-pago">
        <option value="Transferencia">Transferencia</option>
        <option value="Efectivo">Efectivo</option>
    </select>
    <input type="number" id="monto-pago" placeholder="Monto $">
    <input type="date" id="fecha-pago">
    <button class="btn-action" onclick="guardarTransferencia()" style="width:100%; padding:15px;">ENVIAR A APROBACIÓN</button>
</div>

<div class="tabla-contenedor">
    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Identificador</th>
                <th>Monto</th>
                <th>Método</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="lista-transferencias"></tbody>
    </table>
</div>

<script src="config.js"></script>
<script>
    function toggleForm() {
        const f = document.getElementById('formAdd');
        f.style.display = f.style.display === 'block' ? 'none' : 'block';
    }

    async function cargarTransferencias() {
        const { data } = await supabaseClient.from('transferencias').select('*').order('created_at', { ascending: false });
        const tbody = document.getElementById('lista-transferencias');
        tbody.innerHTML = data.map(t => `
            <tr>
                <td>${t.fecha}</td>
                <td><b>${t.nombre_chofer}</b></td>
                <td style="color:var(--dorado)">$${t.monto}</td>
                <td>${t.tipo_pago}</td>
                <td><span class="status ${t.aprobado ? 'aprobado' : 'pendiente'}">${t.aprobado ? 'Aprobado' : 'En Espera'}</span></td>
            </tr>
        `).join('');
    }

    async function guardarTransferencia() {
        const datos = {
            nombre_chofer: document.getElementById('chofer-id').value,
            nombre_usuario: document.getElementById('usuario-nombre').value,
            tipo_pago: document.getElementById('tipo-pago').value,
            monto: parseFloat(document.getElementById('monto-pago').value),
            fecha: document.getElementById('fecha-pago').value || new Date().toISOString().split('T')[0],
            aprobado: false
        };

        if(!datos.nombre_chofer || !datos.monto) return alert("Faltan datos");

        const { error } = await supabaseClient.from('transferencias').insert([datos]);
        if(!error) {
            alert("✅ Pago registrado. Pendiente de aprobación en el Panel.");
            location.reload();
        }
    }
    cargarTransferencias();
</script>
</body>
</html>

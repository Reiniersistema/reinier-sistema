<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Viajes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .logo-text { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; }
        .filter-card { background: white; border-radius: 2rem; border-bottom: 4px solid #e2e8f0; }
        .input-custom { width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; padding: 0.8rem 1rem; border-radius: 1rem; font-weight: 700; outline: none; transition: all 0.3s; }
        .input-custom:focus { border-color: #1e5bb9; background: white; }
        .btn-command { padding: 1rem; border-radius: 1.2rem; font-weight: 900; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; transition: all 0.2s; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="logo-text text-lg text-center flex-1">Búsqueda Avanzada</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 max-w-3xl mx-auto space-y-6">
        
        <div class="filter-card p-6 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block ml-2">Dato a buscar</label>
                    <input type="text" id="busqueda_general" placeholder="Chofer, Cliente, Origen..." class="input-custom">
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block ml-2">Tipo de Filtro</label>
                    <select id="tipo_filtro" onchange="actualizarInterfazFiltro()" class="input-custom">
                        <option value="todos">Todos los registros</option>
                        <option value="fecha">Por Fecha Específica</option>
                        <option value="rango">Desde - Hasta</option>
                        <option value="mes">Por Mes</option>
                    </select>
                </div>

                <div id="contenedor_dinamico" class="md:col-span-2 hidden">
                    <div id="div_fecha" class="hidden">
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block ml-2">Seleccione Fecha</label>
                        <input type="date" id="filtro_fecha" class="input-custom">
                    </div>

                    <div id="div_rango" class="hidden grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block ml-2">Desde</label>
                            <input type="date" id="filtro_desde" class="input-custom">
                        </div>
                        <div>
                            <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block ml-2">Hasta</label>
                            <input type="date" id="filtro_hasta" class="input-custom">
                        </div>
                    </div>

                    <div id="div_mes" class="hidden">
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block ml-2">Seleccione Mes</label>
                        <input type="month" id="filtro_mes" class="input-custom">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-8">
                <button onclick="window.location.href='panel.html'" class="btn-command bg-slate-100 text-slate-500 hover:bg-slate-200">
                    <i class="fas fa-times mr-2"></i> Cancelar
                </button>
                <button onclick="ejecutarFiltro()" class="btn-command bg-[#1e5bb9] text-white shadow-lg shadow-blue-200 hover:scale-[1.02]">
                    <i class="fas fa-search mr-2"></i> Filtrar
                </button>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] overflow-hidden shadow-sm border-b-4 border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-4 text-[9px] font-black uppercase text-slate-500">Info Viaje</th>
                            <th class="px-6 py-4 text-[9px] font-black uppercase text-slate-500">Chofer/Cliente</th>
                            <th class="px-6 py-4 text-[9px] font-black uppercase text-slate-500">Ruta</th>
                            <th class="px-6 py-4 text-[9px] font-black uppercase text-slate-500 text-right">Precio</th>
                        </tr>
                    </thead>
                    <tbody id="resultados_busqueda" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-slate-400 text-xs font-bold italic uppercase opacity-50">
                                Realice una búsqueda para ver resultados
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        function actualizarInterfazFiltro() {
            const tipo = document.getElementById('tipo_filtro').value;
            const contenedor = document.getElementById('contenedor_dinamico');
            
            // Ocultar todos los div de opciones
            document.getElementById('div_fecha').classList.add('hidden');
            document.getElementById('div_rango').classList.add('hidden');
            document.getElementById('div_mes').classList.add('hidden');
            
            if (tipo === 'todos') {
                contenedor.classList.add('hidden');
            } else {
                contenedor.classList.remove('hidden');
                document.getElementById(`div_${tipo}`).classList.remove('hidden');
            }
        }

        async function ejecutarFiltro() {
            const busqueda = document.getElementById('busqueda_general').value.toLowerCase();
            const tipo = document.getElementById('tipo_filtro').value;
            
            let query = supabaseClient.from('viajes').select('*').order('created_at', { ascending: false });

            // Aplicar Filtros de Tiempo
            if (tipo === 'fecha') {
                const f = document.getElementById('filtro_fecha').value;
                if(f) query = query.gte('created_at', f).lte('created_at', f + 'T23:59:59');
            } else if (tipo === 'rango') {
                const desde = document.getElementById('filtro_desde').value;
                const hasta = document.getElementById('filtro_hasta').value;
                if(desde && hasta) query = query.gte('created_at', desde).lte('created_at', hasta + 'T23:59:59');
            } else if (tipo === 'mes') {
                const mes = document.getElementById('filtro_mes').value; // Formato YYYY-MM
                if(mes) {
                    const primerDia = `${mes}-01`;
                    const ultimoDia = `${mes}-31`; // Supabase manejará el límite
                    query = query.gte('created_at', primerDia).lte('created_at', ultimoDia);
                }
            }

            const { data, error } = await query;

            if (error) {
                alert("Error en la búsqueda");
                return;
            }

            // Filtrar localmente por el "Dato a buscar" (texto)
            const filtrados = data.filter(v => {
                const contenido = `${v.chofer_tel} ${v.cliente_tel} ${v.origen} ${v.destino}`.toLowerCase();
                return contenido.includes(busqueda);
            });

            renderizarResultados(filtrados);
        }

        function renderizarResultados(lista) {
            const tbody = document.getElementById('resultados_busqueda');
            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-slate-400 text-xs font-bold italic uppercase">No hay coincidencias</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.map(v => `
                <tr class="hover:bg-blue-50 transition-colors">
                    <td class="px-6 py-4">
                        <p class="text-[10px] font-black text-slate-800">${new Date(v.created_at).toLocaleDateString()}</p>
                        <p class="text-[8px] text-slate-400 uppercase font-bold">${new Date(v.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                    </td>
                    <td class="px-6 py-4">
                        <p class="text-[10px] font-black text-blue-600">C: ${v.chofer_tel}</p>
                        <p class="text-[10px] font-bold text-slate-500">U: ${v.cliente_tel}</p>
                    </td>
                    <td class="px-6 py-4">
                        <p class="text-[9px] font-bold text-slate-700 uppercase truncate w-32">${v.origen} → ${v.destino}</p>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <p class="text-xs font-black text-slate-900">$${v.precio}</p>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>

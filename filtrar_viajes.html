<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Viajes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .filtro-card { background: white; border-radius: 2rem; padding: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .input-busqueda { border-radius: 1rem; border: 2px solid #e2e8f0; padding: 0.8rem 1rem; width: 100%; outline: none; transition: all 0.3s; }
        .input-busqueda:focus { border-color: #1e5bb9; box-shadow: 0 0 0 3px rgba(30, 91, 185, 0.1); }
        .item-viaje { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 0.8rem; border-left: 5px solid #1e5bb9; }
        .badge { font-size: 9px; font-weight: 900; padding: 4px 8px; rounded-radius: 8px; text-transform: uppercase; }
        .badge-completado { background: #dcfce7; color: #166534; }
        .badge-pendiente { background: #fef9c3; color: #854d0e; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter text-center flex-1">Filtrar Viajes</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-4">
        <div class="filtro-card space-y-4">
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Buscador</label>
                <input type="text" id="busqueda" oninput="aplicarFiltros()" placeholder="Chofer, cliente o destino..." class="input-busqueda">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Desde</label>
                    <input type="date" id="fecha_inicio" onchange="aplicarFiltros()" class="input-busqueda">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Hasta</label>
                    <input type="date" id="fecha_fin" onchange="aplicarFiltros()" class="input-busqueda">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Estado</label>
                <select id="filtro_estado" onchange="aplicarFiltros()" class="input-busqueda">
                    <option value="todos">Todos los estados</option>
                    <option value="completado">Completados</option>
                    <option value="pendiente">Pendientes / Reservas</option>
                    <option value="cancelado">Cancelados</option>
                </select>
            </div>
        </div>

        <div class="flex justify-between items-center px-2">
            <p class="text-[10px] font-black uppercase text-slate-500"><span id="contador_viajes">0</span> Viajes encontrados</p>
            <button onclick="limpiarFiltros()" class="text-[10px] font-black uppercase text-blue-600">Limpiar Filtros</button>
        </div>

        <div id="contenedor_resultados" class="space-y-3">
            </div>
    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        let viajesTodos = [];

        window.onload = async () => {
            await cargarTodosLosViajes();
        };

        async function cargarTodosLosViajes() {
            const { data, error } = await supabaseClient
                .from('viajes')
                .select('*')
                .order('created_at', { ascending: false });

            if (data) {
                viajesTodos = data;
                renderizarViajes(viajesTodos);
            }
        }

        function renderizarViajes(lista) {
            const contenedor = document.getElementById('contenedor_resultados');
            const contador = document.getElementById('contador_viajes');
            
            contador.innerText = lista.length;

            if (lista.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-10 opacity-30 font-black uppercase text-xs">No hay viajes que coincidan</div>`;
                return;
            }

            contenedor.innerHTML = lista.map(v => `
                <div class="item-viaje shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="badge ${v.completado ? 'badge-completado' : 'badge-pendiente'}">
                                ${v.completado ? 'Completado' : 'Pendiente'}
                            </span>
                            <p class="text-[10px] font-bold text-slate-400 mt-1">${new Date(v.created_at).toLocaleDateString()} - ${new Date(v.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                        </div>
                        <p class="text-lg font-black text-blue-700">$${v.precio}</p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-xs font-black uppercase tracking-tighter"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> ${v.origen} → ${v.destino}</p>
                        <p class="text-[10px] font-bold text-slate-600 uppercase">Chofer: ${v.chofer_tel} | Cliente: ${v.cliente_tel}</p>
                    </div>
                </div>
            `).join('');
        }

        function aplicarFiltros() {
            const busqueda = document.getElementById('busqueda').value.toLowerCase();
            const fechaInicio = document.getElementById('fecha_inicio').value;
            const fechaFin = document.getElementById('fecha_fin').value;
            const estado = document.getElementById('filtro_estado').value;

            let filtrados = viajesTodos.filter(v => {
                // Filtro de texto
                const coincideTexto = v.origen.toLowerCase().includes(busqueda) || 
                                     v.destino.toLowerCase().includes(busqueda) || 
                                     v.chofer_tel.includes(busqueda) ||
                                     v.cliente_tel.includes(busqueda);

                // Filtro de fecha
                const fechaViaje = v.created_at.split('T')[0];
                let coincideFecha = true;
                if (fechaInicio) coincideFecha = coincideFecha && (fechaViaje >= fechaInicio);
                if (fechaFin) coincideFecha = coincideFecha && (fechaViaje <= fechaFin);

                // Filtro de estado
                let coincideEstado = true;
                if (estado === 'completado') coincideEstado = v.completado === true;
                if (estado === 'pendiente') coincideEstado = v.completado === false;

                return coincideTexto && coincideFecha && coincideEstado;
            });

            renderizarViajes(filtrados);
        }

        function limpiarFiltros() {
            document.getElementById('busqueda').value = '';
            document.getElementById('fecha_inicio').value = '';
            document.getElementById('fecha_fin').value = '';
            document.getElementById('filtro_estado').value = 'todos';
            renderizarViajes(viajesTodos);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-viaje { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 1rem; shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 6px solid #1e5bb9; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 2rem; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter">Historial de Viajes</h1>
        <button onclick="toggleFiltros()" class="text-xl px-2"><i class="fas fa-filter"></i></button>
    </header>

    <div id="modalFiltros" class="modal">
        <div class="bg-white w-full max-w-sm p-6 rounded-[2.5rem] space-y-4">
            <h2 class="font-black text-center text-slate-800 uppercase">Filtrar Viajes</h2>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="aplicarFiltro('hoy')" class="p-3 bg-slate-100 rounded-xl font-bold hover:bg-blue-100">Hoy</button>
                <button onclick="aplicarFiltro('semana')" class="p-3 bg-slate-100 rounded-xl font-bold hover:bg-blue-100">Esta Semana</button>
                <button onclick="aplicarFiltro('mes')" class="p-3 bg-slate-100 rounded-xl font-bold hover:bg-blue-100">Este Mes</button>
            </div>
            <div class="border-t pt-4 space-y-2">
                <p class="text-[10px] font-black text-slate-400 uppercase">Rango Personalizado</p>
                <input type="date" id="fechaDesde" class="w-full p-2 border rounded-lg text-sm">
                <input type="date" id="fechaHasta" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="aplicarFiltro('rango')" class="w-full p-3 bg-blue-600 text-white rounded-xl font-black uppercase">Aplicar Rango</button>
            </div>
            <button onclick="toggleFiltros()" class="w-full text-xs font-bold text-slate-400 uppercase">Cerrar</button>
        </div>
    </div>

    <main class="p-4 max-w-2xl mx-auto">
        <div id="resumenCarga" class="mb-4 flex justify-between items-center px-4">
            <span id="rangoTexto" class="text-xs font-black text-blue-800 uppercase italic">Cargando viajes...</span>
            <span id="totalDinero" class="text-lg font-black text-green-600">$0.00</span>
        </div>

        <div id="listaViajes">
            </div>
    </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        function toggleFiltros() {
            document.getElementById('modalFiltros').classList.toggle('active');
        }

        window.onload = () => {
            aplicarFiltro('mes'); // Carga el mes actual por defecto
        };

        async function aplicarFiltro(tipo) {
            let query = supabaseClient.from('viajes').select('*').order('created_at', { ascending: false });
            const ahora = new Date();
            let textoFiltro = "";

            if (tipo === 'hoy') {
                const hoy = ahora.toISOString().split('T')[0];
                query = query.gte('created_at', hoy);
                textoFiltro = "Viajes de Hoy";
            } 
            else if (tipo === 'semana') {
                const semanaAtras = new Date(ahora.setDate(ahora.getDate() - 7)).toISOString();
                query = query.gte('created_at', semanaAtras);
                textoFiltro = "Últimos 7 días";
            }
            else if (tipo === 'mes') {
                const mesAtras = new Date(ahora.setMonth(ahora.getMonth() - 1)).toISOString();
                query = query.gte('created_at', mesAtras);
                textoFiltro = "Últimos 30 días";
            }
            else if (tipo === 'rango') {
                const desde = document.getElementById('fechaDesde').value;
                const hasta = document.getElementById('fechaHasta').value;
                if(!desde || !hasta) return alert("Selecciona ambas fechas");
                query = query.gte('created_at', desde).lte('created_at', hasta + 'T23:59:59');
                textoFiltro = `Del ${desde} al ${hasta}`;
            }

            const { data, error } = await query;
            toggleFiltros();
            renderizarViajes(data, textoFiltro);
        }

        function renderizarViajes(viajes, titulo) {
            const contenedor = document.getElementById('listaViajes');
            const txtRango = document.getElementById('rangoTexto');
            const txtTotal = document.getElementById('totalDinero');
            
            txtRango.innerText = titulo;
            contenedor.innerHTML = "";
            let total = 0;

            if (!viajes || viajes.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold italic underline">No se encontraron viajes.</div>`;
                txtTotal.innerText = "$0.00";
                return;
            }

            viajes.forEach(v => {
                total += parseFloat(v.precio || 0);
                const fecha = new Date(v.created_at).toLocaleDateString();
                
                contenedor.innerHTML += `
                    <div class="card-viaje">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase">${fecha} • ${v.chofer_tel || 'Sin Tel'}</p>
                                <h3 class="font-black text-slate-800 text-sm uppercase">${v.origen} <i class="fas fa-arrow-right text-[10px] text-blue-500"></i> ${v.destino}</h3>
                            </div>
                            <span class="bg-green-100 text-green-700 font-black px-3 py-1 rounded-full text-sm">$${v.precio}</span>
                        </div>
                        <div class="flex gap-4 text-[10px] font-bold text-slate-500 uppercase italic">
                            <span><i class="fas fa-users"></i> ${v.pax} Pax</span>
                            <span><i class="fas fa-id-badge"></i> ${v.chofer || 'Chofer'}</span>
                            ${v.ida_vuelta ? '<span class="text-blue-600 border border-blue-600 px-1 rounded">I/V</span>' : ''}
                        </div>
                    </div>
                `;
            });

            txtTotal.innerText = `$${total.toFixed(2)}`;
        }
    </script>
</body>
</html>

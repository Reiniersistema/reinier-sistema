<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - RF TransGestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dorado: #d4af37; --oscuro: #121212; --gris: #1e1e1e; --rojo: #ff4d4d; --azul: #3498db; }
        body { background: var(--oscuro); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* ESTILOS DEL MENÚ UNIVERSAL */
        .sidebar {
            height: 100%; width: 0; position: fixed;
            z-index: 3000; top: 0; left: 0;
            background-color: #1e1e1e;
            overflow-x: hidden; transition: 0.5s;
            padding-top: 60px; border-right: 1px solid #d4af37;
        }
        .sidebar a {
            padding: 12px 24px; text-decoration: none;
            font-size: 15px; color: #818181;
            display: block; transition: 0.3s;
            text-transform: uppercase;
        }
        .sidebar a:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #d4af37; }

        .header-nav-universal { 
            display: flex; align-items: center; gap: 15px; 
            padding: 15px; background: #121212; 
            border-bottom: 1px solid #d4af37; margin-bottom: 20px;
        }
        .openbtn { font-size: 25px; cursor: pointer; background: none; border: none; color: #d4af37; }
        .logo-txt-universal { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }

        /* Estilos propios de la página */
        .contenedor-principal { padding: 0 15px; }
        .header-seccion { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--dorado); text-transform: uppercase; font-size: 18px; margin: 0; }

        .btn-embudo { background: var(--dorado); border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .panel-filtros { display: none; background: var(--gris); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--dorado); }
        .opciones-filtro { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-filtro { background: transparent; border: 1px solid var(--dorado); color: white; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .btn-filtro.active { background: var(--dorado); color: black; }

        .tabla-contenedor { overflow-x: auto; background: var(--gris); border-radius: 15px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { color: var(--dorado); text-align: left; padding: 12px; border-bottom: 2px solid #333; font-size: 11px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 13px; }
        
        .badge-user { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 10px; color: var(--dorado); text-transform: uppercase; }
        .badge-tipo { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: bold; text-transform: uppercase; display: inline-block; margin-top: 5px; }
        .tipo-entrada { background: #2ecc71; color: black; }
        .tipo-salida { background: #e67e22; color: white; }

        .btn-accion { padding: 6px 10px; border-radius: 4px; border: none; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-right: 5px; }
        .btn-edit { background: var(--azul); color: white; }
        .btn-del { background: var(--rojo); color: white; }

        .fecha-txt { color: #aaa; font-size: 11px; }
        small { display: block; margin-top: 4px; }
    </style>
</head>
<body>

<div class="contenedor-principal">
    <div class="header-seccion">
        <h2 id="titulo-historial">Historial de Viajes</h2>
        <button class="btn-embudo" onclick="toggleFiltros()">⏳</button>
    </div>

    <div id="panelFiltros" class="panel-filtros">
        <button id="btn-solo-mio" class="btn-filtro" style="width: 100%; margin-bottom: 15px; border-style: dashed;" onclick="toggleFiltroUsuario()">👤 VER SOLO MIS VIAJES</button>
        <div class="opciones-filtro">
            <button id="f-hoy" class="btn-filtro" onclick="aplicarFiltro('hoy')">HOY</button>
            <button id="f-semana" class="btn-filtro" onclick="aplicarFiltro('semana')">ESTA SEMANA</button>
            <button id="f-mes" class="btn-filtro" onclick="aplicarFiltro('mes')">ESTE MES</button>
            <button id="f-todos" class="btn-filtro active" onclick="aplicarFiltro('todos')">TODOS</button>
        </div>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Fecha / Hora</th>
                    <th>Colaboración</th>
                    <th>Chofer</th>
                    <th>Precio</th>
                    <th>Ruta</th>
                    <th>Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-viajes">
                <tr><td colspan="7" style="text-align:center; padding:20px;">Cargando viajes...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script>
    let filtroSoloMio = false;
    let filtroTiempoActual = 'todos';

    function toggleFiltros() {
        const p = document.getElementById('panelFiltros');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    function toggleFiltroUsuario() {
        filtroSoloMio = !filtroSoloMio;
        const btn = document.getElementById('btn-solo-mio');
        btn.classList.toggle('active');
        btn.style.background = filtroSoloMio ? 'var(--dorado)' : 'transparent';
        btn.style.color = filtroSoloMio ? 'black' : 'white';
        cargarViajes(filtroTiempoActual);
    }

    function aplicarFiltro(tipo) {
        filtroTiempoActual = tipo;
        // Actualizar UI de botones
        document.querySelectorAll('.opciones-filtro .btn-filtro').forEach(b => b.classList.remove('active'));
        document.getElementById(`f-${tipo}`).classList.add('active');
        cargarViajes(tipo);
    }

    function formatearFecha(isoString) {
        const fecha = new Date(isoString);
        return fecha.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) + 
               ' <br> <span class="fecha-txt">' + fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '</span>';
    }

    // Lógica para calcular rangos de fecha
    function obtenerFechasFiltro(tipo) {
        const ahora = new Date();
        let inicio = new Date();
        
        if (tipo === 'hoy') {
            inicio.setHours(0, 0, 0, 0);
        } else if (tipo === 'semana') {
            const dia = inicio.getDay(); // 0 (Dom) a 6 (Sab)
            const diff = inicio.getDate() - dia + (dia === 0 ? -6 : 1); // Lunes
            inicio = new Date(inicio.setDate(diff));
            inicio.setHours(0, 0, 0, 0);
        } else if (tipo === 'mes') {
            inicio = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
            inicio.setHours(0, 0, 0, 0);
        } else {
            return null; // Para 'todos'
        }
        return inicio.toISOString();
    }

    async function cargarViajes(filtro = 'todos') {
        const tbody = document.getElementById('lista-viajes');
        const userActivo = JSON.parse(localStorage.getItem('usuario_activo'));
        const nombreUsuarioActual = userActivo ? userActivo.nombre : '';

        let query = supabaseClient
            .from('viajes')
            .select('id, precio, origen, destino, usuario_gestor, chofer_id, created_at, colaboracion, tipo_agencia')
            .order('created_at', { ascending: false });

        // Aplicar filtro de Usuario
        if (filtroSoloMio) {
            query = query.eq('usuario_gestor', nombreUsuarioActual);
        }

        // Aplicar filtro de Tiempo
        const fechaInicio = obtenerFechasFiltro(filtro);
        if (fechaInicio) {
            query = query.gte('created_at', fechaInicio);
        }

        const { data: viajes, error } = await query;
        
        if (error) {
            tbody.innerHTML = "<tr><td colspan='7'>Error al cargar datos.</td></tr>";
            return;
        }

        if (viajes && viajes.length > 0) {
            // Traer nombres de choferes para el mapeo
            const { data: choferes } = await supabaseClient.from('choferes').select('id, nombre');
            const choferMap = {};
            if(choferes) choferes.forEach(c => choferMap[c.id] = c.nombre);

            tbody.innerHTML = viajes.map(v => {
                const esMio = (v.usuario_gestor === nombreUsuarioActual);
                const colabNombre = v.colaboracion || 'Directo';
                const tipoClase = v.tipo_agencia === 'Entrada' ? 'tipo-entrada' : 'tipo-salida';
                const tipoBadge = v.tipo_agencia ? `<br><span class="badge-tipo ${tipoClase}">${v.tipo_agencia}</span>` : '';

                return `
                <tr>
                    <td style="font-size: 11px;">${formatearFecha(v.created_at)}</td>
                    <td>
                        <b style="color:white; font-size:12px;">${colabNombre}</b>
                        ${tipoBadge}
                    </td>
                    <td><b>${choferMap[v.chofer_id] || 'Chófer'}</b></td>
                    <td style="color:var(--dorado); font-weight:bold;">$${v.precio}</td>
                    <td>${v.origen} <br> <small style="color:#888">→ ${v.destino}</small></td>
                    <td><span class="badge-user">${v.usuario_gestor || 'Admin'}</span></td>
                    <td>
                        ${esMio ? `
                            <button class="btn-accion btn-edit" onclick="editarViaje('${v.id}')">EDIT</button>
                            <button class="btn-accion btn-del" onclick="eliminarViaje('${v.id}')">ELIM</button>
                        ` : '<span style="color:#444; font-size:9px;">Sin permisos</span>'}
                    </td>
                </tr>
                `;
            }).join('');
        } else {
            tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>No se encontraron viajes para este filtro.</td></tr>";
        }
    }

    function editarViaje(id) { window.location.href = `editar-viaje.html?id=${id}`; }

    async function eliminarViaje(id) {
        if (!confirm("¿Deseas eliminar este viaje permanentemente?")) return;
        const { error } = await supabaseClient.from('viajes').delete().eq('id', id);
        if (!error) {
            alert("Viaje eliminado");
            cargarViajes(filtroTiempoActual);
        } else {
            alert("Error al eliminar");
        }
    }

    // Carga inicial
    cargarViajes();
</script>
</body>
</html>

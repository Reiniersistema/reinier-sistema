<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        
        .glass-card { background: white; border-radius: 1.5rem; border-bottom: 4px solid #e2e8f0; overflow: hidden; }
        .logo-text { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; }
        
        .filter-btn {
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        .filter-btn.active {
            background-color: #1e5bb9;
            color: white;
            border-color: #1e5bb9;
        }
        
        .row-viaje:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="logo-text text-lg text-center flex-1">Historial de Viajes</h1>
        <button onclick="toggleFiltros()" class="w-10 text-xl"><i class="fas fa-filter"></i></button>
    </header>

    <main class="p-4 max-w-4xl mx-auto">
        
        <div id="panel_filtros" class="hidden mb-6 bg-white p-6 rounded-3xl shadow-lg border border-slate-200">
            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Seleccionar Período</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
                <button onclick="aplicarFiltro('hoy', this)" class="filter-btn py-2 rounded-xl text-[10px] font-black uppercase active">Hoy</button>
                <button onclick="aplicarFiltro('semana', this)" class="filter-btn py-2 rounded-xl text-[10px] font-black uppercase">Semana</button>
                <button onclick="aplicarFiltro('mes', this)" class="filter-btn py-2 rounded-xl text-[10px] font-black uppercase">Mes</button>
                <button onclick="activarRango(this)" class="filter-btn py-2 rounded-xl text-[10px] font-black uppercase">Desde-Hasta</button>
            </div>
            
            <div id="rango_fechas" class="hidden grid grid-cols-2 gap-3 pt-4 border-t border-slate-100">
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400">Desde</label>
                    <input type="date" id="fecha_desde" class="w-full bg-slate-50 p-2 rounded-lg text-xs font-bold outline-none">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-400">Hasta</label>
                    <input type="date" id="fecha_hasta" class="w-full bg-slate-50 p-2 rounded-lg text-xs font-bold outline-none">
                </div>
                <button onclick="aplicarFiltro('rango')" class="col-span-2 bg-slate-800 text-white py-3 rounded-xl text-[10px] font-black uppercase mt-2">Aplicar Rango</button>
            </div>
        </div>

        <div class="glass-card shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="px-4 py-4 text-[9px] font-black uppercase text-slate-500">Fecha</th>
                            <th class="px-4 py-4 text-[9px] font-black uppercase text-slate-500">Chofer</th>
                            <th class="px-4 py-4 text-[9px] font-black uppercase text-slate-500">Ruta</th>
                            <th class="px-4 py-4 text-[9px] font-black uppercase text-slate-500 text-right">Precio</th>
                        </tr>
                    </thead>
                    <tbody id="lista_viajes" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="px-6 py-10 text-center text-slate-400 text-xs font-bold italic">
                                Cargando viajes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // supabaseClient se hereda de config.js

        window.onload = () => {
            aplicarFiltro('hoy');
        };

        function toggleFiltros() {
            document.getElementById('panel_filtros').classList.toggle('hidden');
        }

        function activarRango(btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('rango_fechas').classList.remove('hidden');
        }

        async function aplicarFiltro(tipo, btn) {
            if (btn) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (tipo !== 'rango') document.getElementById('rango_fechas').classList.add('hidden');
            }

            let consulta = supabaseClient.from('viajes').select('*').order('created_at', { ascending: false });

            const ahora = new Date();
            
            if (tipo === 'hoy') {
                const hoy = ahora.toISOString().split('T')[0];
                consulta = consulta.gte('created_at', hoy);
            } 
            else if (tipo === 'semana') {
                const haceUnaSemana = new Date(ahora.setDate(ahora.getDate() - 7)).toISOString();
                consulta = consulta.gte('created_at', haceUnaSemana);
            } 
            else if (tipo === 'mes') {
                const inicioMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1).toISOString();
                consulta = consulta.gte('created_at', inicioMes);
            }
            else if (tipo === 'rango') {
                const desde = document.getElementById('fecha_desde').value;
                const hasta = document.getElementById('fecha_hasta').value;
                if (!desde || !hasta) return alert("Selecciona ambas fechas");
                consulta = consulta.gte('created_at', desde).lte('created_at', hasta + 'T23:59:59');
            }

            const { data, error } = await consulta;

            if (error) {
                console.error("Error cargando viajes:", error);
                return;
            }

            renderizarViajes(data);
        }

        function renderizarViajes(viajes) {
            const tbody = document.getElementById('lista_viajes');
            if (viajes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-10 text-center text-slate-400 text-xs font-bold">No se encontraron viajes en este periodo.</td></tr>`;
                return;
            }

            tbody.innerHTML = viajes.map(v => {
                const fechaObj = new Date(v.created_at);
                const fecha = fechaObj.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
                const hora = fechaObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                return `
                    <tr class="row-viaje hover:bg-blue-50 transition-colors">
                        <td class="px-4 py-4">
                            <p class="text-[10px] font-black text-slate-800">${fecha}</p>
                            <p class="text-[8px] text-slate-400">${hora}</p>
                        </td>
                        <td class="px-4 py-4">
                            <p class="text-[10px] font-black text-blue-600">${v.chofer_tel}</p>
                            <p class="text-[8px] font-bold text-slate-400 uppercase">${v.colaboracion || 'Directo'}</p>
                        </td>
                        <td class="px-4 py-4">
                            <div class="flex items-center gap-1">
                                <span class="text-[9px] font-bold text-slate-700 truncate w-20">${v.origen}</span>
                                <i class="fas fa-arrow-right text-[7px] text-slate-300"></i>
                                <span class="text-[9px] font-bold text-slate-700 truncate w-20">${v.destino}</span>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-right">
                            <p class="text-xs font-black text-slate-900">$${v.precio}</p>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - CONGO MUSUNDI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .viaje-card { background: white; border-radius: 2rem; padding: 1.2rem; margin-bottom: 1rem; border-bottom: 4px solid #e2e8f0; }
        .status-badge { font-size: 9px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }
        .status-live { background: #fee2e2; color: #ef4444; animation: pulse 2s infinite; }
        .status-done { background: #dcfce7; color: #166534; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="pb-20">

    <header class="bg-[#1e5bb9] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <a href="panel.html" class="text-xl w-10"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-black italic uppercase tracking-tighter text-center flex-1">Viajes Activos</h1>
        <button onclick="location.reload()" class="text-xl w-10"><i class="fas fa-sync-alt"></i></button>
    </header>

    <main class="p-4 max-w-2xl mx-auto" id="listaViajes">
        </main>

    <script>
        const URL_PROYECTO = 'https://rkcqrnqlmuzcvwlgkmyb.supabase.co'; 
        const CLAVE_API = 'sb_publishable_rCrNB27M4ypZk7j0a10p_Q_3iNO7qRO';
        const supabaseClient = supabase.createClient(URL_PROYECTO, CLAVE_API);

        window.onload = cargarViajes;

        async function cargarViajes() {
            const { data, error } = await supabaseClient
                .from('viajes')
                .select('*')
                .order('created_at', { ascending: false });

            if(error) {
                console.error(error);
                return;
            }

            const lista = document.getElementById('listaViajes');
            if(data.length === 0) {
                lista.innerHTML = `<div class="text-center py-20 opacity-20 font-black uppercase italic">No hay viajes registrados</div>`;
                return;
            }

            lista.innerHTML = data.map(v => `
                <div class="viaje-card shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="status-badge ${v.completado ? 'status-done' : 'status-live'}">
                                ${v.completado ? 'Finalizado' : '• En Camino'}
                            </span>
                            <p class="text-[10px] font-black text-slate-400 mt-1 uppercase tracking-widest">
                                ${new Date(v.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black text-blue-700">$${v.precio}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">${v.colaboracion}</p>
                        </div>
                    </div>

                    <div class="space-y-2 border-l-2 border-dashed border-slate-200 pl-4 ml-1">
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase">Origen</p>
                            <p class="text-xs font-bold text-slate-800 uppercase">${v.origen}</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase">Destino</p>
                            <p class="text-xs font-bold text-slate-800 uppercase">${v.destino}</p>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">
                                <i class="fas fa-steering-wheel"></i>
                            </div>
                            <div>
                                <p class="text-[9px] font-black text-slate-400 uppercase">Chófer</p>
                                <p class="text-[10px] font-bold text-slate-700">${v.chofer_tel}</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            ${!v.completado ? `
                                <button onclick="marcarCompletado('${v.id}')" class="bg-green-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase shadow-md shadow-green-100">Finalizar</button>
                            ` : `
                                <i class="fas fa-check-circle text-green-500 text-xl"></i>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function marcarCompletado(id) {
            if(confirm("¿Confirmas que el viaje ha finalizado?")) {
                const { error } = await supabaseClient
                    .from('viajes')
                    .update({ completado: true })
                    .eq('id', id);
                
                if(!error) cargarViajes();
            }
        }
    </script>
</body>
</html>
